<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Black Summit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --fg:#ece6d8; --dim:#9b958a; --faint:rgba(236,230,216,.14); --accent:#e0a84a; --accent2:#f2c879;
  --red:#e2412c; --ok:#8fd17a; --panel:rgba(8,10,12,.62); --line:rgba(236,230,216,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);
  font-family:'Oswald',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- scope / overlays ---------- */
#scope{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .25s}
#dmg{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(120,0,0,0) 45%,rgba(140,0,0,.75) 100%)}
#letterbox:before,#letterbox:after{content:"";position:fixed;left:0;right:0;height:0;background:#000;transition:height .5s;z-index:5}
#letterbox:before{top:0}#letterbox:after{bottom:0}
#letterbox.on:before,#letterbox.on:after{height:9vh}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:6}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#obj{position:absolute;left:24px;top:22px;min-width:280px;max-width:360px;padding:12px 16px 12px}
#obj .code{font-size:11px;letter-spacing:.32em;color:var(--accent)}
#obj .ttl{font-size:20px;letter-spacing:.12em;font-weight:500;margin:2px 0 8px}
#obj ul{list-style:none;font-size:14px;font-weight:300;letter-spacing:.03em}
#obj li{display:flex;gap:9px;align-items:flex-start;margin:5px 0;line-height:1.25}
#obj li i{flex:0 0 12px;height:12px;margin-top:3px;border:1px solid var(--fg);transform:rotate(45deg) scale(.8)}
#obj li.done{color:var(--dim);text-decoration:line-through}
#obj li.done i{background:var(--ok);border-color:var(--ok)}
#obj li.fail{color:var(--red)} #obj li.fail i{background:var(--red);border-color:var(--red)}
#obj li.opt{opacity:.82} #obj li.opt span:after{content:" (optional)";color:var(--dim);font-size:12px}
#compass{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:520px;height:40px;
  -webkit-mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#alert{position:absolute;right:24px;top:22px;width:250px;text-align:right}
#alert .lbl{font-size:11px;letter-spacing:.32em;color:var(--dim)}
#alert .bar{height:4px;background:var(--faint);margin-top:6px;overflow:hidden}
#alert .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s,background .2s}
#alertTxt{font-size:13px;margin-top:6px;letter-spacing:.12em;color:var(--dim)}
#alert.alarm .lbl,#alert.alarm #alertTxt{color:var(--red);animation:blink .6s infinite}
#alert.alarm .bar i{background:var(--red)}
@keyframes blink{50%{opacity:.35}}
#timer{position:absolute;right:24px;top:84px;font-size:26px;color:var(--red);text-shadow:0 0 12px rgba(226,65,44,.6)}
#wind{position:absolute;left:24px;bottom:24px;display:flex;gap:12px;align-items:center;padding:10px 16px 10px 10px}
#windTxt{font-size:13px;line-height:1.5;letter-spacing:.06em}
#windTxt b{font-size:20px;color:var(--accent2);font-weight:400}
#ballistics{position:absolute;right:24px;bottom:96px;padding:10px 16px;font-size:13px;line-height:1.6;letter-spacing:.08em;text-align:right;min-width:200px}
#ballistics b{color:var(--accent2);font-weight:400;font-size:17px}
#ballistics .k{color:var(--dim)}
#ammo{position:absolute;right:24px;bottom:24px;display:flex;gap:14px;align-items:flex-end}
#rounds{display:flex;gap:5px}
#rounds i{width:7px;height:34px;border-radius:4px 4px 1px 1px;background:linear-gradient(#e7c27a 0 30%,#b88a3a 30% 100%);box-shadow:0 0 6px rgba(231,194,122,.4)}
#rounds i.empty{background:var(--faint);box-shadow:none}
#reserve{font-size:22px;line-height:1}
#reserve small{display:block;font-size:10px;color:var(--dim);letter-spacing:.3em}
#bolt{position:absolute;right:24px;bottom:66px;font-size:12px;letter-spacing:.3em;color:var(--accent)}
#breath{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:180px;height:3px;background:var(--faint);opacity:0;transition:opacity .3s}
#breath i{display:block;height:100%;width:100%;background:#cfe6ff}
#health{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:240px;height:3px;background:var(--faint)}
#health i{display:block;height:100%;width:100%;background:var(--fg);transition:width .3s}
#dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 4px #000}
#hitmark{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0}
#hitmark:before,#hitmark:after{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;margin-left:-1px;background:currentColor;transform:rotate(45deg);
  -webkit-mask:linear-gradient(transparent 0 35%,#000 35% 65%,transparent 65%);mask:linear-gradient(#000 0 35%,transparent 35% 65%,#000 65%)}
#hitmark:after{transform:rotate(-45deg)}
#toasts{position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center}
.toast{font-size:26px;letter-spacing:.24em;font-weight:500;text-shadow:0 2px 14px rgba(0,0,0,.8);animation:toast 2.6s forwards}
.toast small{display:block;font-size:13px;letter-spacing:.35em;color:var(--accent2);font-weight:400;margin-top:2px}
@keyframes toast{0%{opacity:0;transform:translateY(10px) scale(1.15)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#radio{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);max-width:min(760px,86vw);padding:12px 20px 13px;opacity:0;transition:opacity .3s;display:flex;gap:14px;align-items:flex-start}
#radio.on{opacity:1}
#radio .who{font-size:11px;letter-spacing:.3em;color:var(--accent);white-space:nowrap;padding-top:4px}
#radio .txt{font-size:17px;font-weight:300;letter-spacing:.02em;line-height:1.4}
#radio .wave{display:flex;gap:2px;align-items:center;height:22px}
#radio .wave i{width:2px;background:var(--accent);animation:wave .5s infinite alternate}
@keyframes wave{from{height:3px}to{height:18px}}
#hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:13px;letter-spacing:.14em;color:rgba(236,230,216,.8);text-align:center;text-shadow:0 1px 6px #000;transition:opacity .4s}
#hint kbd{font-family:inherit;border:1px solid var(--line);padding:1px 6px;margin:0 2px;background:rgba(0,0,0,.35)}
#bcTag{position:absolute;left:32px;top:50%;transform:translateY(-50%);font-size:12px;letter-spacing:.4em;color:var(--accent2);display:none;line-height:2}
#bcTag b{display:block;font-size:30px;color:var(--fg);letter-spacing:.12em;font-weight:500}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;z-index:10}
.screen.on{display:block}
#loading{position:fixed;inset:0;background:#050607;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .9s}
#loading h2{font-weight:300;letter-spacing:.7em;font-size:15px;color:var(--dim);margin-right:-.7em}
#loading .bar{width:260px;height:2px;background:var(--faint)}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#loading p{font-size:12px;letter-spacing:.25em;color:var(--dim)}

#title{background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.45) 38%,rgba(0,0,0,0) 62%),linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0) 40%)}
.logo{position:absolute;left:7vw;top:11vh}
.logo .pre{font-size:13px;letter-spacing:.6em;color:var(--accent)}
.logo h1{font-size:clamp(56px,9vw,132px);line-height:.86;font-weight:700;letter-spacing:.04em;margin-top:12px;
  background:linear-gradient(180deg,#fff 0%,#e8dfcb 55%,#9a8f78 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(0,0,0,.6))}
.logo h1 span{display:block;color:transparent}
.logo .sub{margin-top:18px;font-size:15px;letter-spacing:.42em;font-weight:300;color:var(--dim)}
.menu{position:absolute;left:7vw;bottom:11vh;display:flex;flex-direction:column;gap:6px;min-width:300px}
.menu button{text-align:left;font-size:20px;letter-spacing:.24em;font-weight:400;padding:9px 0 9px 0;color:var(--dim);transition:color .2s,padding .2s;position:relative}
.menu button:before{content:"";position:absolute;left:-26px;top:50%;width:14px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.menu button:hover,.menu button:focus-visible{color:var(--fg);padding-left:10px;outline:none}
.menu button:hover:before,.menu button:focus-visible:before{transform:none}
.menu button.primary{color:var(--fg);font-weight:500}
@media (max-height:620px){.logo h1{font-size:54px}.logo .sub{display:none}.menu button{font-size:16px;padding:5px 0}}
.menu .play{white-space:nowrap;background:var(--accent);color:#111;font-size:30px;font-weight:600;letter-spacing:.3em;padding:16px 46px 16px 52px;border-radius:3px;
  box-shadow:0 0 0 0 rgba(224,168,74,.6);animation:pulse 2.2s infinite;text-align:center}
.menu .play span{font-size:22px;margin-right:6px;vertical-align:2px}
.menu .play:hover,.menu .play:focus-visible{padding:16px 46px 16px 52px;color:#111;background:var(--accent2)}
.menu .play:before{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,168,74,.55)}70%{box-shadow:0 0 0 18px rgba(224,168,74,0)}100%{box-shadow:0 0 0 0 rgba(224,168,74,0)}}
.playsub{white-space:nowrap;font-size:12px;letter-spacing:.3em;color:var(--dim);margin:12px 0 18px;text-align:center}
.menu .minor{display:flex;gap:28px;justify-content:center}
.menu .minor button{font-size:14px;letter-spacing:.3em;padding:6px 0}
.menu .minor button:hover{padding-left:0}
@media (orientation:portrait){.menu{left:50%;transform:translateX(-50%);align-items:center;min-width:0}}
#cineUI{position:fixed;inset:0;z-index:9;display:none;pointer-events:none}
#cineUI.on{display:block}
#cineSkip{position:absolute;right:calc(18px + env(safe-area-inset-right));top:calc(11vh + 6px);pointer-events:auto;font-size:14px;letter-spacing:.3em;padding:10px 18px 10px 22px;
  border:1px solid rgba(236,230,216,.5);background:rgba(0,0,0,.35);color:var(--fg)}
#cineLine{position:absolute;left:50%;bottom:calc(9vh + 26px);transform:translateX(-50%);width:min(760px,88vw);text-align:center;font-size:clamp(17px,2.4vw,26px);
  font-weight:400;letter-spacing:.03em;line-height:1.35;text-shadow:0 2px 12px #000,0 0 2px #000}
#cineLine.show{animation:cine 0.7s ease-out}
@keyframes cine{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#cineTag{position:absolute;display:none;transform:translate(-50%,-100%);font:500 12px 'Share Tech Mono',monospace;letter-spacing:.25em;color:var(--accent2);
  padding:0 0 26px;white-space:nowrap;text-shadow:0 1px 6px #000}
#cineTag:after{content:"";position:absolute;left:50%;bottom:4px;width:1px;height:18px;background:var(--accent2)}
#cineTag.vip{color:#ff5a3c}#cineTag.vip:after{background:#ff5a3c}
.foot{position:absolute;left:7vw;bottom:5vh;font-size:12px;letter-spacing:.2em;color:var(--dim)}
#sub{position:absolute;right:6vw;top:14vh;width:min(560px,48vw);max-height:76vh;overflow:auto;display:none;padding:26px 28px}
#sub.on{display:block}
#sub h3{font-size:12px;letter-spacing:.45em;color:var(--accent);font-weight:400;margin-bottom:16px}
.mcard{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer;transition:background .2s}
.mcard:hover{background:rgba(255,255,255,.04)}
.mcard .n{font-size:30px;font-weight:300;color:var(--accent)}
.mcard .t{font-size:19px;letter-spacing:.14em}
.mcard .d{font-size:12px;letter-spacing:.14em;color:var(--dim);margin-top:2px}
.mcard .s{font-size:16px;color:var(--accent2);letter-spacing:.1em}
.mcard.locked{opacity:.35;cursor:not-allowed}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:15px;font-weight:300}
.keys kbd{font-family:'Share Tech Mono',monospace;font-size:13px;border:1px solid var(--line);padding:2px 8px;justify-self:start;color:var(--accent2)}
.note{margin-top:18px;font-size:13px;color:var(--dim);line-height:1.6;font-weight:300}

#briefing{background:linear-gradient(90deg,rgba(3,4,5,.92) 0%,rgba(3,4,5,.78) 52%,rgba(3,4,5,.35) 100%)}
.bwrap{position:absolute;inset:7vh 6vw;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:5vw}
.bhead .code{font-size:12px;letter-spacing:.5em;color:var(--accent)}
.bhead h2{font-size:clamp(40px,5vw,72px);font-weight:700;letter-spacing:.06em;line-height:1;margin:10px 0 8px}
.bhead .meta{font-size:13px;letter-spacing:.3em;color:var(--dim)}
.story{margin-top:3.5vh;max-width:640px;font-size:17px;line-height:1.7;font-weight:300;color:#d9d3c5;min-height:30vh}
.story p{margin-bottom:14px}
.story .caret{display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:-2px;animation:blink .8s infinite}
.bobj{margin-top:2vh}
.bobj h4,.dossier h4,.intel h4{font-size:11px;letter-spacing:.42em;color:var(--accent);font-weight:400;margin-bottom:10px}
.bobj li{list-style:none;font-size:15px;font-weight:300;margin:5px 0;padding-left:20px;position:relative}
.bobj li:before{content:"";position:absolute;left:2px;top:8px;width:7px;height:7px;border:1px solid var(--fg);transform:rotate(45deg)}
.bobj li.opt{color:var(--dim)}
.dossier{padding:18px;align-self:start}
.dossier .pic{width:100%;aspect-ratio:4/5;background:#111;position:relative;overflow:hidden;border:1px solid var(--line)}
.dossier .pic img{width:100%;height:100%;object-fit:cover;filter:grayscale(.55) contrast(1.15) sepia(.2) blur(.4px)}
.dossier .pic:after{content:"TARGET";position:absolute;right:10px;top:10px;font-size:10px;letter-spacing:.4em;color:var(--red);border:1px solid var(--red);padding:3px 6px 3px 9px}
.dossier .pic .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.dossier .nm{font-size:24px;letter-spacing:.08em;margin-top:14px;font-weight:500}
.dossier .al{font-size:13px;letter-spacing:.3em;color:var(--accent2)}
.dossier .ds{font-size:14px;font-weight:300;color:var(--dim);margin-top:10px;line-height:1.55}
.intel{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.intel span{color:var(--dim);letter-spacing:.2em}
.intel b{font-weight:400;font-family:'Share Tech Mono',monospace;color:var(--fg)}
.bbtns{position:absolute;left:0;bottom:0;display:flex;gap:16px}
.btn{font-size:16px;letter-spacing:.32em;padding:14px 30px 14px 34px;border:1px solid var(--line);transition:all .2s;background:rgba(0,0,0,.25)}
.btn:hover,.btn:focus-visible{border-color:var(--fg);outline:none}
.btn.go{background:var(--accent);color:#111;border-color:var(--accent);font-weight:500}
.btn.go:hover{background:var(--accent2)}

#pause{background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(560px,90vw)}
.center h2{font-size:44px;letter-spacing:.3em;font-weight:500;margin-bottom:26px;margin-right:-.3em}
.center .col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.opts{margin:22px 0 4px;display:grid;grid-template-columns:auto 1fr;gap:12px 16px;text-align:left;font-size:14px;letter-spacing:.14em;align-items:center}
.opts select,.opts input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--fg);font:inherit;padding:6px 8px;accent-color:var(--accent)}

#debrief{background:radial-gradient(ellipse at 30% 50%,rgba(0,0,0,.55),rgba(0,0,0,.9))}
#debrief .wrap{position:absolute;left:8vw;top:12vh;right:8vw;bottom:10vh;display:grid;grid-template-columns:1fr minmax(260px,360px);gap:6vw}
#debrief .res{font-size:12px;letter-spacing:.55em;color:var(--accent)}
#debrief .res.fail{color:var(--red)}
#debrief h2{font-size:clamp(40px,5.5vw,80px);font-weight:700;letter-spacing:.05em;line-height:1;margin:10px 0 0}
#debrief .stars{font-size:28px;letter-spacing:.3em;color:var(--accent2);margin-top:12px}
#debrief .story{min-height:0}
.stats{padding:20px 22px;align-self:start}
.stats div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.16em}
.stats div:last-child{border:0}
.stats b{font-family:'Share Tech Mono',monospace;font-weight:400;color:var(--accent2);font-size:16px}
/* ---------- touch controls ---------- */
canvas#c{touch-action:none}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:7;touch-action:none}
body.touch.playing #touch{display:block}
body.bc #touch,body.bc #hud>*:not(#bcTag):not(#toasts){display:none!important}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;width:70px;height:70px;
  background:rgba(10,12,14,.42);border:1.5px solid rgba(236,230,216,.35);color:var(--fg);font:500 12px/1.1 'Oswald',sans-serif;letter-spacing:.14em;
  display:flex;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.tb.on{background:rgba(224,168,74,.55);border-color:var(--accent);color:#111}
#tFire{width:92px;height:92px;right:calc(20px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));font-size:15px;border-color:rgba(226,65,44,.8);background:rgba(120,20,10,.38)}
#tFire.on{background:rgba(226,65,44,.7);color:#fff;transform:scale(.94)}
#tScope{left:calc(20px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom))}
#tTherm{right:calc(26px + env(safe-area-inset-right));bottom:calc(128px + env(safe-area-inset-bottom));width:52px;height:52px;font-size:9px;display:none}
body.night #tTherm{display:flex}
#tPause{right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));border-radius:8px;width:38px;height:38px;font-size:11px;background:rgba(10,12,14,.3)}
#obj.mini ul{display:none}#obj.mini .ttl{margin:0}
body.touch #obj.mini{opacity:.75}
body.touch #alert .lbl{display:none!important}body.touch #alert:not(.alarm) #alertTxt{display:none}
#snipeWarn{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:6px 14px 6px 10px;
  background:rgba(60,8,4,.55);border:1px solid rgba(255,90,50,.55);color:#ffb08a;font-size:16px;letter-spacing:.12em}
#snipeWarn i{width:18px;height:18px;border:2px solid #ff6a40;border-radius:50%;position:relative}
#snipeWarn i:before,#snipeWarn i:after{content:"";position:absolute;background:#ff6a40;left:50%;top:-5px;width:2px;height:24px;margin-left:-1px}
#snipeWarn i:after{transform:rotate(90deg)}
#snipeArrow{position:absolute;display:none;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:30px solid #ff8a1e;filter:drop-shadow(0 0 6px rgba(255,120,30,.9))}
#snipeWarn.hot{animation:blink .5s infinite;color:#fff}
body.touch #snipeWarn{top:52px}
@media (orientation:portrait){body.touch #snipeWarn{left:auto;right:calc(12px + env(safe-area-inset-right));transform:none;top:calc(58px + env(safe-area-inset-top));font-size:13px}}
/* compact HUD on phones */
body.touch #ballistics,body.touch #compass{display:none}
body.touch #obj{left:calc(12px + env(safe-area-inset-left));top:10px;min-width:0;max-width:260px;padding:8px 12px}
body.touch #obj .ttl{font-size:15px;margin:0 0 4px}
body.touch #obj ul{font-size:12px}
body.touch #alert{right:62px;top:14px;width:150px}
body.touch #alert .lbl{font-size:9px;letter-spacing:.22em}
body.touch #timer{right:62px;top:56px;font-size:20px}
body.touch #wind{left:calc(12px + env(safe-area-inset-left));bottom:calc(112px + env(safe-area-inset-bottom));padding:6px 10px 6px 6px;gap:8px}
body.touch #windC{width:44px!important;height:44px!important}
body.touch #windTxt{font-size:11px}body.touch #windTxt b{font-size:15px}
body.touch #ammo{right:auto;left:50%;transform:translateX(-50%);bottom:auto;top:10px}
body.touch #rounds i{height:24px;width:6px}
body.touch #reserve{font-size:16px}
body.touch #bolt{right:auto;left:50%;transform:translateX(-50%);bottom:auto;top:46px}
body.touch #health{bottom:6px;width:160px}
body.touch #radio{bottom:62px;max-width:min(520px,52vw);padding:8px 14px}
body.touch #radio .txt{font-size:13px}
body.touch #hint{top:auto;bottom:150px;font-size:11px}
body.touch #toasts{top:22%}
body.touch .toast{font-size:20px}
@media (max-height:520px){
  .bwrap{inset:3vh 4vw;overflow:auto;gap:4vw}
  .bhead h2{font-size:32px}.story{font-size:13px;line-height:1.55;margin-top:2vh;min-height:0}.story p{margin-bottom:8px}
  #briefing .bbtns{position:fixed;left:auto;right:calc(4vw + env(safe-area-inset-right));bottom:3vh;z-index:12}.bwrap>div:first-child{padding-bottom:70px!important}
  #debrief .bbtns{position:static;margin-top:14px}
  #briefing .btn{background:rgba(8,10,12,.85)}#briefing .btn.go{background:var(--accent)}
  .center{max-height:94vh;overflow:auto;top:50%}
  .foot{display:none}
  .btn{padding:10px 20px;font-size:13px}
  .dossier{padding:10px}.dossier .pic{aspect-ratio:1/1;max-height:42vh}.dossier .nm{font-size:18px;margin-top:8px}.dossier .ds{font-size:12px}.intel{font-size:11px}
  #debrief .wrap{inset:4vh 5vw;overflow:auto}#debrief h2{font-size:32px}#debrief .wrap>div:first-child{padding-bottom:10px!important}
  .stats{padding:10px 14px}.stats div{padding:5px 0;font-size:12px}
  .center h2{font-size:28px;margin-bottom:12px}.opts{margin-top:12px;gap:8px 12px}
  .logo{top:6vh}.logo h1{font-size:46px}.menu{bottom:8vh}.menu button{font-size:15px;padding:4px 0}
  #sub{top:6vh;max-height:84vh;padding:16px 18px}
}
@media (orientation:portrait){
  body.touch #obj{max-width:58vw}
  body.touch #alert{top:auto;bottom:calc(132px + env(safe-area-inset-bottom));right:calc(20px + env(safe-area-inset-right));width:96px}
  body.touch #alert #alertTxt{font-size:10px}
  body.touch #timer{top:auto;bottom:calc(178px + env(safe-area-inset-bottom));right:20px}
  body.touch #ammo{top:auto;bottom:calc(30px + env(safe-area-inset-bottom))}
  body.touch #bolt{top:auto;bottom:calc(70px + env(safe-area-inset-bottom))}
  body.touch #radio{bottom:auto;top:calc(118px + env(safe-area-inset-top));max-width:92vw;width:92vw}
  body.touch #hint{bottom:calc(200px + env(safe-area-inset-bottom));width:90vw}
  body.touch #toasts{top:30%;width:90vw}
  body.touch #bcTag{top:auto;bottom:16vh;left:20px;transform:none}
  #briefing .bbtns{position:fixed;left:4vw;right:4vw;bottom:calc(2vh + env(safe-area-inset-bottom));z-index:12;display:flex}
  #briefing .bbtns .btn{flex:1;background:rgba(8,10,12,.9)}#briefing .bbtns .btn.go{background:var(--accent)}
  .bwrap{inset:3vh 5vw;overflow:auto;gap:3vh}.bwrap>div:first-child{padding-bottom:20px!important}
  .bhead h2{font-size:36px}.story{font-size:14px;min-height:0;margin-top:2vh}
  .dossier{margin-bottom:80px}.dossier .pic{aspect-ratio:4/3}
  #debrief .wrap{inset:4vh 5vw;overflow:auto;gap:3vh}#debrief h2{font-size:36px}#debrief .bbtns{position:static;margin-top:16px;flex-wrap:wrap}
  .logo{top:10vh}.logo h1{font-size:64px}.menu{bottom:12vh}
}
@media (max-width:820px){
  .bwrap,#debrief .wrap{grid-template-columns:1fr;overflow:auto}
  #sub{left:6vw;right:6vw;width:auto;top:auto;bottom:4vh;max-height:46vh}
  #compass{width:300px}
  #ballistics{display:none}
}

</head>
<body>
<canvas id="c"></canvas>
<canvas id="scope"></canvas>
<div id="dmg"></div>
<div id="letterbox"></div>

<div id="hud">
  <canvas id="compass" width="1040" height="80"></canvas>
  <div id="obj" class="panel"><div class="code" id="objCode"></div><div class="ttl" id="objTitle"></div><ul id="objList"></ul></div>
  <div id="alert"><div class="lbl" id="alertLbl">ENEMY AWARENESS</div><div class="bar"><i id="alertFill"></i></div><div id="alertTxt" class="mono">UNDETECTED</div></div>
  <div id="timer" class="mono"></div>
  <div id="snipeWarn" class="mono"><i></i><span id="snipeT"></span></div>
  <div id="snipeArrow"></div>
  <div id="wind" class="panel"><canvas id="windC" width="128" height="128" style="width:64px;height:64px"></canvas><div id="windTxt" class="mono"></div></div>
  <div id="ballistics" class="panel mono"></div>
  <div id="bolt" class="mono"></div>
  <div id="ammo"><div id="rounds"></div><div id="reserve" class="mono"></div></div>
  <div id="breath"><i id="breathFill"></i></div>
  <div id="health"><i id="healthFill"></i></div>
  <div id="dot"></div>
  <div id="hitmark"></div>
  <div id="toasts"></div>
  <div id="radio" class="panel"><div class="wave"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.25s"></i><i style="animation-delay:.05s"></i></div><div><div class="who"></div><div class="txt"></div></div></div>
  <div id="hint" class="mono"></div>
  <div id="bcTag"><b id="bcDist"></b><span id="bcInfo" hidden></span></div>
</div>

<div id="title" class="screen">
  <div class="logo">
    <div class="pre">OPERATION HALCYON</div>
    <h1>BLACK<span style="background:inherit;-webkit-background-clip:text;background-clip:text">SUMMIT</span></h1>
  </div>
  <nav class="menu" id="mainMenu">
    <button class="play" data-act="continue"><span>▶</span> PLAY</button>
    <div class="playsub mono" id="playSub"></div>
    <div class="minor"><button data-act="select">MISSIONS</button><button data-act="settings">SETTINGS</button></div>
  </nav>
  <div id="sub" class="panel"></div>
  <div class="foot mono" id="footTxt"></div>
</div>

<div id="briefing" class="screen">
  <div class="bwrap">
    <div style="position:relative;padding-bottom:80px">
      <div class="bhead"><div class="code" id="bCode"></div><h2 id="bTitle"></h2><div class="meta mono" id="bMeta"></div></div>
      <div class="story" id="bStory"></div>
      <div class="bobj"><h4>OBJECTIVES</h4><ul id="bObj"></ul></div>
      <div class="bbtns"><button class="btn" id="bBack">BACK</button><button class="btn go" id="bGo">DEPLOY</button></div>
    </div>
    <div class="dossier panel">
      <h4>TARGET DOSSIER</h4>
      <div class="pic"><img id="bPic" alt="Target portrait"><div class="scan"></div></div>
      <div class="nm" id="bName"></div><div class="al" id="bAlias"></div>
      <div class="ds" id="bDesc"></div>
      <div class="intel" id="bIntel"></div>
    </div>
  </div>
</div>

<div id="pause" class="screen">
  <div class="center">
    <h2>PAUSED</h2>
    <div class="col">
      <button class="btn go" id="pResume">RESUME</button>
      <button class="btn" id="pRestart">RESTART MISSION</button>
      <button class="btn" id="pQuit">ABORT TO MENU</button>
    </div>
    <div class="opts" id="pOpts"></div>
  </div>
</div>

<div id="debrief" class="screen">
  <div class="wrap">
    <div style="position:relative;padding-bottom:80px">
      <div class="res" id="dRes"></div>
      <h2 id="dTitle"></h2>
      <div class="stars" id="dStars"></div>
      <div class="story" id="dStory" style="margin-top:3vh"></div>
      <div class="bbtns" id="dBtns"></div>
    </div>
    <div class="stats panel" id="dStats"></div>
  </div>
</div>

<div id="touch">
  <button class="tb" id="tPause" aria-label="Pause">❚❚</button>
  <button class="tb" id="tScope">SCOPE</button>
  <button class="tb" id="tTherm">THERMAL</button>
  <button class="tb" id="tFire">FIRE</button>
</div>
<div id="cineUI"><button id="cineSkip">SKIP ›</button><div id="cineTag"></div><div id="cineLine"></div></div>
