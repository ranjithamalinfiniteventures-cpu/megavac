<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smash Fiesta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL stage; HUD floats in the safe-area gutters; one centred panel for menu/win/lose. */
:root {
  --sky-low: #ffd9b8;
  --ink: #232859;
  --ink-soft: #4a4f86;
  --paper: #fff6e6;
  --coral: #ff6b5b;
  --mustard: #ffc23d;
  --teal: #1fc2b2;
  --violet: #7b5cff;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--sky-low);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 700;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

#hud {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#hud[hidden] { display: none; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.tools { display: flex; gap: 8px; }
.chip {
  pointer-events: auto;
  font: 800 15px/1 var(--font-display);
  color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink);
  padding: 9px 13px; min-height: 44px; box-sizing: border-box;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.chip:focus-visible, .btn:focus-visible, .lvl:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.chip svg { width: 20px; height: 20px; flex: none; }
.goal {
  text-align: center; background: var(--ink); color: var(--paper);
  border-radius: 16px; padding: 6px 16px 7px; min-width: 96px; box-shadow: 0 4px 0 rgba(35,40,89,.35);
}
.goal small { display: block; font: 800 11px/1.1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.goal b { font: 800 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.goal span { font: 800 12px/1.2 var(--font-body); opacity: .85; display: block; }
.bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#balls { display: flex; gap: 8px; padding: 8px 12px; background: rgba(255,246,230,.82); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink); }
.ball { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #6c74d6 0, var(--ink) 55%, #12153a 100%); transition: transform .25s, opacity .25s; }
.ball.used { opacity: .18; transform: scale(.6); }
#hint { font: 800 14px/1.3 var(--font-body); color: var(--ink); background: rgba(255,246,230,.82); border-radius: 999px; padding: 6px 14px; transition: opacity .6s; text-align: center; }
#hint.gone { opacity: 0; }

#pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; transform: translate(-50%, -50%);
  font: 800 28px/1 var(--font-display); color: #fff;
  -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
  animation: pop-rise .95s cubic-bezier(.2,.8,.3,1) forwards;
  white-space: nowrap;
}
.pop.big { font-size: 38px; color: var(--mustard); }
@keyframes pop-rise {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); }
  18% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
}

#overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  box-sizing: border-box;
  background: radial-gradient(ellipse at 50% 40%, rgba(35,40,89,.05), rgba(35,40,89,.42));
}
#overlay[hidden] { display: none; }
.panel {
  width: min(100%, 440px); max-height: 100%; overflow: auto; box-sizing: border-box;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 28px;
  box-shadow: 0 8px 0 var(--ink), 0 30px 60px rgba(35,40,89,.35);
  padding: 22px 20px 20px; text-align: center;
  animation: panel-in .45s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes panel-in { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
.kicker { font: 800 12px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
h1, h2 { margin: 6px 0 4px; font-family: var(--font-display); font-weight: 800; line-height: .95; color: var(--ink); text-wrap: balance; }
h1 { font-size: clamp(46px, 13vw, 66px); }
h1 em { font-style: normal; color: var(--coral); display: block; }
h2 { font-size: 44px; }
.sub { margin: 8px auto 16px; max-width: 32ch; font-size: 15px; line-height: 1.4; color: var(--ink-soft); font-weight: 700; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 16px; }
.lvl {
  font: 800 22px/1 var(--font-display); color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink);
  padding: 8px 0 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform .08s, box-shadow .08s;
}
.lvl:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.lvl.on { background: var(--mustard); }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 14px; height: 14px; }
.stars.xl svg { width: 52px; height: 52px; }
.stars.xl { gap: 6px; margin: 12px 0 6px; }
.stars.xl svg.on { animation: star-in .5s cubic-bezier(.2,1.6,.4,1) both; }
.stars.xl svg.on:nth-child(2) { animation-delay: .18s; }
.stars.xl svg.on:nth-child(3) { animation-delay: .36s; }
@keyframes star-in { from { transform: scale(0) rotate(-90deg); } to { transform: none; } }
.row { display: flex; flex-direction: column; gap: 10px; }
.btn {
  font: 800 22px/1 var(--font-display); color: var(--ink);
  background: var(--mustard); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 0 5px 0 var(--ink); padding: 14px 18px; min-height: 52px; cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: #fff; font-size: 18px; }
.stat { display: flex; justify-content: center; gap: 22px; margin: 6px 0 16px; }
.stat div { font: 800 12px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.stat b { display: block; font: 800 28px/1.1 var(--font-display); color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 16px; }
@media (min-aspect-ratio: 5/4) {
  .bottom { align-items: flex-start; }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); white-space: nowrap; }
}
@media (max-width: 420px) { .goal b { font-size: 26px; } .chip { padding: 8px 11px; } }
@media (prefers-reduced-motion: reduce) { .pop, .panel, .stars.xl svg.on { animation-duration: .01s; animation-delay: 0s !important; } }
</style>

<canvas id="stage" aria-label="Smash Fiesta game board"></canvas>

<div id="hud" hidden>
  <div class="top">
    <button class="chip" id="btnMenu" type="button" aria-label="Choose level">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span id="lvlLabel">Level 1</span>
    </button>
    <div class="goal" aria-live="polite"><small>Knock off</small><b id="left">0</b><span>toys left</span></div>
    <div class="tools">
      <button class="chip" id="btnMute" type="button" aria-label="Toggle sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="muteWaves" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
      </button>
      <button class="chip" id="btnRestart" type="button" aria-label="Restart level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.7-6"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
  </div>
  <div class="bottom">
    <div id="hint"></div>
    <div id="balls" aria-label="Cannonballs left"></div>
  </div>
</div>
<div id="pops"></div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE || !window.CANNON) {
  document.body.insertAdjacentHTML('beforeend', '<div class="fallback">Smash Fiesta could not load its 3D engine. Check your connection and reload.</div>');
  return;
}

/* ---------- small helpers ---------- */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);
const col = (hex) => new THREE.Color(hex).convertSRGBToLinear();
const PALETTE = ['#ff6b5b', '#ffc23d', '#1fc2b2', '#8b6cff', '#ff8fb8', '#4da3ff'];
const pal = (i) => PALETTE[(((Math.round(i) % 6) + 6) % 6)];
const isTouch = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function store(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { /* storage unavailable */ }
  return null;
}

/* ---------- renderer / scene ---------- */
const canvas = $('#stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(col('#ffd2b0'), 55, 150);

(function makeSky() {
  const c = document.createElement('canvas'); c.width = 8; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#5d6fe6');
  grad.addColorStop(0.38, '#9f9bf0');
  grad.addColorStop(0.62, '#ffb9a5');
  grad.addColorStop(0.8, '#ffd2b0');
  grad.addColorStop(1, '#ffe7cc');
  g.fillStyle = grad; g.fillRect(0, 0, 8, 512);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  scene.background = t;
})();

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 400);
const camLook = new THREE.Vector3(0, 1.2, -1.2);
const camPos = new THREE.Vector3();
let camDist = 26;

scene.add(new THREE.HemisphereLight(col('#dfe6ff'), col('#ffc9a0'), 0.95));
const sun = new THREE.DirectionalLight(col('#fff0d8'), 1.7);
sun.position.set(9, 19, 11);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -17; sun.shadow.camera.right = 17;
sun.shadow.camera.top = 17; sun.shadow.camera.bottom = -17;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
sun.target.position.set(0, 0, -5);
scene.add(sun, sun.target);
const blast = new THREE.PointLight(col('#ffa860'), 0, 22, 2);
scene.add(blast);

function layoutCamera() {
  const w = window.innerWidth, h = window.innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = a;
  camera.updateProjectionMatrix();
  const halfW = (level ? level.w / 2 : 6) + 2.2;
  const need = halfW / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * a);
  camDist = Math.max(22, need + 2);
  const el = THREE.MathUtils.degToRad(28);
  camPos.set(0, camLook.y + camDist * Math.sin(el), camLook.z + camDist * Math.cos(el));
}
window.addEventListener('resize', layoutCamera);

/* ---------- scenery: sun, clouds, floating islets ---------- */
const scenery = new THREE.Group(); scene.add(scenery);
const clouds = [];
(function makeScenery() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  rg.addColorStop(0, 'rgba(255,248,225,1)'); rg.addColorStop(0.28, 'rgba(255,224,170,.95)');
  rg.addColorStop(0.6, 'rgba(255,190,150,.25)'); rg.addColorStop(1, 'rgba(255,190,150,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, fog: false, depthWrite: false }));
  sp.scale.set(120, 120, 1); sp.position.set(-26, 14, -110);
  scenery.add(sp);

  const cloudMat = new THREE.MeshStandardMaterial({ color: col('#fff4ea'), roughness: 1, emissive: col('#ffcfb8'), emissiveIntensity: 0.35 });
  const sphere = new THREE.SphereGeometry(1, 20, 14);
  const spots = [[-18, -9, -4, 1.3], [17, -12, -12, 1.6], [-26, -4, -28, 1.8], [27, -6, -30, 1.7], [0, -16, -26, 2.4],
                 [-10, -15, 6, 1.4], [13, -17, 4, 1.5], [-34, -14, -14, 2], [36, -14, -8, 2.1], [4, -10, -58, 3.2], [-30, -2, -60, 3]];
  for (const [x, y, z, s] of spots) {
    const grp = new THREE.Group();
    const n = 5 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(sphere, cloudMat);
      const r = 1.4 + Math.random() * 1.3;
      m.scale.set(r, r * 0.8, r);
      m.position.set((i - n / 2) * 1.7 + rand(-.4, .4), rand(-.3, .5) + Math.sin(i / n * Math.PI) * 0.8, rand(-.8, .8));
      grp.add(m);
    }
    grp.scale.setScalar(s); grp.position.set(x, y, z);
    grp.userData.speed = rand(0.12, 0.35) * (Math.random() < .5 ? -1 : 1);
    scenery.add(grp); clouds.push(grp);
  }

  const islet = (x, y, z, r, top, under) => {
    const top3 = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.7, 10), new THREE.MeshStandardMaterial({ color: col(top), roughness: .8 }));
    top3.position.y = -0.35;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, r * 1.8, 10), new THREE.MeshStandardMaterial({ color: col(under), roughness: .9 }));
    cone.rotation.x = Math.PI; cone.position.y = -0.7 - r * 0.9;
    const grp = new THREE.Group(); grp.add(top3, cone);
    grp.position.set(x, y, z); grp.userData.bob = Math.random() * 6; grp.userData.baseY = y;
    scenery.add(grp); clouds.push(grp);
    return grp;
  };
  islet(-17, -2.5, -18, 3.2, '#35d3c1', '#6a52e0');
  islet(19, -4, -22, 4, '#ff9fc4', '#6a52e0');
  islet(-24, -6, 4, 2.2, '#ffd35e', '#6a52e0');
})();

/* ---------- physics ---------- */
const world = new CANNON.World();
world.gravity.set(0, -24, 0);
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 20;
world.solver.tolerance = 0.0005;
const toyMat = new CANNON.Material('toy');
const ballMat = new CANNON.Material('ball');
world.defaultContactMaterial.friction = 0.55;
world.defaultContactMaterial.restitution = 0.08;
world.defaultContactMaterial.contactEquationStiffness = 1e7;
world.defaultContactMaterial.contactEquationRelaxation = 3;
world.defaultContactMaterial.frictionEquationStiffness = 1e7;
world.addContactMaterial(new CANNON.ContactMaterial(toyMat, toyMat, { friction: 0.55, restitution: 0.08, contactEquationStiffness: 1e7, contactEquationRelaxation: 3 }));
world.addContactMaterial(new CANNON.ContactMaterial(ballMat, toyMat, { friction: 0.25, restitution: 0.3, contactEquationStiffness: 1e7, contactEquationRelaxation: 3 }));
const FIXED = 1 / 120;
let acc = 0;

/* ---------- geometry + materials ---------- */
function roundBox(w, h, d, r) {
  const g = new THREE.BoxGeometry(w, h, d, 4, 4, 4);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const hx = w / 2 - r, hy = h / 2 - r, hz = d / 2 - r;
  const v = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    c.set(clamp(v.x, -hx, hx), clamp(v.y, -hy, hy), clamp(v.z, -hz, hz));
    n.subVectors(v, c);
    if (n.lengthSq() > 1e-8) {
      n.normalize(); v.copy(c).addScaledVector(n, r); nor.setXYZ(i, n.x, n.y, n.z);
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  return g;
}

const texCache = new Map();
function canvasTex(w, h, draw, key) {
  if (key && texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  if (key) texCache.set(key, t);
  return t;
}

function drawFace(g, cx, cy, s, variant) {
  const px = [[0, 0], [-0.25, 0.1], [0.3, -0.05], [0, -0.3]][variant % 4];
  for (const sx of [-1, 1]) {
    g.fillStyle = '#fff';
    g.beginPath(); g.ellipse(cx + sx * s * 0.62, cy, s * 0.42, s * 0.52, 0, 0, Math.PI * 2); g.fill();
    g.lineWidth = s * 0.07; g.strokeStyle = '#232859'; g.stroke();
    g.fillStyle = '#232859';
    g.beginPath(); g.arc(cx + sx * s * 0.62 + px[0] * s * 0.3, cy + px[1] * s * 0.4, s * 0.2, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(cx + sx * s * 0.62 + px[0] * s * 0.3 - s * .06, cy + px[1] * s * 0.4 - s * .08, s * 0.06, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,90,110,.35)';
    g.beginPath(); g.ellipse(cx + sx * s * 1.05, cy + s * 0.78, s * 0.24, s * 0.15, 0, 0, Math.PI * 2); g.fill();
  }
  g.strokeStyle = '#232859'; g.lineWidth = s * 0.1; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy + s * 0.5, s * 0.3, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
}

function faceTex(hex, variant) {
  return canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = hex; g.fillRect(0, 0, w, h);
    const grad = g.createRadialGradient(w / 2, h * 0.4, 4, w / 2, h / 2, w * 0.75);
    grad.addColorStop(0, 'rgba(255,255,255,.22)'); grad.addColorStop(1, 'rgba(0,0,0,.10)');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    drawFace(g, w / 2, h * 0.46, w * 0.15, variant);
  }, 'f' + hex + variant);
}
function ballFaceTex(hex, variant) {
  return canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = hex; g.fillRect(0, 0, w, h);
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(255,255,255,.25)'); grad.addColorStop(1, 'rgba(0,0,0,.12)');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    drawFace(g, w * 0.25, h * 0.5, 16, variant);
  }, 'b' + hex + variant);
}
function tntTex() {
  return canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#e63946'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#fff6e6'; g.fillRect(0, 38, w, 52);
    g.fillStyle = '#232859'; g.font = '800 44px "Baloo 2", Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('TNT', w / 2, 66);
    g.fillStyle = '#232859';
    for (let x = -h; x < w + h; x += 24) {

function spawnP(pos, vel, hex, size, life, grav = 22) {

function burst(pos, n, colors, speed, up, size, life = 0.7) {

function updateFx(dt) {

    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.rotation.x += p.spin.x * dt; p.mesh.rotation.y += p.spin.y * dt;

const dots = [];

function solveAim() {
  const g = -world.gravity.y;
  const p0 = new THREE.Vector3();
  pivot.getWorldPosition(p0);
  let start = p0.clone();
  for (let k = 0; k < 3; k++) {
    const dist = start.distanceTo(aimPoint);
    aimT = clamp(dist / 27, 0.38, 0.85);
    aimVel.copy(aimPoint).sub(start).divideScalar(aimT);
    aimVel.y += 0.5 * g * aimT;
    start = p0.clone().addScaledVector(aimVel.clone().normalize(), MUZZLE_LEN);
  }
  return start;
}

function updateAimVisuals(start, rdt) {
  const show = aimVisible && mode === 'play' && ballsLeft > 0;
  const g = -world.gravity.y;
  const tEnd = aimT * 1.3;
  for (let i = 0; i < dots.length; i++) {
    const t = (i + 1) / dots.length * tEnd;
    const p = dots[i].position;
    p.set(start.x + aimVel.x * t, start.y + aimVel.y * t - 0.5 * g * t * t, start.z + aimVel.z * t);
    dots[i].visible = show && p.y > -0.4 && t < aimT * 0.98;
    dots[i].scale.setScalar(1 - (i / dots.length) * 0.45);
  }
  reticle.visible = show;
  reticle.position.copy(aimPoint);
  reticle.quaternion.copy(camera.quaternion);
  reticle.scale.setScalar(1 + Math.sin(performance.now() / 160) * 0.08);
  const want = aimVel.clone().normalize();
  cannonDir.lerp(want, Math.min(1, rdt * 28)).normalize();
  const pw = new THREE.Vector3(); pivot.getWorldPosition(pw);
  pivot.lookAt(pw.x + cannonDir.x, pw.y + cannonDir.y, pw.z + cannonDir.z);
  recoil = Math.max(0, recoil - rdt * 3.2);
  barrel.position.z = -recoil * 0.7;
}

function addThing(t) {

  world.addBody(t.body); levelGroup.add(t.mesh);

    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    if (t.tnt && !t.armed && (e.body.isBall || v > 6.5)) { t.armed = true; boomQueue.push({ t, wait: 0 }); }
    const now = performance.now();
    if (v > 6 && now - lastKnock > 45) { lastKnock = now; sfx.knock(Math.min(1, v / 20)); }
  });
}

function clearLevel() {

  for (const p of fxList) scene.remove(p.mesh);

  for (const b of [...world.bodies]) world.remove(b);

  levelGroup = new THREE.Group(); scene.add(levelGroup);

function buildPlatform(w, d) {
  const grp = new THREE.Group();
  const checker = canvasTex(64, 64, (g) => {
    g.fillStyle = '#fff3dc'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = '#ffe0bd'; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32);
  }, 'checker');
  const top = checker.clone(); top.needsUpdate = true;
  top.wrapS = top.wrapT = THREE.RepeatWrapping; top.repeat.set(w / 3, d / 3);
  const sideM = new THREE.MeshStandardMaterial({ color: col('#ff7a66'), roughness: .6 });
  const mats = [sideM, sideM, new THREE.MeshStandardMaterial({ map: top, roughness: .85 }), sideM, sideM, sideM];
  const slab = new THREE.Mesh(roundBox(w, 1.2, d, 0.3), mats);
  slab.position.set(0, -0.6, cz); slab.receiveShadow = true; slab.castShadow = true;
  const rock = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.18, 6, 4, 1), new THREE.MeshStandardMaterial({ color: col('#6a52e0'), roughness: .9, flatShading: true }));
  rock.scale.set(w * 1.02, 1, d * 1.02); rock.rotation.y = Math.PI / 4; rock.position.set(0, -4.2, cz);
  const trim = new THREE.Mesh(roundBox(w + 0.5, 0.4, d + 0.5, 0.15), new THREE.MeshStandardMaterial({ color: col('#ffc23d'), roughness: .5 }));
  trim.position.set(0, -1.35, cz);
  grp.add(slab, rock, trim);
  return grp;
}

function loadLevel(i) {
  levelIdx = clamp(i, 0, LEVELS.length - 1);
  level = LEVELS[levelIdx];
  clearLevel();
  cz = -2 - level.d / 2;
  levelGroup.add(buildPlatform(level.w, level.d));
  const ground = new CANNON.Body({ mass: 0, material: toyMat });
  ground.addShape(new CANNON.Box(new CANNON.Vec3(level.w / 2, 0.6, level.d / 2)));
  ground.position.set(0, -0.6, cz);
  world.addBody(ground);
  level.build(ctx);
  ballsTotal = ballsLeft = level.balls;
  cooldown = 0; score = 0; combo = 0; comboT = 0; endTimer = 0; endType = ''; settleT = 0; firedAny = false;
  targetScale = 1; timeScale = 1; acc = 0; shake = 0;
  aimPoint.set(0, 2.6, cz);
  aimVisible = !isTouch;
  camLook.set(0, 1.2, -1.2);

  $('#lvlLabel').textContent = 'Level ' + (levelIdx + 1);

}

  if (n !== lastLeft) { $('#left').textContent = n; lastLeft = n; }
}
function popText(world3, text, big) {
  const p = world3.clone().project(camera);
  const x = clamp((p.x * 0.5 + 0.5) * window.innerWidth + rand(-28, 28), 50, window.innerWidth - 50);
  const y = clamp((-p.y * 0.5 + 0.5) * window.innerHeight + rand(-20, 20), 120, window.innerHeight - 170);
  const d = document.createElement('div');
  d.className = 'pop' + (big ? ' big' : '');
  d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px';
  $('#pops').appendChild(d);
  setTimeout(() => d.remove(), 1000);
}
function starSvg(on) {
  return '<svg viewBox="0 0 24 24" class="' + (on ? 'on' : '') + '"><path d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5 6.2 20.6l1.1-6.5L2.6 9.5l6.5-.9z" fill="' + (on ? '#ffc23d' : '#e2d9c8') + '" stroke="#232859" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
const starsHtml = (n, cls = '') => '<span class="stars ' + cls + '">' + [0, 1, 2].map((i) => starSvg(i < n)).join('') + '</span>';

function showOverlay(kind) {
  const ov = $('#overlay');
  ov.hidden = false;
  if (kind === 'menu') {
    ov.innerHTML = '<div class="panel"><div class="kicker">Cannon puzzle</div><h1>Smash<em>Fiesta</em></h1>' +
      '<p class="sub">Aim the cannon and knock every toy off the island before you run out of balls. TNT blows up on a hard hit.</p>' +
      '<div class="levels">' + LEVELS.map((l, i) => '<button class="lvl' + (i === levelIdx ? ' on' : '') + '" data-act="level" data-i="' + i + '" type="button" aria-label="Level ' + (i + 1) + ': ' + l.name + '">' + (i + 1) + starsHtml(stars[i] || 0) + '</button>').join('') + '</div>' +
      '<div class="row"><button class="btn" data-act="play" type="button">Play level ' + (levelIdx + 1) + '</button></div></div>';
  } else if (kind === 'win') {
    const earned = ballsLeft / ballsTotal >= 0.5 ? 3 : ballsLeft >= 1 ? 2 : 1;
    if ((stars[levelIdx] || 0) < earned) { stars[levelIdx] = earned; store('smash-fiesta-stars', stars); }
    const last = levelIdx >= LEVELS.length - 1;
    ov.innerHTML = '<div class="panel"><div class="kicker">' + level.name + '</div><h2>Smashed it!</h2>' + starsHtml(earned, 'xl') +
      '<div class="stat"><div><b>' + score + '</b>score</div><div><b>' + (ballsTotal - ballsLeft) + '/' + ballsTotal + '</b>balls used</div></div>' +
      '<div class="row">' + (last ? '' : '<button class="btn" data-act="next" type="button">Next level</button>') +
      '<button class="btn alt" data-act="retry" type="button">Play again</button><button class="btn alt" data-act="menu" type="button">All levels</button></div></div>';
  } else {
    ov.innerHTML = '<div class="panel"><div class="kicker">' + level.name + '</div><h2>Out of balls</h2>' +
      '<p class="sub">' + remainingTargets() + ' toy' + (remainingTargets() === 1 ? '' : 's') + ' still on the island. Aim for the base of a stack, or hit TNT.</p>' +
      '<div class="row"><button class="btn" data-act="retry" type="button">Try again</button><button class="btn alt" data-act="menu" type="button">All levels</button></div></div>';
  }
  const first = ov.querySelector('.btn'); if (first) first.focus({ preventScroll: true });
}
function hideOverlay() { $('#overlay').hidden = true; }

function startPlay() {
  loadLevel(levelIdx);
  mode = 'play';
  $('#hud').hidden = false;
  hideOverlay();
  ac();
}
$('#overlay').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  ac();
  const act = b.dataset.act;
  if (act === 'level') { levelIdx = +b.dataset.i; loadLevel(levelIdx); showOverlay('menu'); }
  else if (act === 'play' || act === 'retry') startPlay();
  else if (act === 'next') { levelIdx = Math.min(levelIdx + 1, LEVELS.length - 1); startPlay(); }
  else if (act === 'menu') { mode = 'menu'; $('#hud').hidden = true; loadLevel(levelIdx); showOverlay('menu'); }
});
$('#btnMenu').addEventListener('click', () => { mode = 'menu'; $('#hud').hidden = true; loadLevel(levelIdx); showOverlay('menu'); });
$('#btnRestart').addEventListener('click', () => { ac(); startPlay(); });
function syncMute() { $('#muteWaves').style.display = muted ? 'none' : ''; }
$('#btnMute').addEventListener('click', () => { muted = !muted; store('smash-fiesta-muted', muted); syncMute(); ac(); });
syncMute();

/* ---------- input ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -AIM_Z);
function setAim(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  if (ray.ray.intersectPlane(aimPlane, hit)) {
    const hw = (level ? level.w / 2 : 6) + 3;
    aimPoint.set(clamp(hit.x, -hw, hw), clamp(hit.y, 0.9, 9), AIM_Z);
  }
  aimVisible = true;
}
canvas.addEventListener('pointerdown', (e) => { if (mode !== 'play') return; ac(); canvas.setPointerCapture(e.pointerId); setAim(e); });
canvas.addEventListener('pointermove', (e) => { if (mode !== 'play') return; if (e.pointerType === 'mouse' || e.buttons) setAim(e); });
canvas.addEventListener('pointerup', (e) => { if (mode !== 'play') return; setAim(e); fire(); });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { if (mode === 'play' && (e.code === 'Space' || e.code === 'Enter') && document.activeElement === document.body) { e.preventDefault(); fire(); } });

/* ---------- gameplay ---------- */
function fire() {
  if (mode !== 'play' || ballsLeft <= 0 || cooldown > 0 || endTimer > 0) return;
  const start = solveAim();
  ballsLeft--; cooldown = 0.55; firedAny = true; settleT = 0;
  $('#hint').classList.add('gone');
  renderBalls();
  const r = 0.55;
  const body = new CANNON.Body({ mass: 9, material: ballMat, linearDamping: 0.01, allowSleep: false });
  body.addShape(new CANNON.Sphere(r));
  body.position.set(start.x, start.y, start.z);
  body.velocity.set(aimVel.x, aimVel.y, aimVel.z);
  body.angularVelocity.set(rand(-6, 6), rand(-6, 6), 0);
  body.isBall = true;
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), new THREE.MeshPhysicalMaterial({ color: col('#2b3070'), roughness: .25, clearcoat: 1, clearcoatRoughness: .1 }));
  mesh.castShadow = true;
  scene.add(mesh); world.addBody(body);
  const ball = { body, mesh, life: 0, trail: 0, hit: 0 };
  body.addEventListener('collide', (e) => {
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    const now = performance.now();
    if (v > 3 && now - ball.hit > 60) {
      ball.hit = now;
      sfx.thud(Math.min(1, v / 22));
      const p = new THREE.Vector3(body.position.x, body.position.y, body.position.z);
      burst(p, 8, ['#fff6e6', '#ffe0bd', '#ffffff'], 6, 3, 0.16, 0.5);
      shake = Math.max(shake, Math.min(0.5, v / 50));
    }
  });
  balls.push(ball);
  recoil = 1; shake = Math.max(shake, 0.35);
  const dir = aimVel.clone().normalize();
  burst(start.clone().addScaledVector(dir, 0.4), 14, ['#ffc23d', '#ff6b5b', '#fff6e6'], 9, 1, 0.2, 0.45);
  sfx.shoot();
}

function queueBoom(t, wait) { boomQueue.push({ t, wait }); }
function explode(t) {
  if (t.exploded) return;
  t.exploded = true;
  const p = new THREE.Vector3(t.body.position.x, t.body.position.y, t.body.position.z);
  world.remove(t.body); levelGroup.remove(t.mesh);
  const i = things.indexOf(t); if (i >= 0) things.splice(i, 1);
  const R = 5.2;
  for (const o of things) {
    const dx = o.body.position.x - p.x, dy = o.body.position.y - p.y, dz = o.body.position.z - p.z;
    const dist = Math.hypot(dx, dy, dz);
    if (dist < R) {
      const k = 1 - dist / R;
      o.body.wakeUp();
      const inv = 1 / Math.max(dist, 0.3);
      o.body.velocity.x += dx * inv * 20 * k;
      o.body.velocity.y += dy * inv * 8 * k + 9 * k;
      o.body.velocity.z += dz * inv * 20 * k;
      o.body.angularVelocity.set(rand(-9, 9) * k, rand(-9, 9) * k, rand(-9, 9) * k);
      if (o.tnt && !o.armed && dist < R * 0.8) { o.armed = true; queueBoom(o, 0.12); }
    }
  }
  burst(p, 34, ['#ffc23d', '#ff6b5b', '#fff6e6', '#e63946'], 15, 5, 0.34, 0.8);
  burst(p, 14, ['#232859', '#4a4f86'], 8, 3, 0.4, 0.9);
  blast.position.copy(p); blast.position.y += 1.5; blast.intensity = 60;
  shake = 1; sfx.boom();
}

function afterPhysics(dt, rdt) {
  for (const t of things) {
    t.mesh.position.set(t.body.position.x, t.body.position.y, t.body.position.z);
    t.mesh.quaternion.set(t.body.quaternion.x, t.body.quaternion.y, t.body.quaternion.z, t.body.quaternion.w);
  }
  for (const b of balls) {
    b.mesh.position.set(b.body.position.x, b.body.position.y, b.body.position.z);
    b.mesh.quaternion.set(b.body.quaternion.x, b.body.quaternion.y, b.body.quaternion.z, b.body.quaternion.w);
  }

  for (let i = boomQueue.length - 1; i >= 0; i--) {
    const q = boomQueue[i]; q.wait -= dt;
    if (q.wait <= 0) { boomQueue.splice(i, 1); explode(q.t); }
  }

  comboT -= rdt; if (comboT <= 0) combo = 0;
  for (let i = things.length - 1; i >= 0; i--) {
    const t = things[i];
    if (!t.fallen && t.body.position.y < -1.8) {
      t.fallen = true;
      if (t.target) {
        combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
        const pts = 100 * combo; score += pts;
        const p = t.mesh.position.clone(); p.y = Math.max(p.y, -1.5) + 1.2;
        popText(p, '+' + pts, combo >= 3);
        sfx.pop(combo);
        burst(t.mesh.position.clone().setY(-1), 6, [t.hex, '#ffffff'], 5, 4, 0.2, 0.6);
      }
    }
    if (t.body.position.y < -22) {
      world.remove(t.body); levelGroup.remove(t.mesh); things.splice(i, 1);
    }
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.life += dt;
    b.trail -= dt;
    if (b.trail <= 0 && b.life < 1.2) {
      b.trail = 0.03;
      spawnP(b.mesh.position.clone(), new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)), '#fff6e6', 0.2, 0.35, 0);
    }
    const dead = b.life > 3.6 || b.body.position.y < -8;
    if (b.life > 3.2) b.mesh.scale.setScalar(clamp((3.6 - b.life) / 0.4, 0.01, 1));
    if (dead) { world.remove(b.body); scene.remove(b.mesh); balls.splice(i, 1); }
  }
  blast.intensity *= Math.pow(0.0025, rdt);
  if (blast.intensity < 0.3) blast.intensity = 0;
}

function gameLogic(rdt) {
  if (mode !== 'play') return;
  cooldown = Math.max(0, cooldown - rdt);
  renderLeft();
  if (endTimer > 0) {
    endTimer -= rdt;
    if (endTimer <= 0) {
      mode = 'ended'; targetScale = 1;
      showOverlay(endType);
      if (endType === 'win') sfx.win(); else sfx.lose();
    }
    return;
  }
  if (remainingTargets() === 0) {
    endType = 'win'; endTimer = 1.5; targetScale = 0.3;
    const cols = PALETTE;
    for (let i = 0; i < 70; i++) {
      spawnP(new THREE.Vector3(rand(-6, 6), rand(6, 11), cz + rand(-3, 3)), new THREE.Vector3(rand(-4, 4), rand(-2, 4), rand(-4, 4)), cols[i % cols.length], rand(0.18, 0.34), rand(1.2, 2.2), 6);
    }
    return;
  }
  if (firedAny && ballsLeft === 0 && balls.length === 0) {
    let moving = 0;
    for (const t of things) if (!t.fallen && t.body.sleepState !== CANNON.Body.SLEEPING && (t.body.velocity.norm2() + t.body.angularVelocity.norm2() > 0.12)) moving++;
    settleT = moving ? 0 : settleT + rdt;
    if (settleT > 0.7) { endType = 'lose'; endTimer = 0.4; }
  }
}

function updateCamera(rdt, now) {
  const sway = mode === 'menu' ? Math.sin(now / 3200) * 1.6 : aimPoint.x * 0.1;
  shake = Math.max(0, shake - rdt * 2.4);
  const s = reduceMotion ? 0 : shake * shake * 0.5;
  camera.position.set(camPos.x + sway + rand(-s, s), camPos.y + rand(-s, s), camPos.z + rand(-s, s));
  camera.lookAt(camLook.x + sway * 0.3, camLook.y, camLook.z);
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  timeScale += (targetScale - timeScale) * Math.min(1, rdt * 6);
  const dt = rdt * timeScale;
  acc += dt;
  let n = 0;
  while (acc >= FIXED && n < 8) { world.step(FIXED); acc -= FIXED; n++; }
  if (n === 8) acc = 0;
  afterPhysics(dt, rdt);
  gameLogic(rdt);
  updateFx(dt);
  updateCamera(rdt, now);
  const start = solveAim();
  updateAimVisuals(start, rdt);
  for (const c of clouds) {
    if (c.userData.bob !== undefined) c.position.y = c.userData.baseY + Math.sin(now / 1500 + c.userData.bob) * 0.35;
    else { c.position.x += c.userData.speed * rdt; if (Math.abs(c.position.x) > 45) c.position.x *= -0.98; }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
levelIdx = (() => { const n = stars.findIndex((s) => !s); return n < 0 ? 0 : clamp(n, 0, LEVELS.length - 1); })();
loadLevel(levelIdx);
showOverlay('menu');
requestAnimationFrame(frame);
window.__fiesta = { fire, startPlay, loadLevel, get mode() { return mode; }, get left() { return remainingTargets(); }, aim(x, y) { aimPoint.set(x, y, AIM_Z); aimVisible = true; }, get things() { return things.length; } };
})();
</script>
