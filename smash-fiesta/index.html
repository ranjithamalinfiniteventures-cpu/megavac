<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smash Fiesta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL stage; HUD floats in the safe-area gutters; one centred panel for menu/win/lose. */
:root {
  --sky-low: #ffd9b8;
  --ink: #232859;
  --ink-soft: #4a4f86;
  --paper: #fff6e6;
  --coral: #ff6b5b;
  --mustard: #ffc23d;
  --teal: #1fc2b2;
  --violet: #7b5cff;
  --muted: #e2d9c8;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--sky-low);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 700;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

#hud {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#hud[hidden] { display: none; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.tools { display: flex; gap: 8px; }
.chip {
  pointer-events: auto;
  font: 800 15px/1 var(--font-display);
  color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink);
  padding: 9px 13px; min-height: 44px; box-sizing: border-box;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.chip:focus-visible, .btn:focus-visible, .lvl:focus-visible, .pg:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.chip svg { width: 20px; height: 20px; flex: none; }
.goal {
  text-align: center; background: var(--ink); color: var(--paper);
  border-radius: 16px; padding: 6px 16px 8px; min-width: 104px; box-shadow: 0 4px 0 rgba(35,40,89,.35);
}
.goal small { display: block; font: 800 11px/1.1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.goal b { font: 800 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.goal span { font: 800 12px/1.2 var(--font-body); opacity: .85; display: block; }
.goal .stars { margin-top: 5px; }
.goal .stars svg { width: 18px; height: 18px; }
.goal .stars svg.drop { animation: star-drop .6s ease-out; }
@keyframes star-drop { 0% { transform: scale(1.6) rotate(0); } 40% { transform: scale(.7) rotate(-25deg); } 100% { transform: none; } }
.bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ammo {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px;
  background: rgba(255,246,230,.9); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink);
}
.ammo b { font: 800 24px/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 1.4ch; }
.ammo span { font: 800 11px/1.1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.ball { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #6c74d6 0, var(--ink) 55%, #12153a 100%); }
.ammo.bump .ball { animation: bump .3s ease-out; }
@keyframes bump { 40% { transform: scale(.6); } }
#hint { font: 800 14px/1.3 var(--font-body); color: var(--ink); background: rgba(255,246,230,.88); border-radius: 999px; padding: 6px 14px; transition: opacity .6s; text-align: center; }
#hint.gone { opacity: 0; }

#pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; transform: translate(-50%, -50%);
  font: 800 28px/1 var(--font-display); color: #fff;
  -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
  animation: pop-rise .95s cubic-bezier(.2,.8,.3,1) forwards;
  white-space: nowrap;
}
.pop.big { font-size: 38px; color: var(--mustard); }
@keyframes pop-rise {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); }
  18% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
}

#overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-sizing: border-box;
  background: radial-gradient(ellipse at 50% 40%, rgba(35,40,89,.05), rgba(35,40,89,.42));
}
#overlay[hidden] { display: none; }
.panel {
  width: min(100%, 460px); max-height: 100%; overflow: auto; box-sizing: border-box;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 28px;
  box-shadow: 0 8px 0 var(--ink), 0 30px 60px rgba(35,40,89,.35);
  padding: 20px 18px 18px; text-align: center;
  animation: panel-in .45s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes panel-in { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
.kicker { font: 800 12px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
h1, h2 { margin: 6px 0 4px; font-family: var(--font-display); font-weight: 800; line-height: .95; color: var(--ink); text-wrap: balance; }
h1 { font-size: clamp(42px, 12vw, 62px); }
h1 em { font-style: normal; color: var(--coral); display: block; }
h2 { font-size: 44px; }
.sub { margin: 8px auto 14px; max-width: 34ch; font-size: 15px; line-height: 1.4; color: var(--ink-soft); font-weight: 700; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.pager div { font: 800 15px/1.15 var(--font-display); }
.pager small { display: block; font: 800 11px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.pg {
  width: 44px; height: 44px; flex: none; border-radius: 14px; border: 3px solid var(--ink); background: #fff;
  box-shadow: 0 3px 0 var(--ink); font: 800 22px/1 var(--font-display); color: var(--ink); cursor: pointer;
}
.pg:disabled { opacity: .3; cursor: default; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 0 0 14px; }
.lvl {
  font: 800 19px/1 var(--font-display); color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 13px; box-shadow: 0 3px 0 var(--ink);
  padding: 7px 0 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: transform .08s, box-shadow .08s; min-width: 0;
}
.lvl:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.lvl.on { background: var(--mustard); }
.lvl:disabled { background: var(--muted); color: var(--ink-soft); box-shadow: none; cursor: default; transform: none; border-color: rgba(35,40,89,.35); }
.lvl:disabled svg.lock { width: 14px; height: 14px; }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 12px; height: 12px; }
.stars.xl svg { width: 52px; height: 52px; }
.stars.xl { gap: 6px; margin: 12px 0 6px; }
.stars.xl svg.on { animation: star-in .5s cubic-bezier(.2,1.6,.4,1) both; }
.stars.xl svg.on:nth-child(2) { animation-delay: .18s; }
.stars.xl svg.on:nth-child(3) { animation-delay: .36s; }
@keyframes star-in { from { transform: scale(0) rotate(-90deg); } to { transform: none; } }
.row { display: flex; flex-direction: column; gap: 10px; }
.btn {
  font: 800 22px/1 var(--font-display); color: var(--ink);
  background: var(--mustard); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 0 5px 0 var(--ink); padding: 14px 18px; min-height: 52px; cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: #fff; font-size: 18px; }
.stat { display: flex; justify-content: center; gap: 22px; margin: 6px 0 16px; }
.stat div { font: 800 12px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.stat b { display: block; font: 800 28px/1.1 var(--font-display); color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.rule { font-size: 13px; color: var(--ink-soft); margin: -6px 0 14px; }
.fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 16px; }
@media (min-aspect-ratio: 5/4) {
  .bottom { align-items: flex-start; }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); white-space: nowrap; }
}
@media (max-width: 420px) { .goal b { font-size: 26px; } .chip { padding: 8px 11px; } .lvl { font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { .pop, .panel, .stars.xl svg.on, .goal .stars svg.drop { animation-duration: .01s; animation-delay: 0s !important; } }
</style>

<canvas id="stage" aria-label="Smash Fiesta game board"></canvas>

<div id="hud" hidden>
  <div class="top">
    <button class="chip" id="btnMenu" type="button" aria-label="Choose level">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span id="lvlLabel">Level 1</span>
    </button>
    <div class="goal" aria-live="polite"><small>Knock off</small><b id="left">0</b><span>toys left</span><div class="stars" id="hudStars"></div></div>
    <div class="tools">
      <button class="chip" id="btnMute" type="button" aria-label="Toggle sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="muteWaves" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
      </button>
      <button class="chip" id="btnRestart" type="button" aria-label="Restart level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.7-6"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
  </div>
  <div class="bottom">
    <div id="hint"></div>
    <div class="ammo" id="ammo" aria-label="Cannonballs left"><i class="ball"></i><b id="ammoN">10</b><span>balls</span></div>
  </div>
</div>
<div id="pops"></div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE || !window.CANNON) {
  document.body.insertAdjacentHTML('beforeend', '<div class="fallback">Smash Fiesta could not load its 3D engine. Check your connection and reload.</div>');
  return;
}

/* ---------- small helpers ---------- */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);
const col = (hex) => new THREE.Color(hex).convertSRGBToLinear();
const PALETTE = ['#ff6b5b', '#ffc23d', '#1fc2b2', '#8b6cff', '#ff8fb8', '#4da3ff'];
const pal = (i) => PALETTE[(((Math.round(i) % 6) + 6) % 6)];
const isTouch = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEVEL_COUNT = 100;
const BALLS_PER_LEVEL = 10;
const PAGE = 20;

function store(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { /* storage unavailable */ }
  return null;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- renderer / scene ---------- */
const canvas = $('#stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(col('#ffd2b0'), 34, 165);

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 600);
const camLook = new THREE.Vector3(0, 1.2, -1.2);
const camPos = new THREE.Vector3();
let camDist = 22;

const hemi = new THREE.HemisphereLight(col('#dfe6ff'), col('#ffc9a0'), 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(col('#fff0d8'), 1.7);
sun.position.set(9, 19, 11);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -19; sun.shadow.camera.right = 19;
sun.shadow.camera.top = 19; sun.shadow.camera.bottom = -19;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 64;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
sun.target.position.set(0, 0, -5);
scene.add(sun, sun.target);
const blast = new THREE.PointLight(col('#ffa860'), 0, 24, 2);
scene.add(blast);

/* ---------- sky themes (one per world of 10 levels) ---------- */
const THEMES = [
  { name: 'Peach Dawn', top: '#5466e0', mid: '#b9a3f0', low: '#ffc3a6', bottom: '#ffe3c6', fog: '#ffd3b4', sun: '#fff0cf', sunDir: [-0.35, 0.2, -1], glow: 0.6,
    hemiSky: '#dfe6ff', hemiGround: '#ffc9a0', hemiI: 0.95, dirCol: '#fff0d8', dirI: 1.7, cloud: '#fff4ea', cloudEm: '#ffc9b4', stars: 0, spark: '#fff4c8', exposure: 1.08 },
  { name: 'Blue Skies', top: '#2c74f5', mid: '#7fbaff', low: '#cfe8ff', bottom: '#f1faff', fog: '#d6ecff', sun: '#ffffff', sunDir: [0.45, 0.5, -1], glow: 0.45,
    hemiSky: '#e8f2ff', hemiGround: '#d9e4c8', hemiI: 1.0, dirCol: '#ffffff', dirI: 1.85, cloud: '#ffffff', cloudEm: '#d6e9ff', stars: 0, spark: '#ffffff', exposure: 1.02 },
  { name: 'Candy Sunset', top: '#35287e', mid: '#de5689', low: '#ff9c5a', bottom: '#ffd08c', fog: '#ffa982', sun: '#ffe4a6', sunDir: [0.1, 0.05, -1], glow: 1.0,
    hemiSky: '#ffc6da', hemiGround: '#ff9f6a', hemiI: 0.9, dirCol: '#ffcb9c', dirI: 1.6, cloud: '#ffdcd2', cloudEm: '#ff8a86', stars: 0.25, spark: '#ffe2a0', exposure: 1.1 },
  { name: 'Starry Night', top: '#060a28', mid: '#1b2768', low: '#4a4ea0', bottom: '#7b6dc0', fog: '#3b4088', sun: '#e2eaff', sunDir: [0.5, 0.42, -1], glow: 0.35,
    hemiSky: '#a7b6ff', hemiGround: '#5e529e', hemiI: 1.05, dirCol: '#cfd9ff', dirI: 1.25, cloud: '#b7b6ff', cloudEm: '#5859b6', stars: 1, spark: '#fff1a0', exposure: 1.22 },
];
const themeFor = (i) => THEMES[Math.floor(i / 10) % THEMES.length];

const skyGroup = new THREE.Group();
scene.add(skyGroup);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uTop: { value: new THREE.Color() }, uMid: { value: new THREE.Color() }, uLow: { value: new THREE.Color() },
    uBottom: { value: new THREE.Color() }, uSun: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3(0, 0.2, -1) }, uGlow: { value: 0.6 },
  },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: [
    'uniform vec3 uTop, uMid, uLow, uBottom, uSun, uSunDir; uniform float uGlow; varying vec3 vDir;',
    'void main(){',
    '  vec3 d = normalize(vDir); float h = d.y; vec3 c;',
    '  if (h > 0.0) { c = mix(uMid, uTop, smoothstep(0.0, 0.7, h)); c = mix(uLow, c, smoothstep(-0.02, 0.16, h)); }',
    '  else { c = mix(uLow, uBottom, smoothstep(0.0, 0.45, -h)); }',
    '  float s = max(dot(d, normalize(uSunDir)), 0.0);',
    '  c += uSun * (smoothstep(0.9988, 0.9992, s) * 1.1 + pow(s, 48.0) * uGlow * 0.55 + pow(s, 6.0) * uGlow * 0.22);',
    '  gl_FragColor = vec4(c, 1.0);',
    '}',
  ].join('\n'),
});
skyGroup.add(new THREE.Mesh(new THREE.SphereGeometry(400, 48, 24), skyMat));

const starGeo = new THREE.BufferGeometry();
(function () {
  const pts = [];
  for (let i = 0; i < 900; i++) {
    const u = Math.random() * Math.PI * 2, v = Math.random() * 0.95 + 0.04;
    const r = 380, y = v, k = Math.sqrt(1 - y * y);
    pts.push(Math.cos(u) * k * r, y * r, Math.sin(u) * k * r);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
})();
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.7, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
skyGroup.add(new THREE.Points(starGeo, starMat));

function layoutCamera() {
  const w = window.innerWidth, h = window.innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = a;
  camera.updateProjectionMatrix();
  const halfW = (level ? level.w / 2 : 6) + 2.2;
  const need = halfW / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * a);
  camDist = Math.max(22, need + 2);
  const el = THREE.MathUtils.degToRad(28);
  camPos.set(0, camLook.y + camDist * Math.sin(el), camLook.z + camDist * Math.cos(el));
}
window.addEventListener('resize', layoutCamera);

/* ---------- scenery: cloud sea, near clouds, islets, balloons, sparkles ---------- */
const cloudMat = new THREE.MeshStandardMaterial({ color: col('#fff4ea'), roughness: 1, emissive: col('#ffcfb8'), emissiveIntensity: 0.4 });
const drifters = [];
const cloudSea = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 18, 12), cloudMat, 240);
(function makeCloudSea() {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < cloudSea.count; i++) {
    const near = i < 24;
    p.set(near ? rand(-60, 60) : rand(-220, 220), -32 + rand(-3, 3), near ? rand(-50, 20) : rand(-280, 40));
    const k = near ? rand(5, 9) : rand(9, 20);
    s.set(k, k * rand(0.45, 0.6), k * rand(0.8, 1.1));
    m.compose(p, q, s); cloudSea.setMatrixAt(i, m);
  }
  scene.add(cloudSea);
})();

const scenery = new THREE.Group(); scene.add(scenery);
(function makeScenery() {
  const sphere = new THREE.SphereGeometry(1, 20, 14);
  const spots = [[-19, -8, -4, 1.2], [18, -10, -12, 1.5], [-27, -3, -30, 1.8], [28, -5, -32, 1.7],
                 [-11, -13, 7, 1.3], [14, -14, 5, 1.4], [-36, -11, -14, 2], [38, -11, -8, 2.1], [6, -6, -62, 3.2], [-34, 2, -66, 3]];
  for (const [x, y, z, s] of spots) {
    const grp = new THREE.Group();
    const n = 5 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(sphere, cloudMat);
      const r = 1.4 + Math.random() * 1.3;
      m.scale.set(r, r * 0.8, r);
      m.position.set((i - n / 2) * 1.7 + rand(-.4, .4), rand(-.3, .5) + Math.sin(i / n * Math.PI) * 0.8, rand(-.8, .8));
      grp.add(m);
    }
    grp.scale.setScalar(s); grp.position.set(x, y, z);
    grp.userData.speed = rand(0.12, 0.35) * (Math.random() < .5 ? -1 : 1);
    scenery.add(grp); drifters.push(grp);
  }

  const trunkMat = new THREE.MeshStandardMaterial({ color: col('#8a5a44'), roughness: .9 });
  const islet = (x, y, z, r, top, under, decor) => {
    const top3 = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.96, 0.8, 12), new THREE.MeshStandardMaterial({ color: col(top), roughness: .8 }));

    aimVel.copy(aimPoint).sub(start).divideScalar(aimT);

  if (kind === 'menu') {
    ov.innerHTML = menuHtml();
  } else if (kind === 'win') {
    const used = ballsTotal - ballsLeft;
    const earned = starsFor(used);
    if ((stars[levelIdx] || 0) < earned) { stars[levelIdx] = earned; store('smash-fiesta-stars', stars); }
    if (unlocked < levelIdx + 2) { unlocked = Math.min(LEVEL_COUNT, levelIdx + 2); store('smash-fiesta-unlocked', unlocked); }
    const last = levelIdx >= LEVEL_COUNT - 1;
    ov.innerHTML = '<div class="panel"><div class="kicker">Level ' + (levelIdx + 1) + ' · ' + level.name + '</div><h2>' + (last ? 'All 100 smashed!' : 'Smashed it!') + '</h2>' + starsHtml(earned, 'xl') +
      '<div class="stat"><div><b>' + score + '</b>score</div><div><b>' + used + '</b>balls used</div></div>' +
      (earned < 3 ? '<p class="rule">Clear it in ' + level.par + ' ball' + (level.par === 1 ? '' : 's') + ' for 3 stars.</p>' : '') +
      '<div class="row">' + (last ? '' : '<button class="btn" data-act="next" type="button">Next level</button>') +
      '<button class="btn alt" data-act="retry" type="button">Play again</button><button class="btn alt" data-act="menu" type="button">All levels</button></div></div>';
  } else {
    const n = remainingTargets();
    ov.innerHTML = '<div class="panel"><div class="kicker">Level ' + (levelIdx + 1) + ' · ' + level.name + '</div><h2>Out of balls</h2>' +
      '<p class="sub">' + n + ' toy' + (n === 1 ? '' : 's') + ' still on the island. Aim low at the base of a stack, or hit the TNT.</p>' +
      '<div class="row"><button class="btn" data-act="retry" type="button">Try again</button><button class="btn alt" data-act="menu" type="button">All levels</button></div></div>';
  }
  const first = ov.querySelector('.btn'); if (first) first.focus({ preventScroll: true });
}
function hideOverlay() { $('#overlay').hidden = true; }

function startPlay() {
  loadLevel(levelIdx);
  mode = 'play';
  $('#hud').hidden = false;
  hideOverlay();
  ac();
}
function openMenu() {
  mode = 'menu'; $('#hud').hidden = true;
  menuPage = Math.floor(levelIdx / PAGE);
  loadLevel(levelIdx); showOverlay('menu');
}
$('#overlay').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  ac();
  const act = b.dataset.act;
  if (act === 'level') { levelIdx = +b.dataset.i; loadLevel(levelIdx); showOverlay('menu'); }
  else if (act === 'page') { menuPage = clamp(menuPage + +b.dataset.d, 0, Math.ceil(LEVEL_COUNT / PAGE) - 1); showOverlay('menu'); }
  else if (act === 'play' || act === 'retry') startPlay();
  else if (act === 'next') { levelIdx = Math.min(levelIdx + 1, LEVEL_COUNT - 1); startPlay(); }
  else if (act === 'menu') openMenu();
});
$('#btnMenu').addEventListener('click', openMenu);
$('#btnRestart').addEventListener('click', () => { ac(); startPlay(); });
function syncMute() { $('#muteWaves').style.display = muted ? 'none' : ''; }
$('#btnMute').addEventListener('click', () => { muted = !muted; store('smash-fiesta-muted', muted); syncMute(); ac(); });
syncMute();

/* ---------- input ----------
   The reticle lives in screen space and glides toward its target, so aiming never jumps.
   Mouse: the reticle follows the cursor. Touch: drag anywhere and the reticle moves with
   your finger (offset, so your finger never hides it); let go to fire. */
const ray = new THREE.Raycaster();
const aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 5);
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const MIN_AIM_Y = 0.45;
const aimNdc = new THREE.Vector2(0, 0), aimNdcSmooth = new THREE.Vector2(0, 0);
let drag = null, aimLock = false;
const TOUCH_SENS = 1.2;
const pointerNdc = (e) => {
  const r = canvas.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
const clampNdc = (v) => v.set(clamp(v.x, -0.97, 0.97), clamp(v.y, -0.85, 0.9));
function resolveAim() {
  if (aimLock) return;
  ray.setFromCamera(aimNdcSmooth, camera);
  const meshes = [];
  for (const t of things) if (!t.fallen) meshes.push(t.mesh);
  const hits = ray.intersectObjects(meshes, false);
  if (hits.length) {
    aimPoint.copy(hits[0].point);
    aimPoint.y = Math.max(aimPoint.y, MIN_AIM_Y);
    return;
  }
  const hw = (level ? level.w / 2 : 6) + 3, hit = new THREE.Vector3();
  aimPlane.constant = -cz;
  if (ray.ray.intersectPlane(aimPlane, hit) && hit.y >= MIN_AIM_Y) {
    aimPoint.set(clamp(hit.x, -hw, hw), Math.min(hit.y, 12), cz);
    return;
  }
  floorPlane.constant = -MIN_AIM_Y;
  if (ray.ray.intersectPlane(floorPlane, hit)) aimPoint.set(clamp(hit.x, -hw, hw), MIN_AIM_Y, clamp(hit.z, cz - level.d / 2, cz + level.d / 2 + 1));
}
function centerAim() {
  camera.position.copy(camPos); camera.lookAt(camLook); camera.updateMatrixWorld();
  const v = new THREE.Vector3(0, 1.0, cz + 0.6).project(camera);
  aimNdc.set(v.x, v.y); aimNdcSmooth.copy(aimNdc);
}
canvas.addEventListener('pointerdown', (e) => {
  if (mode !== 'play') return;
  ac(); aimLock = false;
  canvas.setPointerCapture(e.pointerId);
  if (e.pointerType === 'mouse') aimNdc.copy(pointerNdc(e));
  else drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', (e) => {
  if (mode !== 'play') return;
  if (e.pointerType === 'mouse') { aimLock = false; aimNdc.copy(pointerNdc(e)); return; }
  if (!drag) return;
  const r = canvas.getBoundingClientRect();
  aimNdc.x += ((e.clientX - drag.x) / r.width) * 2 * TOUCH_SENS;
  aimNdc.y -= ((e.clientY - drag.y) / r.height) * 2 * TOUCH_SENS;
  clampNdc(aimNdc);
  drag.x = e.clientX; drag.y = e.clientY;
});
canvas.addEventListener('pointerup', (e) => {
  if (mode !== 'play') return;
  if (e.pointerType === 'mouse') aimNdc.copy(pointerNdc(e));
  drag = null;
  aimNdcSmooth.copy(aimNdc);
  resolveAim();
  fire();
});
canvas.addEventListener('pointercancel', () => { drag = null; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { if (mode === 'play' && (e.code === 'Space' || e.code === 'Enter') && document.activeElement === document.body) { e.preventDefault(); fire(); } });

/* ---------- gameplay ---------- */
function fire() {
  if (mode !== 'play' || ballsLeft <= 0 || cooldown > 0 || endTimer > 0) return;
  const start = solveAim();
  ballsLeft--; cooldown = 0.45; firedAny = true; settleT = 0;
  $('#hint').classList.add('gone');
  renderAmmo();
  const body = new CANNON.Body({ mass: 24, material: ballMat, linearDamping: 0.01, allowSleep: false });
  body.addShape(new CANNON.Sphere(BALL_R));
  body.position.set(start.x, start.y, start.z);
  body.velocity.set(aimVel.x, aimVel.y, aimVel.z);
  body.angularVelocity.set(rand(-6, 6), rand(-6, 6), 0);
  body.isBall = true;
  const mesh = new THREE.Mesh(cached('gball', () => new THREE.SphereGeometry(BALL_R, 28, 20)), cached('mball', () => new THREE.MeshPhysicalMaterial({ color: col('#2b3070'), roughness: .25, clearcoat: 1, clearcoatRoughness: .1 })));
  mesh.castShadow = true;
  scene.add(mesh); world.addBody(body);
  const ball = { body, mesh, life: 0, trail: 0, hit: 0 };
  body.addEventListener('collide', (e) => {
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    const now = performance.now();
    if (v > 3 && now - ball.hit > 60) {
      ball.hit = now;
      sfx.thud(Math.min(1, v / 22));
      const p = new THREE.Vector3(body.position.x, body.position.y, body.position.z);
      burst(p, 8, ['#fff6e6', '#ffe0bd', '#ffffff'], 6, 3, 0.16, 0.5);
      shake = Math.max(shake, Math.min(0.5, v / 50));
    }
  });
  balls.push(ball);
  recoil = 1; shake = Math.max(shake, 0.35);
  const dir = aimVel.clone().normalize();
  burst(start.clone().addScaledVector(dir, 0.4), 14, ['#ffc23d', '#ff6b5b', '#fff6e6'], 9, 1, 0.2, 0.45);
  sfx.shoot();
}

function explode(t) {
  if (t.exploded) return;
  t.exploded = true;
  const p = new THREE.Vector3(t.body.position.x, t.body.position.y, t.body.position.z);
  world.remove(t.body); levelGroup.remove(t.mesh);
  const i = things.indexOf(t); if (i >= 0) things.splice(i, 1);
  const R = 6.2;
  for (const o of things) {
    const dx = o.body.position.x - p.x, dy = o.body.position.y - p.y, dz = o.body.position.z - p.z;
    const dist = Math.hypot(dx, dy, dz);
    if (dist < R) {
      const k = 1 - dist / R;
      o.body.wakeUp();
      const inv = 1 / Math.max(dist, 0.3);
      o.body.velocity.x += dx * inv * 24 * k;
      o.body.velocity.y += dy * inv * 9 * k + 10 * k;
      o.body.velocity.z += dz * inv * 24 * k;
      o.body.angularVelocity.set(rand(-9, 9) * k, rand(-9, 9) * k, rand(-9, 9) * k);
      if (o.tnt && !o.armed && dist < R * 0.8) { o.armed = true; boomQueue.push({ t: o, wait: 0.12 }); }
    }
  }
  burst(p, 34, ['#ffc23d', '#ff6b5b', '#fff6e6', '#e63946'], 15, 5, 0.34, 0.8);
  burst(p, 14, ['#232859', '#4a4f86'], 8, 3, 0.4, 0.9);
  blast.position.copy(p); blast.position.y += 1.5; blast.intensity = 60;
  shake = 1; sfx.boom();
}

function afterPhysics(dt, rdt) {
  for (const t of things) {
    t.mesh.position.set(t.body.position.x, t.body.position.y, t.body.position.z);
    t.mesh.quaternion.set(t.body.quaternion.x, t.body.quaternion.y, t.body.quaternion.z, t.body.quaternion.w);
  }
  for (const b of balls) {
    b.mesh.position.set(b.body.position.x, b.body.position.y, b.body.position.z);
    b.mesh.quaternion.set(b.body.quaternion.x, b.body.quaternion.y, b.body.quaternion.z, b.body.quaternion.w);
  }

  for (let i = boomQueue.length - 1; i >= 0; i--) {
    const q = boomQueue[i]; q.wait -= dt;
    if (q.wait <= 0) { boomQueue.splice(i, 1); explode(q.t); }
  }

  comboT -= rdt; if (comboT <= 0) combo = 0;
  for (let i = things.length - 1; i >= 0; i--) {
    const t = things[i];
    if (!t.fallen && t.body.position.y < -0.9) {
      t.fallen = true;
      if (t.target) {
        combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
        const pts = 100 * combo; score += pts;
        const p = t.mesh.position.clone(); p.y = Math.max(p.y, -1.5) + 1.2;
        popText(p, '+' + pts, combo >= 3);
        sfx.pop(combo);
        burst(t.mesh.position.clone().setY(-0.6), 6, [t.hex, '#ffffff'], 5, 4, 0.2, 0.6);
      }
    }
    if (t.body.position.y < -22) {
      world.remove(t.body); levelGroup.remove(t.mesh); things.splice(i, 1);
    }
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.life += dt;
    b.trail -= dt;
    if (b.trail <= 0 && b.life < 1.2) {
      b.trail = 0.03;
      spawnP(b.mesh.position.clone(), new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)), '#fff6e6', 0.22, 0.35, 0);
    }
    const dead = b.life > 3.4 || b.body.position.y < -8;
    if (b.life > 3.0) b.mesh.scale.setScalar(clamp((3.4 - b.life) / 0.4, 0.01, 1));
    if (dead) { world.remove(b.body); scene.remove(b.mesh); balls.splice(i, 1); }
  }
  blast.intensity *= Math.pow(0.0025, rdt);
  if (blast.intensity < 0.3) blast.intensity = 0;
}

function gameLogic(rdt) {
  if (mode !== 'play') return;
  cooldown = Math.max(0, cooldown - rdt);
  renderLeft();
  if (endTimer > 0) {
    endTimer -= rdt;
    if (endTimer <= 0) {
      mode = 'ended'; targetScale = 1;
      showOverlay(endType);
      if (endType === 'win') sfx.win(); else sfx.lose();
    }
    return;
  }
  if (remainingTargets() === 0) {
    endType = 'win'; endTimer = 1.5; targetScale = 0.3;
    for (let i = 0; i < 70; i++) {
      spawnP(new THREE.Vector3(rand(-6, 6), rand(6, 11), cz + rand(-3, 3)), new THREE.Vector3(rand(-4, 4), rand(-2, 4), rand(-4, 4)), PALETTE[i % PALETTE.length], rand(0.18, 0.34), rand(1.2, 2.2), 6);
    }
    return;
  }
  if (firedAny && ballsLeft === 0 && balls.length === 0) {
    let moving = 0;
    for (const t of things) if (!t.fallen && t.body.sleepState !== CANNON.Body.SLEEPING && (t.body.velocity.norm2() + t.body.angularVelocity.norm2() > 0.12)) moving++;
    settleT = moving ? 0 : settleT + rdt;
    if (settleT > 0.7) { endType = 'lose'; endTimer = 0.4; }
  }
}

function updateCamera(rdt, now) {
  const sway = mode === 'menu' ? Math.sin(now / 3200) * 1.6 : aimPoint.x * 0.1;
  shake = Math.max(0, shake - rdt * 2.4);
  const s = reduceMotion ? 0 : shake * shake * 0.5;
  camera.position.set(camPos.x + sway + rand(-s, s), camPos.y + rand(-s, s), camPos.z + rand(-s, s));
  camera.lookAt(camLook.x + sway * 0.3, camLook.y, camLook.z);
  skyGroup.position.copy(camera.position);
}

function updateScenery(rdt, now) {
  for (const c of drifters) {
    if (c.userData.bob !== undefined) {
      c.position.y = c.userData.baseY + Math.sin(now / 1500 + c.userData.bob) * 0.35;
      if (c.userData.speed) { c.position.x += c.userData.speed * rdt; if (c.position.x > 60) c.position.x = -60; }
    } else { c.position.x += c.userData.speed * rdt; if (Math.abs(c.position.x) > 48) c.position.x *= -0.98; }
  }
  cloudSea.position.x = Math.sin(now / 40000) * 10;
  const pos = sparkGeo.attributes.position;
  for (let i = 0; i < SPARKS; i++) {
    let y = pos.getY(i) + rdt * (0.3 + (i % 5) * 0.08);
    if (y > 14) y = -4;
    pos.setY(i, y);
    pos.setX(i, pos.getX(i) + Math.sin(now / 1200 + i) * rdt * 0.2);
  }
  pos.needsUpdate = true;
  if (theme.stars > 0) starMat.opacity = theme.stars * (0.85 + Math.sin(now / 700) * 0.15);
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  timeScale += (targetScale - timeScale) * Math.min(1, rdt * 6);
  const dt = rdt * timeScale;
  acc += dt;
  let n = 0;
  while (acc >= FIXED && n < 8) { world.step(FIXED); acc -= FIXED; n++; }
  if (n === 8) acc = 0;
  afterPhysics(dt, rdt);
  gameLogic(rdt);
  updateFx(dt);
  updateCamera(rdt, now);
  updateScenery(rdt, now);
  aimNdcSmooth.lerp(aimNdc, 1 - Math.exp(-rdt * 22));
  resolveAim();
  const start = solveAim();
  updateAimVisuals(start, rdt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
levelIdx = clamp(unlocked - 1, 0, LEVEL_COUNT - 1);
menuPage = Math.floor(levelIdx / PAGE);
loadLevel(levelIdx);
showOverlay('menu');
requestAnimationFrame(frame);
window.__fiesta = { fire, startPlay, loadLevel, unlockAll() { unlocked = LEVEL_COUNT; }, get mode() { return mode; }, get left() { return remainingTargets(); }, get par() { return level.par; }, aim(x, y, z) { aimLock = true; aimPoint.set(x, y, z == null ? cz : z); }, get things() { return things.length; }, targets() { return things.filter((t) => t.target && !t.fallen).map((t) => [t.body.position.x, t.body.position.y, t.body.position.z]); } };
})();
</script>
