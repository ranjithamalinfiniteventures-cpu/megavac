<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Roll Rush</title>
<style>
  @font-face { font-family: "Fredoka"; font-weight: 500; src: url(lib/fredoka-latin-500-normal.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Fredoka"; font-weight: 700; src: url(lib/fredoka-latin-700-normal.woff2) format("woff2"); font-display: swap; }
  :root {
    --ink: #160f33;
    --glass: rgba(22, 14, 52, .42);
    --glass-edge: rgba(255, 255, 255, .22);
    --peach: #ffb38a; --pink: #ff5fa8; --violet: #8a5cff; --cyan: #3fe6ff; --gold: #ffd36b;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241650; font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-weight: 700; color: #fff; touch-action: none; }
  canvas { display: block; }
  button { font: inherit; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(20, 8, 50, .45) 100%); transition: opacity .3s; }

  /* HUD */
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .top { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 17px; letter-spacing: .5px; white-space: nowrap; }
  .chip small { font-size: 11px; opacity: .7; letter-spacing: 1.5px; }
  .gem { width: 16px; height: 16px; transform: rotate(45deg); border-radius: 3px; background: linear-gradient(135deg, #fff6c9, var(--gold) 45%, #ff9a3c); box-shadow: 0 0 10px rgba(255, 200, 90, .8); flex: none; }
  .track { position: relative; flex: 1; height: 12px; border-radius: 99px; background: rgba(22, 14, 52, .5); border: 1px solid var(--glass-edge); }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink)); box-shadow: 0 0 12px rgba(120, 140, 255, .8); }
  .track b { position: absolute; top: 50%; left: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--cyan) 60%, #157a9a); box-shadow: 0 0 12px var(--cyan); }
  .track .flag { position: absolute; right: -6px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 3px; background: conic-gradient(#fff 0 25%, #222 0 50%, #fff 0 75%, #222 0); background-size: 7px 7px; }
  .icon-btn { pointer-events: auto; width: 40px; height: 40px; border-radius: 14px; border: 1px solid var(--glass-edge); background: var(--glass); color: #fff; cursor: pointer; display: grid; place-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .icon-btn svg { width: 18px; height: 18px; }
  .hint { position: absolute; left: 0; right: 0; bottom: 12%; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 18px; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(30, 10, 60, .6); transition: opacity .4s; }
  .hint .ring { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 20px rgba(255, 255, 255, .6); animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(.8); opacity: .9 } 50% { transform: scale(1.1); opacity: .4 } }
  .toast { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 34px; letter-spacing: 2px; opacity: 0; transform: scale(.8); transition: opacity .25s, transform .25s; text-shadow: 0 0 24px rgba(63, 230, 255, .9), 0 3px 0 rgba(20, 8, 50, .5); }
  .toast.on { opacity: 1; transform: scale(1); }
  .combo { position: absolute; top: 64px; right: 18px; font-size: 15px; color: var(--gold); opacity: 0; transition: opacity .2s; text-shadow: 0 0 10px rgba(255, 200, 90, .8); }

  /* screens */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px 16px; text-align: center; }
  .screen.on { display: flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0 } }
  .shade { background: linear-gradient(180deg, rgba(20, 8, 50, .1), rgba(20, 8, 50, .65)); }
  #menu { justify-content: space-between; padding-top: max(9vh, 40px); padding-bottom: max(7vh, 28px); }
  .logo { margin: 0; line-height: .86; font-size: clamp(64px, 17vw, 128px); letter-spacing: 1px; filter: drop-shadow(0 6px 0 rgba(30, 10, 70, .55)) drop-shadow(0 0 30px rgba(255, 120, 180, .45)); }
  .logo span { display: block; background: linear-gradient(180deg, #fff 8%, #ffd0a8 40%, #ff6fae 75%, #a85cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo span + span { background: linear-gradient(180deg, #fff 8%, #a8f4ff 40%, #3fb8ff 75%, #6a5cff); -webkit-background-clip: text; background-clip: text; }
  .tagline { margin-top: 10px; font-weight: 500; font-size: 15px; letter-spacing: 5px; opacity: .85; text-transform: uppercase; }
  .menu-bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(360px, 100%); }
  .row { display: flex; gap: 10px; width: 100%; }
  .btn { position: relative; border: 0; cursor: pointer; color: #fff; border-radius: 22px; padding: 16px 24px; font-size: 22px; letter-spacing: 1.5px; width: 100%; background: linear-gradient(180deg, #ff8fb8, #ff4f9a 55%, #e2338a); box-shadow: 0 6px 0 #a3196a, 0 14px 30px rgba(255, 60, 150, .35), inset 0 2px 0 rgba(255, 255, 255, .45); text-shadow: 0 2px 0 rgba(120, 10, 70, .4); transition: transform .08s, box-shadow .08s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a3196a, 0 6px 16px rgba(255, 60, 150, .3), inset 0 2px 0 rgba(255, 255, 255, .45); }
  .btn.big { font-size: 28px; padding: 20px 24px; }
  .btn.glass { background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: 0 6px 0 rgba(10, 4, 30, .35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 18px; padding: 14px 16px; }
  .btn.glass:active { box-shadow: 0 2px 0 rgba(10, 4, 30, .35); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .card { width: min(380px, 100%); padding: 26px 22px 22px; border-radius: 28px; background: linear-gradient(180deg, rgba(60, 36, 130, .72), rgba(28, 16, 70, .82)); border: 1px solid var(--glass-edge); box-shadow: 0 30px 60px rgba(10, 4, 30, .5); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 14px; align-items: center; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0 } }
  .card h2 { margin: 0; font-size: 34px; letter-spacing: 2px; background: linear-gradient(180deg, #fff, #ffd0a8 60%, #ff8fb8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stars { display: flex; gap: 6px; margin: 4px 0; }
  .stars svg { width: 58px; height: 58px; }
  .stars svg:nth-child(2) { width: 72px; height: 72px; margin-top: -14px; }
  .stars .on { animation: starpop .5s cubic-bezier(.2, 1.6, .4, 1) backwards; }
  .stars .on:nth-child(2) { animation-delay: .15s } .stars .on:nth-child(3) { animation-delay: .3s }
  @keyframes starpop { from { transform: scale(0) rotate(-40deg) } }
  .stats { display: flex; gap: 10px; width: 100%; }
  .stat { flex: 1; padding: 10px; border-radius: 16px; background: rgba(10, 4, 30, .3); font-size: 22px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stat small { font-size: 11px; letter-spacing: 2px; opacity: .65; font-weight: 500; }
  .skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  .skin { position: relative; padding: 10px 4px 8px; border-radius: 18px; background: rgba(10, 4, 30, .3); border: 2px solid transparent; cursor: pointer; font-size: 13px; letter-spacing: .5px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .skin.sel { border-color: var(--cyan); box-shadow: 0 0 18px rgba(63, 230, 255, .35); }
  .skin canvas { width: 64px; height: 64px; }
  .skin .price { display: flex; align-items: center; gap: 5px; font-size: 13px; opacity: .9; }
  .skin .price .gem { width: 10px; height: 10px; }
  .skin.locked canvas { filter: saturate(.3) brightness(.6); }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .3s; }
</style>

<body>
<div class="vignette" id="vignette"></div>

<div class="hud" id="hud" style="display:none">
  <div class="top">
    <div class="chip"><small>LVL</small><span id="lvl">1</span></div>
    <div class="track"><i id="prog"></i><span class="flag"></span><b id="progDot"></b></div>
    <div class="chip"><span class="gem"></span><span id="coins">0</span></div>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 20 20" fill="#fff"><rect x="4" y="3" width="4" height="14" rx="1.5"/><rect x="12" y="3" width="4" height="14" rx="1.5"/></svg></button>
  </div>
  <div class="combo" id="combo"></div>
  <div class="toast" id="toast"></div>
  <div class="hint" id="hint"><div class="ring"></div>HOLD TO ROLL · SLIDE TO STEER</div>
</div>

<div class="screen on" id="menu">
  <div>
    <h1 class="logo"><span>ROLL</span><span>RUSH</span></h1>
    <div class="tagline">Sky Circuit</div>
  </div>
  <div class="menu-bottom">
    <div class="chip" id="menuInfo"></div>
    <button class="btn big" id="playBtn"><svg viewBox="0 0 20 20" fill="#fff"><path d="M5 3.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 5 3.5z"/></svg>PLAY</button>
    <div class="row">
      <button class="btn glass" id="skinsBtn"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 10c3-2.5 11-2.5 14 0" fill="none" stroke="#3fe6ff" stroke-width="2"/></svg>BALLS</button>
      <button class="btn glass" id="soundBtn"><svg viewBox="0 0 20 20" fill="#fff"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z"/><path id="soundWave" d="M13 6.5c1.5 1 1.5 6 0 7M15.5 4.5c3 2 3 9 0 11" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg><span id="soundLbl">SOUND</span></button>
    </div>
  </div>
</div>

<div class="screen shade" id="skinScreen">
  <div class="card">
    <h2>BALLS</h2>
    <div class="chip"><span class="gem"></span><span id="bank">0</span></div>
    <div class="skins" id="skinList"></div>
    <button class="btn glass" id="skinBack">DONE</button>
  </div>
</div>

<div class="screen shade" id="winScreen">
  <div class="card">
    <h2 id="winTitle">CLEARED!</h2>
    <div class="stars" id="stars"></div>
    <div class="stats">
      <div class="stat"><small>GEMS</small><span id="winGems"></span></div>
      <div class="stat"><small>TIME</small><span id="winTime"></span></div>
      <div class="stat"><small>FALLS</small><span id="winFalls"></span></div>
    </div>
    <button class="btn big" id="nextBtn">NEXT LEVEL</button>
    <button class="btn glass" id="winMenu">MENU</button>
  </div>
</div>

<div class="screen shade" id="pauseScreen">
  <div class="card">
    <h2>PAUSED</h2>
    <button class="btn big" id="resumeBtn">RESUME</button>
    <div class="row">
      <button class="btn glass" id="restartBtn">RESTART</button>
      <button class="btn glass" id="quitBtn">MENU</button>
    </div>
  </div>
</div>
<div class="flash" id="flash"></div>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "./lib/postprocessing/EffectComposer.js";
import { RenderPass } from "./lib/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "./lib/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "./lib/postprocessing/OutputPass.js";

const $ = (id) => document.getElementById(id);

// ---------- save ----------
const SAVE_KEY = "rollrush.v1";
let save = { level: 1, coins: 0, skin: 0, owned: [0], sound: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- rng ----------
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }

// ---------- audio ----------
let actx = null;
function beep(freq, dur, type = "sine", vol = 0.15, slide = 0, delay = 0) {
  if (!save.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  gem: (n) => { const f = 880 * Math.pow(1.06, Math.min(n, 12)); beep(f, 0.12, "sine", 0.09); beep(f * 1.5, 0.16, "sine", 0.05, 0, 0.05); },
  fall: () => beep(520, 0.7, "triangle", 0.1, 0.2),
  hit: () => { beep(110, 0.18, "square", 0.08, 0.5); beep(220, 0.08, "triangle", 0.1); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.35, "triangle", 0.09, 0, i * 0.09)),
  check: () => { beep(660, 0.15, "sine", 0.1); beep(990, 0.25, "sine", 0.08, 0, 0.08); },
  land: () => beep(90, 0.12, "sine", 0.18, 0.6),
};

// ---------- textures ----------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const softDot = canvasTex(64, 64, (c) => { const g = c.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.35, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = g; c.fillRect(0, 0, 64, 64); });
const cloudTex = canvasTex(256, 128, (c, w, h) => {
  const r = rng(7);
  for (let i = 0; i < 28; i++) {
    const x = w * (0.18 + r() * 0.64), y = h * (0.4 + r() * 0.3), rad = 18 + r() * 34;
    const g = c.createRadialGradient(x, y - rad * 0.3, 0, x, y, rad);
    g.addColorStop(0, "rgba(255,226,236,.8)"); g.addColorStop(0.6, "rgba(240,170,200,.45)"); g.addColorStop(1, "rgba(220,170,230,0)");
    c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill();
  }
});
const tileTex = canvasTex(512, 512, (c, w) => {
  c.fillStyle = "#a99ad8"; c.fillRect(0, 0, w, w);
  const n = 4, s = w / n, pad = 5;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = i * s + pad, y = j * s + pad, ss = s - pad * 2;
    const g = c.createLinearGradient(x, y, x + ss, y + ss);
    const tint = (i * 3 + j * 5) % 4;
    g.addColorStop(0, ["#ffffff", "#fbf8ff", "#fdf9fb", "#f8f6ff"][tint]); g.addColorStop(1, "#ece6fa");
    c.fillStyle = g; c.beginPath(); c.roundRect(x, y, ss, ss, 14); c.fill();
    c.fillStyle = "rgba(255,255,255,.7)"; c.fillRect(x + 10, y + 4, ss - 20, 2);
  }
});
tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;
const sideTex = canvasTex(256, 32, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#5a3fb0"); g.addColorStop(1, "#22175a");
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = "rgba(255,255,255,.12)"; for (let x = 0; x < w; x += 32) c.fillRect(x, 4, 2, h - 8);
});
sideTex.wrapS = THREE.RepeatWrapping;
const arrowTex = canvasTex(128, 256, (c, w, h) => {
  c.strokeStyle = "#fff"; c.lineWidth = 18; c.lineCap = "round"; c.lineJoin = "round";
  for (let i = 0; i < 3; i++) { const y = 60 + i * 60; c.globalAlpha = 1 - i * 0.28; c.beginPath(); c.moveTo(24, y + 30); c.lineTo(w / 2, y); c.lineTo(w - 24, y + 30); c.stroke(); }
});
const checkTex = canvasTex(64, 16, (c) => { for (let i = 0; i < 16; i++) for (let j = 0; j < 4; j++) { c.fillStyle = (i + j) % 2 ? "#1a1238" : "#fff"; c.fillRect(i * 4, j * 4, 4, 4); } });
checkTex.magFilter = THREE.NearestFilter;

// ---------- skins ----------
const SKINS = [
  { name: "Volt", price: 0, a: "#1c2238", b: "#0b0f1e", glow: "#3fe6ff" },
  { name: "Blossom", price: 150, a: "#fff4fa", b: "#f3c9df", glow: "#ff4f9a" },
  { name: "Ember", price: 300, a: "#2b1214", b: "#120708", glow: "#ff7a2f" },
  { name: "Aurora", price: 450, a: "#0f2a3a", b: "#071521", glow: "#59ffb0" },
  { name: "Solar", price: 700, a: "#ffe7a6", b: "#d9902e", glow: "#fff2c0" },
  { name: "Void", price: 1000, a: "#1b1030", b: "#06030d", glow: "#b86bff" },
];
function drawSkin(c, w, h, s, glowOnly) {
  if (glowOnly) { c.fillStyle = "#000"; c.fillRect(0, 0, w, h); }
  else {
    const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, s.b); g.addColorStop(0.5, s.a); g.addColorStop(1, s.b);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // panel seams
    c.strokeStyle = "rgba(255,255,255,.10)"; c.lineWidth = 2;
    for (let i = 0; i <= 8; i++) { c.beginPath(); c.moveTo(i * w / 8, 0); c.lineTo(i * w / 8, h); c.stroke(); }
    for (const f of [0.25, 0.75]) { c.beginPath(); c.moveTo(0, h * f); c.lineTo(w, h * f); c.stroke(); }
    c.fillStyle = "rgba(255,255,255,.12)";
    for (let i = 0; i < 8; i++) for (const f of [0.18, 0.82]) { c.beginPath(); c.arc((i + 0.5) * w / 8, h * f, 4, 0, 7); c.fill(); }
  }
  c.strokeStyle = s.glow; c.lineCap = "round";
  // two interleaved energy waves around the equator
  for (const [amp, ph, lw] of [[0.16, 0, h / 22], [0.16, Math.PI, h / 40]]) {
    c.lineWidth = lw; c.beginPath();
    for (let x = 0; x <= w; x += 4) c.lineTo(x, h / 2 + Math.sin(x / w * Math.PI * 4 + ph) * h * amp);
    c.stroke();
  }
  c.lineWidth = h / 70; c.globalAlpha = 0.8;
  for (const f of [0.12, 0.88]) { c.beginPath(); c.moveTo(0, h * f); c.lineTo(w, h * f); c.stroke(); }
  c.globalAlpha = 1;
}
function skinPreview(cv, s) {
  const c = cv.getContext("2d"), W = cv.width, r = W / 2;
  c.save(); c.beginPath(); c.arc(r, r, r - 2, 0, 7); c.clip();
  c.translate(-W * 0.5, 0); drawSkin(c, W * 2, W, s, false); c.restore();
  const sh = c.createRadialGradient(r * 0.7, r * 0.6, r * 0.1, r, r, r);
  sh.addColorStop(0, "rgba(255,255,255,.45)"); sh.addColorStop(0.35, "rgba(255,255,255,0)"); sh.addColorStop(1, "rgba(0,0,0,.55)");
  c.fillStyle = sh; c.beginPath(); c.arc(r, r, r - 2, 0, 7); c.fill();
}

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
let pixelRatio = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(pixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const HORIZON = new THREE.Color().setRGB(0.95, 0.42, 0.42);
scene.fog = new THREE.Fog(HORIZON, 90, 300);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1200);
const SUN_DIR = new THREE.Vector3(0.25, 0.11, -1).normalize();

// sky dome: dusk gradient, sun, moon and stars
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN_DIR }, uMoon: { value: new THREE.Vector3(-0.55, 0.42, -0.72).normalize() }, uHor: { value: HORIZON } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.); gl_Position = p.xyww; }`,
  fragmentShader: `
    uniform vec3 uSun, uMoon, uHor; varying vec3 vDir;

    else if (face < 2) uv.setXY(i, uv.getX(i) * L / 2, uv.getY(i));

  const m = new THREE.Mesh(geo, [M.side, M.side, M.top, M.under, M.side, M.side]);
  m.position.set(x, (yA + yB) / 2 - THICK / 2, z0 - len / 2);
  m.rotation.x = Math.atan2(dh, len);
  m.receiveShadow = true; m.castShadow = true;
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(edgeGeo, M.edge); e.scale.z = L; e.position.set(s * (w / 2 - 0.04), THICK / 2 + 0.03, 0); m.add(e);

const cv = renderer.domElement;
cv.addEventListener("pointerdown", (e) => { if (state !== "play") return; input.hold = true; input.dragX = e.clientX; input.dragAcc = 0; cv.setPointerCapture(e.pointerId); $("hint").style.opacity = 0; });
cv.addEventListener("pointermove", (e) => { if (input.dragX === null) return; input.dragAcc += e.clientX - input.dragX; input.dragX = e.clientX; });
const up = () => { input.hold = false; input.dragX = null; };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
addEventListener("keydown", (e) => {
  input.keys[e.code] = true;
  if (state === "play" && ["ArrowUp", "KeyW", "Space"].includes(e.code)) $("hint").style.opacity = 0;
  if (e.code === "Escape" || e.code === "KeyP") togglePause();
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
});
addEventListener("keyup", (e) => (input.keys[e.code] = false));
addEventListener("blur", () => { input.keys = {}; up(); if (state === "play") togglePause(); });

function togglePause() {
  if (state === "play") { state = "paused"; show("pauseScreen"); }
  else if (state === "paused") { state = "play"; show(null); last = performance.now(); }
}
$("pauseBtn").onclick = togglePause;
$("resumeBtn").onclick = togglePause;
$("restartBtn").onclick = () => startLevel(level);
$("quitBtn").onclick = $("winMenu").onclick = () => toMenu();
$("playBtn").onclick = () => startLevel(save.level);
$("nextBtn").onclick = () => startLevel(save.level);
$("skinsBtn").onclick = () => { renderSkins(); show("skinScreen"); };
$("skinBack").onclick = () => toMenu();
$("soundBtn").onclick = () => { save.sound = !save.sound; persist(); syncSound(); if (save.sound) sfx.check(); };
function syncSound() { $("soundLbl").textContent = save.sound ? "SOUND" : "MUTED"; $("soundWave").style.opacity = save.sound ? 1 : 0.2; }
function toMenu() {
  state = "menu"; buildLevel(save.level); trailPts.length = 0; vel.set(0, 0, 0); ball.quaternion.identity();
  $("menuInfo").innerHTML = `<small>LEVEL</small>${save.level}&nbsp;&nbsp;<span class="gem"></span>${save.coins}`;
  show("menu");
  camera.position.set(0, 2.6, 8);
}

function renderSkins() {
  $("bank").textContent = save.coins;
  const list = $("skinList"); list.innerHTML = "";
  SKINS.forEach((s, i) => {
    const owned = save.owned.includes(i);
    const d = document.createElement("div"); d.className = "skin" + (save.skin === i ? " sel" : "") + (owned ? "" : " locked");
    const c = document.createElement("canvas"); c.width = c.height = 128; skinPreview(c, s);
    const label = document.createElement("div"); label.textContent = s.name;
    const price = document.createElement("div"); price.className = "price";
    price.innerHTML = owned ? (save.skin === i ? "EQUIPPED" : "OWNED") : `<span class="gem"></span>${s.price}`;
    d.append(c, label, price);
    d.onclick = () => {
      if (!owned) { if (save.coins < s.price) { beep(180, 0.15, "square", 0.06); d.animate([{ transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none" }], 200); return; } save.coins -= s.price; save.owned.push(i); sfx.win(); }
      save.skin = i; applySkin(i); persist(); renderSkins();
    };
    list.append(d);
  });
}

syncSound();
toMenu();
requestAnimationFrame(frame);
window.__game = { get state() { return state; }, pos, vel, input, startLevel, get finishZ() { return finishZ; }, bloom };
</script>
</body>
