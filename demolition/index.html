<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mega Demolition</title>
<style>
:root{--ui:#ffcc33;--bg:#0b0d14;--panel:rgba(14,16,26,.86);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:10px 14px;pointer-events:none}
#hud .pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px)}
#lvlName{font-weight:800;letter-spacing:.5px;white-space:nowrap}
#lvlName small{display:block;font-weight:600;opacity:.6;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
#prog{flex:1;max-width:520px;min-width:120px}
#bar{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden}
#barFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff5a1f,#ffcc33);border-radius:7px;transition:width .15s}
.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.55)}
#pct{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;opacity:.85}
#stars{color:var(--ui);letter-spacing:2px}
.iconBtn{width:40px;height:40px;display:grid;place-items:center;font-size:18px}
#hud .sp{flex:1}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:8px;display:flex;justify-content:center;pointer-events:none}
#weapons{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;scrollbar-width:thin}
.w{position:relative;flex:0 0 auto;width:64px;height:68px;border-radius:12px;background:rgba(255,255,255,.06);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.w .ic{font-size:26px;line-height:1}
.w .nm{font-size:10px;font-weight:700;margin-top:4px;opacity:.85;white-space:nowrap}
.w .key{position:absolute;top:2px;left:5px;font-size:9px;opacity:.5}
.w.sel{border-color:var(--ui);background:rgba(255,204,51,.14)}
.w .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*360deg),transparent 0);pointer-events:none}
.w.locked{opacity:.4;filter:grayscale(1)}
.w.locked .ic::after{content:"🔒";position:absolute;font-size:14px;right:4px;bottom:4px}
.w .lv{position:absolute;bottom:2px;right:4px;font-size:9px;opacity:.7}
#det{display:none;pointer-events:auto;position:fixed;right:14px;bottom:100px;padding:12px 18px;border-radius:14px;background:#d6232a;font-weight:900;letter-spacing:1px;box-shadow:0 0 24px rgba(255,40,40,.6);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#heat{display:none;position:fixed;left:50%;bottom:98px;transform:translateX(-50%);width:200px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd000,#ff2a00)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,10,0,.55),rgba(0,0,0,.85));z-index:5;padding:16px}
.ov.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:860px;width:100%;max-height:100%;overflow:auto;text-align:center}
h1{font-size:clamp(36px,8vw,76px);font-weight:900;letter-spacing:2px;line-height:.95;background:linear-gradient(180deg,#fff3a0,#ffb300 45%,#ff3d00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a1500)}
.sub{opacity:.7;margin:10px 0 20px}
.big{display:inline-block;padding:14px 30px;border-radius:14px;background:linear-gradient(180deg,#ffcf3a,#ff7a00);color:#2a1200;font-weight:900;font-size:20px;letter-spacing:1px;box-shadow:0 6px 0 #8a3a00;margin:6px}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #8a3a00}
.big.alt{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.4)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:18px;text-align:left}
.lv{padding:10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;min-height:62px}
.lv b{display:block;font-size:11px;opacity:.55}
.lv .st{color:var(--ui);font-size:12px;margin-top:3px}
.lv.lock{opacity:.35;cursor:not-allowed}
.lv:not(.lock):hover{border-color:var(--ui)}
#doneTitle{font-size:clamp(34px,7vw,60px)}
#doneStars{font-size:48px;color:var(--ui);margin:6px 0;letter-spacing:6px}
#unlocks{margin:12px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.unl{background:rgba(255,204,51,.15);border:1px solid var(--ui);border-radius:12px;padding:10px 14px;font-weight:800;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-size:clamp(28px,6vw,64px);font-weight:900;text-align:center;pointer-events:none;opacity:0;text-shadow:0 4px 0 #000,0 0 30px rgba(255,120,0,.8);transition:opacity .4s;white-space:nowrap}
#banner small{display:block;font-size:.35em;letter-spacing:4px;opacity:.8}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--ui);border-radius:12px;padding:8px 16px;font-weight:800;display:none;pointer-events:auto;z-index:4}
#combo{position:fixed;right:18px;top:80px;font-weight:900;font-size:28px;color:#ffdd55;text-shadow:0 3px 0 #000;pointer-events:none;opacity:0;transition:opacity .3s}
@media (max-width:640px){.w{width:54px;height:60px}.w .ic{font-size:22px}#lvlName{font-size:13px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="pill" id="lvlName"><small>Level 1</small>Garden Shed</div>
  <div class="pill" id="prog"><div id="bar"><div id="barFill"></div><i class="mark" style="left:75%"></i><i class="mark" style="left:90%"></i><i class="mark" style="left:98%"></i></div><div id="pct"><span id="pctTxt">0% destroyed</span><span id="stars">☆☆☆</span></div></div>
  <div class="sp"></div>
  <button class="pill iconBtn" id="bReset" title="Restart level (R)">↻</button>
  <button class="pill iconBtn" id="bMute" title="Sound (M)">🔊</button>
  <button class="pill iconBtn" id="bMenu" title="Menu (Esc)">☰</button>
</div>
<div id="combo"></div>
<div id="toast"></div>
<div id="banner"></div>
<div id="heat"><i></i></div>
<button id="det">💥 DETONATE (Space)</button>
<div id="bottom"><div id="weapons"></div></div>

<div class="ov show" id="menu"><div class="card">
  <h1>MEGA<br>DEMOLITION</h1>
  <p class="sub">50 targets. 16 weapons. Zero mercy. Flatten everything from a garden shed to the wonders of the world.</p>
  <button class="big" id="bPlay">▶ PLAY</button>
  <div id="grid"></div>
  <p class="sub" style="margin-top:18px;font-size:13px">Click / tap to fire · 1–9, 0, Q–Y switch weapon · Space detonates C4 · R restart · M mute</p>
</div></div>

<div class="ov" id="done"><div class="card" style="max-width:520px">
  <div id="doneTitle" style="font-weight:900">DEMOLISHED!</div>
  <div id="doneStars">★★★</div>
  <div id="doneTxt" class="sub"></div>
  <div id="unlocks"></div>
  <button class="big" id="bNext">NEXT TARGET ▶</button><br>
  <button class="big alt" id="bKeep">Keep smashing</button>
</div></div>

<script>
"use strict";
// ================= CONSTANTS =================
const W=1600,H=980,S=10,COLS=160,ROWS=84,GY=840,G=1400;
const MAT={
  wood:    {hp:1.0, c:'#a5693a', den:.6, flam:1, snd:'wood'},
  plank:   {hp:1.0, c:'#c08a52', den:.6, flam:1, snd:'wood'},
  roof:    {hp:1.4, c:'#8a3326', den:.8, flam:.6, snd:'brick'},
  brick:   {hp:2.4, c:'#b4553c', den:1, flam:0, snd:'brick'},
  concrete:{hp:3.6, c:'#9c9b96', den:1.2, flam:0, snd:'brick'},
  stone:   {hp:3.2, c:'#cdb47e', den:1.2, flam:0, snd:'brick'},
  marble:  {hp:3.0, c:'#f2eee6', den:1.1, flam:0, snd:'brick'},
  steel:   {hp:6.0, c:'#6f7b88', den:1.6, flam:0, snd:'metal'},
  metal:   {hp:2.6, c:'#c0392b', den:1.1, flam:.1, snd:'metal'},
  glass:   {hp:.35, c:'#9fdcff', den:.5, flam:0, snd:'glass'},
  gold:    {hp:2.8, c:'#e9b93a', den:1.4, flam:0, snd:'metal'},
  tire:    {hp:2.0, c:'#222222', den:.8, flam:.4, snd:'wood'},
  copper:  {hp:2.8, c:'#5fa58f', den:1.2, flam:0, snd:'metal'},
  leaf:    {hp:.5, c:'#3e8e41', den:.4, flam:1, snd:'wood'},
  frame:   {hp:1.2, c:'#f3f1ea', den:.6, flam:.6, snd:'wood'},
  white:   {hp:2.2, c:'#f4f4f0', den:1, flam:0, snd:'brick'},
};
const WEAPONS=[
  {id:'tnt',     n:'TNT',        ic:'🧨',lv:1, cd:.35, r:90},
  {id:'grenade', n:'Grenade',    ic:'💣',lv:2, cd:.5,  r:70},
  {id:'rocket',  n:'Rocket',     ic:'🚀',lv:3, cd:.9,  r:85},
  {id:'c4',      n:'C4 Remote',  ic:'📟',lv:5, cd:.15, r:75},
  {id:'missile', n:'Missile',    ic:'🎯',lv:7, cd:2.2, r:140},
  {id:'ball',    n:'Wreck Ball', ic:'⚫',lv:9, cd:3.5, r:34},
  {id:'napalm',  n:'Napalm',     ic:'🔥',lv:11,cd:5,   r:120},
  {id:'laser',   n:'Laser',      ic:'🔴',lv:13,cd:0,   r:14},
  {id:'cluster', n:'Cluster',    ic:'🎆',lv:16,cd:4,   r:160},
  {id:'air',     n:'Airstrike',  ic:'✈️',lv:19,cd:8,   r:220},
  {id:'rail',    n:'Railgun',    ic:'⚡',lv:22,cd:3,   r:16},
  {id:'quake',   n:'Earthquake', ic:'🌋',lv:25,cd:14,  r:0},
  {id:'meteor',  n:'Meteors',    ic:'☄️',lv:29,cd:12,  r:200},
  {id:'tornado', n:'Tornado',    ic:'🌪️',lv:33,cd:15,  r:80},
  {id:'hole',    n:'Black Hole', ic:'🕳️',lv:38,cd:18,  r:260},
  {id:'nuke',    n:'Nuke',       ic:'☢️',lv:44,cd:30,  r:560},
];
const KEYS=['1','2','3','4','5','6','7','8','9','0','q','w','e','r_','t','y'];

// ================= RNG / UTILS =================
let seed=1;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  r=clamp(r*f|0,0,255);g=clamp(g*f|0,0,255);b=clamp(b*f|0,0,255);return `rgb(${r},${g},${b})`}

// ================= BUILDER =================
class B{
  constructor(){this.cells=new Map()}
  set(x,u,m,c){x=Math.round(x);u=Math.round(u);if(x<0||x>=COLS||u<0||u>=ROWS)return;this.cells.set(u*COLS+x,{m,c})}
  del(x,u){x=Math.round(x);u=Math.round(u);this.cells.delete(u*COLS+x)}
  rect(x,u,w,h,m,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,u+j,m,c)}
  clear(x,u,w,h){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.del(x+i,u+j)}
  tri(cx,u,hw,h,m,c){for(let j=0;j<h;j++){const hh=hw*(1-j/h);for(let x=Math.round(cx-hh);x<=Math.round(cx+hh);x++)this.set(x,u+j,m,c)}}
  dome(cx,u,r,m,c){for(let j=0;j<=r;j++){const hh=Math.sqrt(Math.max(0,r*r-j*j));for(let x=Math.round(cx-hh);x<=Math.round(cx+hh);x++)this.set(x,u+j,m,c)}}
  disc(cx,cy,r,m,c){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(i*i+j*j<=r*r+.5)this.set(cx+i,cy+j,m,c)}
  onion(cx,u,rw,h,m,c,fin){for(let j=0;j<h;j++){const t=j/h;const hh=rw*Math.sin(Math.PI*(.2+.8*t))*(1.15-t*.5);for(let x=Math.round(cx-hh);x<=Math.round(cx+hh);x++)this.set(x,u+j,m,c)}
    if(fin)this.rect(cx,u+h,1,fin,'gold')}
  line(x0,u0,x1,u1,m,c){const n=Math.max(Math.abs(x1-x0),Math.abs(u1-u0));for(let k=0;k<=n;k++){this.set(x0+(x1-x0)*k/n,u0+(u1-u0)*k/n,m,c)}}
  windows(x,u,w,h,sx,sy,ww,wh,m='glass',c){for(let j=1;j+wh<=h;j+=sy)for(let i=1;i+ww<=w-1+1&&i+ww<=w;i+=sx)this.rect(x+i,u+j,Math.min(ww,w-i-1),wh,m,c)}
  arches(x,u,w,h,step,aw,ah){for(let i=1;i+aw<w;i+=step){this.clear(x+i,u,aw,ah-1);const cx=x+i+(aw-1)/2;for(let k=0;k<aw;k++){const dx=Math.abs(x+i+k-cx);if(dx<aw/2-.3)this.del(x+i+k,u+ah-1)}}}
}
// ---- reusable shapes ----
function hx(hex,f){const n=parseInt(hex.slice(1),16);const c=v=>clamp(Math.round(v*f),0,255).toString(16).padStart(2,'0');return '#'+c(n>>16)+c(n>>8&255)+c(n&255)}
function win(b,x,u,w=2,h=3,shut){b.rect(x-1,u-1,w+2,h+2,'frame');b.rect(x,u,w,h,'glass');if(w>2)b.rect(x+Math.floor(w/2),u,1,h,'frame');b.rect(x-1,u-1,w+2,1,'stone','#d8d2c4');if(shut){b.rect(x-2,u-1,1,h+2,'plank',shut);b.rect(x+w+1,u-1,1,h+2,'plank',shut)}}
function house(b,x,w,h,wall='brick',roof='roof',wc,opt={}){
  const shut=opt.shut||['#2e5e4e','#2c3e70','#7a2e2a','#3d3d3d'][Math.floor(rnd()*4)];
  b.rect(x-1,0,w+2,1,'stone','#8f8a80');b.rect(x,1,w,h-1,wall,wc);
  const floors=Math.max(1,Math.round(h/10)),fh=(h-1)/floors;
  for(let f=0;f<floors;f++){const u0=1+Math.round(f*fh);if(f>0)b.rect(x,u0-1,w,1,'frame');
    for(let wx=x+3;wx+3<=x+w-2;wx+=7){if(f===0&&Math.abs(wx+1-(x+w/2))<4)continue;win(b,wx,u0+Math.max(2,Math.round(fh/2)-2),2,Math.min(4,Math.max(2,Math.round(fh)-5)),shut)}}
  const dx=Math.round(x+w/2)-1;b.rect(dx-1,1,5,9,'frame');b.rect(dx,1,3,8,'wood',opt.door||'#6b2f1e');b.set(dx+2,4,'gold');b.rect(dx,6,3,1,'wood','#4a2015');b.rect(dx-2,0,7,1,'stone','#b5aea0');
  const rh=Math.ceil(w/2.3);b.rect(x-2,h,w+4,1,'frame');b.tri(x+(w-1)/2,h+1,w/2+2.5,rh,roof);
  if(w>=16)b.disc(Math.round(x+(w-1)/2),h+Math.round(rh/2.6),1,'glass');
  if(opt.chimney!==false){const cx=Math.round(x+w*.74);const ct=h+rh-Math.round(rh*(Math.abs(cx-(x+w/2))/(w/2+2.5)))+2;b.rect(cx,h,3,ct-h+1,'brick','#8e3b2c');b.rect(cx-1,ct+1,5,1,'stone','#6d6a64');(b.smoke||(b.smoke=[])).push([cx+1,ct+2])}}
function bush(b,x,r=2,c='#3e8e41'){b.disc(x,r-1,r,'leaf',c);b.set(x-1,r,'leaf','#5fb35f')}
function fence(b,x0,x1){for(let x=x0;x<=x1;x++){b.set(x,2,'plank','#f2efe6');if((x-x0)%3===0)b.rect(x,0,1,4,'plank','#f2efe6')}}

function wheel(b,cx,big){const r=big?2.5:2;b.disc(cx,2,r,'tire');b.disc(cx,2,1,'steel','#c9ced6');b.set(cx,2,'steel','#5b6168')}
const CARTYPES=['sedan','suv','sport','pickup','police','taxi','hatch'];
function car(b,x,col='#c0392b',type){let T=typeof type==='string'?type:'sedan';if(T==='random')T=CARTYPES[Math.floor(rnd()*CARTYPES.length)];
  if(T==='taxi')col='#f4c20d';if(T==='police')col='#1d2b4f';
  const dk=hx(col,.72),lt=hx(col,1.18),trim='#2b2d31',gl='#2c3e50';
  if(T==='sport'){b.rect(x+1,2,19,2,'metal',col);b.rect(x+2,4,16,1,'metal',col);b.rect(x+18,4,1,1,'metal',col);b.rect(x+7,5,7,1,'glass',gl);b.set(x+6,5,'metal',col);b.set(x+14,5,'metal',col);b.rect(x+8,6,5,1,'metal',col);
    b.rect(x+1,5,3,1,'metal',trim);b.set(x+2,4,'metal',trim);b.rect(x+1,1,19,1,'metal',trim);b.set(x+20,3,'glass','#fff6c0');b.set(x+1,3,'glass','#ff3030');b.rect(x+10,2,1,2,'metal',dk);wheel(b,x+4);wheel(b,x+16);return}
  if(T==='pickup'){b.rect(x+1,2,19,3,'metal',col);b.rect(x+1,5,1,1,'metal',col);b.rect(x+10,5,1,1,'metal',col);b.rect(x+11,5,8,1,'metal',col);
    b.rect(x+11,6,7,3,'metal',col);b.rect(x+12,6,2,2,'glass',gl);b.rect(x+15,6,2,2,'glass',gl);b.rect(x+11,9,7,1,'metal',dk);b.rect(x,1,21,1,'metal',trim);b.set(x+20,4,'glass','#fff6c0');b.set(x+1,4,'glass','#ff3030');b.rect(x+2,4,8,1,'metal',dk);wheel(b,x+5,1);wheel(b,x+16,1);return}
  if(T==='suv'){b.rect(x+1,2,19,4,'metal',col);b.rect(x+2,6,15,3,'metal',col);b.rect(x+3,6,4,2,'glass',gl);b.rect(x+8,6,4,2,'glass',gl);b.rect(x+13,6,3,2,'glass',gl);b.rect(x+2,9,14,1,'steel','#555b63');
    b.rect(x,1,21,1,'metal',trim);b.rect(x+1,5,19,1,'metal',lt);b.set(x+20,4,'glass','#fff6c0');b.set(x+1,4,'glass','#ff3030');b.rect(x+7,2,1,3,'metal',dk);b.rect(x+12,2,1,3,'metal',dk);wheel(b,x+5,1);wheel(b,x+16,1);return}
  // sedan / police / taxi / hatch
  const hatch=T==='hatch';const L=hatch?16:20;
  b.rect(x+1,2,L-1,3,'metal',col);b.rect(x+1,5,L-2,1,'metal',lt);b.rect(x,1,L+1,1,'metal',trim);
  const c0=hatch?x+3:x+5,c1=hatch?x+13:x+15;b.rect(c0,6,c1-c0,1,'metal',col);b.rect(c0+1,7,c1-c0-2,1,'metal',col);b.rect(c0+2,8,c1-c0-4,1,'metal',col);
  b.rect(c0+1,6,Math.floor((c1-c0)/2)-1,1,'glass',gl);b.rect(c0+Math.floor((c1-c0)/2)+1,6,Math.ceil((c1-c0)/2)-2,1,'glass',gl);b.rect(c0+2,7,Math.floor((c1-c0)/2)-2,1,'glass',gl);b.rect(c0+Math.floor((c1-c0)/2)+1,7,Math.ceil((c1-c0)/2)-3,1,'glass',gl);
  b.rect(x+Math.round(L/2),2,1,3,'metal',dk);b.set(x+L-1+1,3,'glass','#fff6c0');b.set(x+1,4,'glass','#ff3030');b.set(x+Math.round(L/2)+2,4,'metal',trim);
  if(T==='police'){b.rect(x+6,2,9,3,'metal','#f4f4f4');b.set(x+9,9,'glass','#ff2a2a');b.set(x+10,9,'glass','#2a6bff')}

const DIAG=[[1,1],[-1,1],[1,-1],[-1,-1]];
function support(initial){
  const seen=new Uint8Array(COLS*ROWS);const q=[];
  for(let x=0;x<COLS;x++){const b=grid[(ROWS-1)*COLS+x];if(b){seen[(ROWS-1)*COLS+x]=1;q.push((ROWS-1)*COLS+x)}}
  while(q.length){const k=q.pop();const x=k%COLS,y=(k/COLS)|0;
    if(x>0){const n=k-1;if(!seen[n]&&grid[n]){seen[n]=1;q.push(n)}}
    if(x<COLS-1){const n=k+1;if(!seen[n]&&grid[n]){seen[n]=1;q.push(n)}}
    if(y>0){const n=k-COLS;if(!seen[n]&&grid[n]){seen[n]=1;q.push(n)}}
    if(y<ROWS-1){const n=k+COLS;if(!seen[n]&&grid[n]){seen[n]=1;q.push(n)}}
    for(const d of DIAG){const nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;const n=ny*COLS+nx;if(!seen[n]&&grid[n]){seen[n]=1;q.push(n)}}}
  let fell=0;
  for(let k=0;k<grid.length;k++){const b=grid[k];if(b&&!seen[k]){unbond(b,R(-20,20),R(-10,30));if(!initial)b.va=R(-3,3);fell++}}
  if(fell>30&&!initial){SFX.rumble(Math.min(3,fell/200+.6));shake=Math.max(shake,Math.min(14,fell/40))}
  if(fell>8&&!initial){// dust puff from the break
    for(let i=0;i<Math.min(20,fell/10);i++){const b=loose[loose.length-1-Math.floor(Math.random()*Math.min(fell,loose.length))];if(b)addP('dust',b.x,b.y,R(-40,40),R(-30,10),R(1.5,3),R(14,30))}}
}
function unbond(b,vx=0,vy=0){if(!b.st)return;b.st=false;grid[b.r*COLS+b.gx]=null;b.vx=vx;b.vy=vy;b.va=R(-2,2);b.sleep=false;b.sl=0;loose.push(b);bonded--;staticDirty=true;supportDirty=true}
function kill(b,silent){if(!b.alive)return;b.alive=false;if(b.st){grid[b.r*COLS+b.gx]=null;bonded--;b.st=false;staticDirty=true;supportDirty=true}
  const n=b.m==='glass'?4:2;for(let i=0;i<n;i++)addP(b.m==='glass'?'glass':'chip',b.x+R(-4,4),b.y+R(-4,4),R(-250,250)+b.vx*.5,R(-350,80)+b.vy*.5,R(.8,1.8),R(2,4),b.col);

// ================= LOOSE PHYSICS =================
const hash=new Map();
function stepLoose(dt){
  // spatial hash
  hash.clear();for(const b of loose){if(!b.alive)continue;const k=((b.x/S)|0)+((b.y/S)|0)*4096;let a=hash.get(k);if(!a)hash.set(k,a=[]);a.push(b)}
  for(const b of loose){if(!b.alive)continue;
    if(b.sleep){b.sl+=dt;if(b.sl>.25){b.sl=0;// support check
        const below=b.y+S;if(below<GY-1&&!staticAt(b.x,below)&&!neighborBelow(b))b.sleep=false}continue}
    b.vy+=G*dt;b.vx*=1-.05*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.va*dt;
    if(b.burn>0){b.burn-=dt;b.hp-=dt*.35*(b.M.flam||.15);if(Math.random()<dt*14)addP('fire',b.x,b.y-4,R(-20,20),R(-60,-20),R(.3,.6),R(8,14));if(b.hp<=0){kill(b,true);continue}}
    let ground=false;
    if(b.y>GY-S/2){b.y=GY-S/2;if(b.vy>220)impact(b,b.vy);b.vy*=-.18;b.vx*=.82;b.va*=.6;ground=true}
    if(b.x<-200||b.x>W+200||b.y<-1500){b.alive=false;continue}
    // collide with static cells
    const cx=(b.x/S)|0,cy=(b.y/S)|0;
    for(let yy=cy-1;yy<=cy+1;yy++)for(let xx=cx-1;xx<=cx+1;xx++){if(xx<0||yy<0||xx>=COLS||yy>=ROWS)continue;const s=grid[yy*COLS+xx];if(!s)continue;
      const ox=S-Math.abs(b.x-s.x),oy=S-Math.abs(b.y-s.y);if(ox<=0||oy<=0)continue;
      if(ox<oy){const sg=Math.sign(b.x-s.x)||1;b.x+=ox*sg;if(Math.abs(b.vx)>380)hitStatic(s,Math.abs(b.vx),b);b.vx*=-.2}
      else{const sg=Math.sign(b.y-s.y)||-1;b.y+=oy*sg;if(Math.abs(b.vy)>380)hitStatic(s,Math.abs(b.vy),b);if(sg<0){ground=true;b.vx*=.85}b.vy*=-.15}}
    // loose vs loose
    for(let yy=cy-1;yy<=cy+1;yy++)for(let xx=cx-1;xx<=cx+1;xx++){const a=hash.get(xx+yy*4096);if(!a)continue;for(const o of a){if(o===b||!o.alive)continue;
      const dx=b.x-o.x,dy=b.y-o.y;const ox=S*.95-Math.abs(dx),oy=S*.95-Math.abs(dy);if(ox<=0||oy<=0)continue;
      if(ox<oy){const p=ox*Math.sign(dx||1);const w=o.sleep?1:.5;b.x+=p*w;if(!o.sleep)o.x-=p*.5;const rv=b.vx-o.vx;if(rv*dx<0){b.vx-=rv*.5;if(!o.sleep)o.vx+=rv*.5}}
      else{const p=oy*Math.sign(dy||1);const w=o.sleep?1:.5;b.y+=p*w;if(!o.sleep)o.y-=p*.5;const rv=b.vy-o.vy;if(rv*dy<0){b.vy-=rv*.5;if(!o.sleep)o.vy+=rv*.5}if(dy<0){ground=true;b.vx*=.92;b.va*=.8}}}}

function neighborBelow(b){const cx=(b.x/S)|0,cy=((b.y+S*.9)/S)|0;for(let xx=cx-1;xx<=cx+1;xx++){const a=hash.get(xx+cy*4096);if(a)for(const o of a)if(o!==b&&o.alive&&o.y>b.y+S*.5&&Math.abs(o.x-b.x)<S)return true}return false}

function stepFire(dt){

  d.onclick=e=>{e.stopPropagation();select(i)};box.appendChild(d)})}
function select(i){const w=WEAPONS[i];if(!unlocked(w)){toast(`${w.ic} ${w.n} unlocks at level ${w.lv}`);return}wSel=i;SFX.click();[...$('weapons').children].forEach((d,k)=>d.classList.toggle('sel',k===i))}
function updateUI(){const kids=$('weapons').children;WEAPONS.forEach((w,i)=>{const k=kids[i];if(!k)return;let p=0;if(cdUntil[w.id]&&time<cdUntil[w.id])p=(cdUntil[w.id]-time)/w.cd;if(w.id==='laser'&&overheat)p=heat;k.lastChild.style.setProperty('--p',p.toFixed(3))});
  const nC4=projs.filter(p=>p.t==='c4').length;$('det').style.display=nC4?'block':'none';$('det').textContent=`💥 DETONATE ${nC4} (Space)`;
  const lw=WEAPONS[wSel].id==='laser';$('heat').style.display=lw?'block':'none';$('heat').firstChild.style.width=(heat*100)+'%';
  const cb=$('combo');if(comboT>0&&combo>=3){cb.style.opacity=1;cb.textContent=`x${combo} CHAIN!`}else cb.style.opacity=0}
let toastT=0;function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';toastT=2}
let bannerT=0;function showBanner(t,s){const e=$('banner');e.innerHTML=`<small>${s}</small>${t}`;e.style.opacity=1;bannerT=2.2}
function buildMenu(){const g=$('grid');g.innerHTML='';LEVELS.forEach((l,i)=>{const d=document.createElement('button');const lock=i+1>save.max;d.className='lv'+(lock?' lock':'');const st=save.stars[i]||0;d.innerHTML=`<b>LEVEL ${i+1}</b>${lock?'🔒 ':''}${l.n}<div class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>`;
  d.onclick=()=>{if(lock)return;SFX.init();SFX.click();$('menu').classList.remove('show');loadLevel(i)};g.appendChild(d)})}
$('bPlay').onclick=()=>{SFX.init();SFX.click();$('menu').classList.remove('show');loadLevel(Math.min(save.max-1,LEVELS.length-1))};
$('bMenu').onclick=()=>{buildMenu();$('menu').classList.add('show')};
$('bReset').onclick=()=>{SFX.click();loadLevel(level)};
$('bMute').onclick=()=>{SFX.muted=!SFX.muted;$('bMute').textContent=SFX.muted?'🔇':'🔊';if(SFX.muted)SFX.laserOn(false)};
$('bNext').onclick=()=>{$('done').classList.remove('show');SFX.click();if(level<LEVELS.length-1)loadLevel(level+1);else{buildMenu();$('menu').classList.add('show')}};
$('bKeep').onclick=()=>{$('done').classList.remove('show')};
$('det').onclick=e=>{e.stopPropagation();detonate()};
function toWorld(e){const r=cv.getBoundingClientRect();const dpr=view.dpr;return{x:((e.clientX-r.left)*dpr-view.ox)/view.s,y:((e.clientY-r.top)*dpr-view.oy)/view.s}}
cv.addEventListener('pointerdown',e=>{SFX.init();const p=toWorld(e);mouse.x=p.x;mouse.y=p.y;mouse.down=true;mouse.in=true;cv.setPointerCapture(e.pointerId);const w=WEAPONS[wSel];if(!unlocked(w))return;if(!fire(w,p.x,clamp(p.y,0,GY-2))&&w.id!=='laser'&&w.id!=='c4'){SFX.osc&&SFX.ctx&&!SFX.muted&&SFX.osc(.08,'square',180,140,.05,0)}});
cv.addEventListener('pointermove',e=>{const p=toWorld(e);mouse.x=p.x;mouse.y=p.y;mouse.in=true});
cv.addEventListener('pointerup',()=>{mouse.down=false});cv.addEventListener('pointercancel',()=>{mouse.down=false});cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')mouse.in=false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' '){e.preventDefault();detonate();return}if(k==='escape'){if($('menu').classList.contains('show')&&level!=null){$('menu').classList.remove('show')}else{buildMenu();$('menu').classList.add('show')}return}
  if(k==='m'){$('bMute').click();return}if(k==='r'&&!e.ctrlKey&&!e.metaKey){loadLevel(level);return}const i=KEYS.indexOf(k);if(i>=0)select(i)});

// ================= LOOP =================
let last=performance.now(),acc=0;const DT=1/120;
function frame(now){let real=Math.min(.05,(now-last)/1000);last=now;avgDt+=(real-avgDt)*.05;if(avgDt>1/40)Q=Math.max(.35,Q-.01);else if(avgDt<1/55)Q=Math.min(1,Q+.005);
  if(slowT>0){slowT-=real;if(slowT<=0)timeScale=1}else timeScale+=(1-timeScale)*real*3;
  const paused=$('menu').classList.contains('show');
  if(!paused){acc+=real*timeScale;let n=0;while(acc>=DT&&n<6){step(DT);acc-=DT;n++}if(n>=6)acc=0}
  shake*=Math.pow(.02,real);if(shake<.3)shake=0;flash=Math.max(0,flash-real*2.2);
  for(const l of lights)l.life-=real;lights=lights.filter(l=>l.life>0);
  if(comboT>0){comboT-=real;if(comboT<=0)combo=0}
  if(toastT>0){toastT-=real;if(toastT<=0)$('toast').style.display='none'}
  if(bannerT>0){bannerT-=real;if(bannerT<=0)$('banner').style.opacity=0}
  render();updateUI();requestAnimationFrame(frame)}
function step(dt){time+=dt;for(const c of chimneys){const below=grid[(c.r+1)*COLS+c.gx];if(below&&below.st&&Math.random()<dt*5)addP('smoke',c.x+R(-3,3),c.y,R(5,20),R(-40,-25),R(2.5,4),R(6,10))}stepProjs(dt);stepEffects(dt);stepLaser(dt);stepLoose(dt);stepFire(dt);stepParts(dt);
  if(supportDirty){supportDirty=false;support(false)}if(Math.random()<.1||!completed)checkProgress();
  if(bricks.length>bonded*3+500&&Math.random()<.01)bricks=bricks.filter(b=>b.alive&&b.st)}
buildMenu();loadLevel(Math.min(save.max-1,LEVELS.length-1));requestAnimationFrame(frame);
window.__game={get level(){return level},get pct(){return pct()},loadLevel,fire:(i,x,y)=>fire(WEAPONS[i],x,y),get loose(){return loose.length},get parts(){return parts.length},LEVELS,save};
</script>
