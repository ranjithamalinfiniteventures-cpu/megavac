<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Castle Busters</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8ec9f0;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #0006}
  #top{display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 16px 0;font-weight:800;font-size:20px}
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0007;pointer-events:auto;text-align:center;padding:24px}
  #msg h1{margin:0;font-size:44px;letter-spacing:1px}
  #msg p{margin:0;font-size:18px;opacity:.9}
  button{font:inherit;font-weight:800;font-size:22px;padding:12px 36px;border:0;border-radius:14px;background:#ffb703;color:#3a2200;box-shadow:0 5px 0 #b87a00}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #b87a00}
  .hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="top"><span id="lvl">Level 1</span><span id="ammo"></span><span id="foes"></span></div>
  <div id="msg"><h1>🏰 Castle Busters</h1><p>Drag back and release to fire.<br>Knock every enemy out of the castle!</p><button id="go">Play</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ec9f0);
scene.fog=new THREE.Fog(0x8ec9f0,40,90);
const cam=new THREE.PerspectiveCamera(55,1,0.1,200);
const CAM_HOME=new THREE.Vector3(0,5,16), LOOK=new THREE.Vector3(0,3,-8);
cam.position.copy(CAM_HOME);cam.lookAt(LOOK);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a8f4a,0.8));
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(10,20,10);sun.castShadow=true;
sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;
scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0x6bbf59}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const world=new CANNON.World();
world.gravity.set(0,-18,0);
world.solver.iterations=12;
world.allowSleep=true;
const gb=new CANNON.Body({mass:0});gb.addShape(new CANNON.Plane());
gb.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);world.addBody(gb);
world.defaultContactMaterial.friction=0.5;
world.defaultContactMaterial.restitution=0.1;

const CANNON_POS=new THREE.Vector3(0,1,11);
const base=new THREE.Mesh(new THREE.CylinderGeometry(0.8,1,0.6,16),new THREE.MeshLambertMaterial({color:0x555555}));
base.position.set(0,0.3,11);scene.add(base);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,1.8,16),new THREE.MeshLambertMaterial({color:0x2b2b2b}));
barrel.castShadow=true;scene.add(barrel);
barrel.position.copy(CANNON_POS);

const things=[]; // {mesh,body,kind}
const stoneMats=[0xb9b2a5,0xa39c8f,0xcfc8ba].map(c=>new THREE.MeshLambertMaterial({color:c}));
const woodMat=new THREE.MeshLambertMaterial({color:0x9a6a3a});
const foeMat=new THREE.MeshLambertMaterial({color:0x4caf50});
const ballMat=new THREE.MeshLambertMaterial({color:0x222222});
let foes=[],ball=null;

function addBox(x,y,z,w,h,d,mass,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.castShadow=m.receiveShadow=true;m.position.set(x,y,z);scene.add(m);
  const b=new CANNON.Body({mass,sleepSpeedLimit:0.3,sleepTimeLimit:0.5});
  b.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));b.position.set(x,y,z);
  world.addBody(b);things.push({mesh:m,body:b});return b;
}
function addFoe(x,y,z){
  const m=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.45,16,12),foeMat);body.castShadow=true;m.add(body);
  const eyeM=new THREE.MeshBasicMaterial({color:0xffffff}),pupM=new THREE.MeshBasicMaterial({color:0});
  for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),eyeM);e.position.set(0.17*s,0.1,0.38);m.add(e);
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),pupM);p.position.set(0.17*s,0.1,0.48);m.add(p);}
  m.position.set(x,y,z);scene.add(m);
  const b=new CANNON.Body({mass:0.5,sleepSpeedLimit:0.3,sleepTimeLimit:0.5});
  b.addShape(new CANNON.Sphere(0.45));b.position.set(x,y,z);b.linearDamping=0.1;
  b.addEventListener('collide',e=>{if(Math.abs(e.contact.getImpactVelocityAlongNormal())>6)t.dead=true;});
  world.addBody(b);
  const t={mesh:m,body:b,dead:false};things.push(t);foes.push(t);
}
function clearAll(){
  for(const t of things){scene.remove(t.mesh);world.removeBody(t.body);}
  things.length=0;foes=[];ball=null;
}
function buildTower(cx,cz,floors,wide){
  const pw=0.5,ph=1.5,sw=wide?3:2.2,sd=wide?2:1.4,sh=0.4;
  let y=0;
  for(let f=0;f<floors;f++){
    const mat=f%2?woodMat:stoneMats[f%3];
    const dx=sw/2-pw/2,dz=sd/2-pw/2;
    for(const sx of[-1,1])for(const sz of[-1,1])addBox(cx+sx*dx,y+ph/2,cz+sz*dz,pw,ph,pw,1,mat);
    y+=ph;
    addBox(cx,y+sh/2,cz,sw,sh,sd,2,stoneMats[(f+1)%3]);
    y+=sh;
    if(f<floors-1&&f%2===0)addFoe(cx,y+0.45,cz);
  }
  addFoe(cx,y+0.45,cz);
}
let level=1,ammo=0,state='menu',settleT=0,winT=0;
try{level=Math.max(1,+localStorage.getItem('cb.level')||1);}catch(e){}
function loadLevel(n){
  clearAll();
  const towers=Math.min(1+Math.floor((n+1)/2),5);
  const spread=Math.min(5.5,16/towers);
  for(let i=0;i<towers;i++){
    const x=(i-(towers-1)/2)*spread;
    const z=-8-((i*7+n)%3)*2;
    buildTower(x,z,2+((i+n)%3)+(n>4?1:0),towers<3);
  }
  ammo=3+Math.min(3,Math.floor(n/2))+(towers>3?1:0);
  state='aim';settleT=0;winT=0;hud();
}
function hud(){
  $('lvl').textContent='Level '+level;
  $('ammo').textContent='💣 '+ammo;
  $('foes').textContent='👾 '+foes.filter(f=>!f.dead).length;
}
function banner(h,p,btn){
  $('msg').innerHTML='<h1>'+h+'</h1><p>'+p+'</p><button id="go">'+btn+'</button>';
  $('msg').classList.remove('hide');$('go').onclick=start;
}
function start(){$('msg').classList.add('hide');if(state==='won')level++;try{localStorage.setItem('cb.level',level);}catch(e){}loadLevel(level);}
$('go').onclick=start;

// aiming
let drag=null,aim={yaw:0,pitch:0.6,power:0};
const MAXPULL=140,MAXV=30;
function aimFrom(dx,dy){
  const len=Math.min(Math.hypot(dx,dy),MAXPULL);
  aim.power=len/MAXPULL;
  aim.yaw=THREE.MathUtils.clamp(-dx/MAXPULL*0.9,-0.9,0.9);
  aim.pitch=THREE.MathUtils.clamp(0.25+dy/MAXPULL*0.9,0.1,1.25);
}
function velocity(){
  const s=MAXV*(0.35+0.65*aim.power),cp=Math.cos(aim.pitch);
  return new THREE.Vector3(Math.sin(aim.yaw)*cp*s,Math.sin(aim.pitch)*s,-Math.cos(aim.yaw)*cp*s);
}
const dots=[];
for(let i=0;i<24;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.8}));d.visible=false;scene.add(d);dots.push(d);}
function showDots(on){
  if(!on){dots.forEach(d=>d.visible=false);return;}
  const v=velocity(),p=CANNON_POS.clone().add(v.clone().normalize().multiplyScalar(1.2)),g=-18;
  dots.forEach((d,i)=>{const t=i*0.07;d.position.set(p.x+v.x*t,p.y+v.y*t+0.5*g*t*t,p.z+v.z*t);d.visible=d.position.y>0;});
}
canvas.addEventListener('pointerdown',e=>{if(state!=='aim'||ammo<1)return;drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);aimFrom(0,0);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;aimFrom(e.clientX-drag.x,e.clientY-drag.y);showDots(aim.power>0.08);});
function release(){
  if(!drag)return;drag=null;showDots(false);
  if(aim.power<0.08||state!=='aim')return;
  const v=velocity();
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.4,16,12),ballMat);m.castShadow=true;scene.add(m);
  const b=new CANNON.Body({mass:4});b.addShape(new CANNON.Sphere(0.4));
  b.position.set(CANNON_POS.x+v.x*0.04,CANNON_POS.y+v.y*0.04,CANNON_POS.z+v.z*0.04);
  b.velocity.set(v.x,v.y,v.z);b.linearDamping=0.01;world.addBody(b);
  const t={mesh:m,body:b,age:0,isBall:true};things.push(t);ball=t;
  ammo--;state='fly';settleT=0;hud();
}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',()=>{drag=null;showDots(false);});

function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
  cam.fov=w/h<0.8?70:55;cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  world.step(1/60,dt,3);
  for(const t of things){t.mesh.position.copy(t.body.position);t.mesh.quaternion.copy(t.body.quaternion);}
  // barrel follows aim
  const a=drag?aim:{yaw:0,pitch:0.6};
  barrel.rotation.order='YXZ';barrel.rotation.set(-(Math.PI/2-a.pitch),-a.yaw,0);
  if(state==='fly'||state==='aim'){
    for(const f of foes)if(!f.dead&&(f.body.position.y<0.65||Math.abs(f.body.position.x)>30))f.dead=true;
    for(const f of foes)if(f.dead&&f.mesh.visible){f.mesh.visible=false;f.body.sleep();world.removeBody(f.body);}
    const left=foes.filter(f=>!f.dead).length;
    if($('foes').textContent!=='👾 '+left)hud();
    if(left===0&&state!=='win'){state='win';winT=0;}
  }
  if(state==='fly'&&ball){
    ball.age+=dt;
    const b=ball.body,still=b.velocity.length()<0.6;
    if(b.position.y<-5||b.position.z<-40||ball.age>7||(still&&ball.age>1))settleT+=dt;
    if(settleT>0.6){
      scene.remove(ball.mesh);world.removeBody(ball.body);things.splice(things.indexOf(ball),1);ball=null;
      if(ammo>0){state='aim';}else{state='settle';settleT=0;}
    }
    // camera chases ball a little
    if(ball){const z=Math.max(ball.body.position.z,-14);cam.position.z+=(Math.min(CAM_HOME.z,z+14)-cam.position.z)*0.05;}
  }else{cam.position.z+=(CAM_HOME.z-cam.position.z)*0.08;}
  if(state==='settle'){
    settleT+=dt;
    if(settleT>2.5){
      const left=foes.filter(f=>!f.dead).length;
      if(left===0){state='win';winT=0;}else{state='lose';banner('Castle holds!',left+' enemies left standing.','Retry');}
    }
  }
  if(state==='win'){
    winT+=dt;
    if(winT>1.2){
      state='won';
      const stars=ammo>=2?'⭐⭐⭐':ammo>=1?'⭐⭐':'⭐';
      banner('Castle busted!',stars+'<br>'+ammo+' shots to spare','Next level');
    }
  }
  cam.lookAt(cam.position.x,LOOK.y,cam.position.z-24);
  renderer.render(scene,cam);
}
loadLevel(level);state='menu';
requestAnimationFrame(frame);
window.__cb={get state(){return state},get foes(){return foes.filter(f=>!f.dead).length},get ammo(){return ammo}};
})();
</script>
</body>
</html>
