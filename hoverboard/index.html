<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hoverline</title>
<style>
  /* Barlow + Barlow Condensed (SIL Open Font License), bundled so the game needs no font CDN */
  @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 600; font-display: swap; src: url(assets/fonts/Barlow-600.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 700; font-display: swap; src: url(assets/fonts/Barlow-700.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: italic; font-weight: 800; font-display: swap; src: url(assets/fonts/BarlowCondensed-800i.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: italic; font-weight: 900; font-display: swap; src: url(assets/fonts/BarlowCondensed-900i.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 700; font-display: swap; src: url(assets/fonts/BarlowCondensed-700.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 800; font-display: swap; src: url(assets/fonts/BarlowCondensed-800.woff2) format('woff2'); }
  :root {
    --accent: #ff7a2f; --accent2: #ffb03a; --gold: #ffc53d; --silver: #d9dee6; --bronze: #d98a4e;
    --ink: #f7f5f0; --ink2: rgba(247,245,240,.72); --ink3: rgba(247,245,240,.5);
    --glass: rgba(16,18,28,.58); --glass2: rgba(16,18,28,.78); --line: rgba(255,255,255,.12);
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --text: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1624; color: var(--ink); font-family: var(--text); touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(10,8,20,.28); }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }

  /* ---------- buttons ---------- */
  .btn { pointer-events: auto; cursor: pointer; border: 0; border-radius: 14px; padding: 15px 28px; font-family: var(--display); font-weight: 900; font-style: italic;
    font-size: 24px; letter-spacing: .5px; color: #2b1405; background: linear-gradient(180deg, #ffc073 0%, var(--accent) 100%);
    box-shadow: 0 6px 0 #b8481a, 0 12px 26px rgba(255,110,40,.28); transition: transform .1s, box-shadow .1s, filter .15s; text-transform: uppercase; }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8481a, 0 6px 14px rgba(255,110,40,.25); }
  .btn.ghost { color: var(--ink); background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 2px rgba(255,255,255,.28); font-size: 20px; }
  .btn.ghost:active { transform: translateY(2px); }
  .btn:focus-visible, .tcard:focus-visible, .race:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  kbd { display: inline-block; min-width: 22px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-bottom-width: 2px; font: 700 11px var(--text); text-align: center; color: var(--ink); }

  /* ---------- menu ---------- */
  #menu { position: fixed; inset: 0; pointer-events: none; }
  .sheet { pointer-events: auto; position: absolute; top: calc(16px + var(--sat)); bottom: calc(16px + var(--sab)); left: calc(16px + var(--sal)); width: min(440px, 44vw);
    border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; }
  .sheet-scroll { flex: 1; overflow-y: auto; padding: 22px 22px 8px; scrollbar-width: thin; touch-action: pan-y; }
  .logo { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 60px; line-height: .85; letter-spacing: -1px; color: #fff;
    text-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .logo span { color: var(--accent2); }
  .tagline { white-space: nowrap; display: flex; align-items: center; gap: 10px; margin-top: 8px; font-family: var(--display); font-weight: 700; letter-spacing: 3px; font-size: 14px; color: var(--ink2); }
  .tagline::before { content: ""; width: 34px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .label { gap: 12px; margin: 18px 2px 9px; font-family: var(--display); font-weight: 800; letter-spacing: 2.5px; font-size: 13px; color: var(--ink3); display: flex; justify-content: space-between; }
  #tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tcard { position: relative; cursor: pointer; border: 0; border-radius: 16px; overflow: hidden; aspect-ratio: 2.3 / 1; text-align: left; background: #333 center / cover no-repeat;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); transition: transform .12s, box-shadow .12s; }
  .tcard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,20,0) 30%, rgba(10,10,20,.78) 100%); }
  .tcard:hover { transform: translateY(-2px); }
  .tcard.on { box-shadow: inset 0 0 0 3px #fff, 0 8px 22px rgba(0,0,0,.3); }
  .tcard .tt { position: absolute; left: 12px; right: 10px; bottom: 9px; z-index: 1; }
  .tcard b { display: block; font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .tcard small { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.82); }
  .tcard .medals { position: absolute; top: 8px; right: 8px; z-index: 1; display: flex; gap: 3px; }
  .medal { width: 12px; height: 12px; border-radius: 50%; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
  .medal.g { background: var(--gold); } .medal.s { background: var(--silver); } .medal.b { background: var(--bronze); }
  .tcard.lockd { filter: saturate(.35) brightness(.8); }
  #levels { display: flex; flex-direction: column; gap: 8px; }
  .race { position: relative; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; cursor: pointer; border: 0; text-align: left;
    padding: 9px 14px 9px 10px; border-radius: 14px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: background .12s, transform .1s; }
  .race:hover:not(.locked) { background: rgba(255,255,255,.13); }
  .race.on { background: #fff; color: #1d1a26; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  .race .rn { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 22px;
    background: rgba(255,255,255,.1); }
  .race.on .rn { background: linear-gradient(180deg, #ffc073, var(--accent)); color: #2b1405; }
  .race b { display: block; font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.05; }
  .race .meta { display: flex; gap: 10px; align-items: center; margin-top: 3px; font-size: 12px; font-weight: 600; color: var(--ink2); }
  .race.on .meta { color: rgba(29,26,38,.65); }
  .pips { display: inline-flex; gap: 3px; } .pips i { width: 6px; height: 10px; border-radius: 2px; background: currentColor; opacity: .25; transform: skewX(-14deg); } .pips i.on { opacity: 1; background: var(--accent); }
  .race .best { font-family: var(--display); font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .race.locked { cursor: default; opacity: .55; }
  .race.locked .best { font-family: var(--text); font-size: 11px; font-weight: 600; color: var(--ink2); max-width: 118px; white-space: normal; text-align: right; line-height: 1.2; }
  .lock { width: 14px; height: 14px; flex: none; }
  .sheet-foot { padding: 14px 22px calc(18px + 0px); border-top: 1px solid var(--line); background: rgba(16,18,28,.35); }
  .sheet-foot .btnrow { flex-wrap: nowrap; }
  #play { flex: 1; font-size: 28px; padding: 10px 18px 11px; line-height: 1; white-space: nowrap; }
  #play small { display: block; margin-top: 3px; font-size: 14px; font-style: normal; font-weight: 800; letter-spacing: 1px; opacity: .72; overflow: hidden; text-overflow: ellipsis; }
  #free { flex: none; }
  .help { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; font-weight: 600; color: var(--ink2); justify-content: center; }
  .help span { display: inline-flex; gap: 5px; align-items: center; }
  .bestchip { position: absolute; right: calc(18px + var(--sar)); bottom: calc(18px + var(--sab)); pointer-events: none; padding: 9px 14px; border-radius: 12px;
    font-family: var(--display); font-weight: 800; letter-spacing: 1.5px; font-size: 13px; color: var(--ink2); }
  .bestchip b { color: #fff; font-size: 18px; margin-left: 6px; letter-spacing: 0; }
  @media (max-width: 760px) {
    .sheet { top: auto; left: calc(8px + var(--sal)); right: calc(8px + var(--sar)); bottom: calc(8px + var(--sab)); width: auto; max-height: 72%; border-radius: 22px; }
    .sheet-scroll { padding: 16px 16px 6px; }
    .logo { font-size: 42px; } .tagline { font-size: 11px; letter-spacing: 2px; margin-top: 5px; }
    #trackblurb { display: none; }
    .tcard { aspect-ratio: 16 / 9; }
    .label { margin: 14px 2px 8px; }
    #tracks { display: flex; overflow-x: auto; gap: 8px; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x mandatory; touch-action: pan-x; scrollbar-width: none; }
    .tcard { flex: 0 0 150px; scroll-snap-align: start; }
    .tcard b { font-size: 16px; }
    .race { padding: 9px 12px 9px 9px; } .race b { font-size: 18px; }
    .sheet-foot { padding: 12px 16px 14px; }
    #play { font-size: 22px; padding: 14px 16px; } #free { font-size: 17px; padding: 14px 16px; }
    .help .desk { display: none; }
    .bestchip { top: calc(12px + var(--sat)); bottom: auto; right: calc(12px + var(--sar)); }
  }
  @media (min-width: 761px) { .help .mob { display: none; } }
  @media (max-height: 560px) and (min-width: 761px) { .logo { font-size: 44px; } .label { margin: 12px 2px 8px; } .race { padding: 7px 12px 7px 8px; } .race .rn { width: 34px; height: 34px; } }

  /* ---------- HUD ---------- */
  #hud { font-family: var(--display); }
  .hbox { position: absolute; border-radius: 16px; padding: 10px 16px 10px 14px; }
  #posbox { top: calc(14px + var(--sat)); left: calc(14px + var(--sal)); display: flex; align-items: center; gap: 14px; padding: 8px 18px 8px 10px; }
  #posbox::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--accent2), var(--accent)); }
  #pos { font-weight: 900; font-style: italic; line-height: .85; display: flex; align-items: flex-start; padding-left: 6px; }
  #pos b { font-size: 62px; } #pos .suf { font-size: 22px; margin-top: 4px; } #pos small { font-size: 22px; color: var(--ink3); margin-top: 32px; margin-left: 2px; }
  .ptime { display: flex; flex-direction: column; gap: 2px; }
  .ptime .k { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--ink3); }
  #rtime { font-size: 26px; font-weight: 800; line-height: 1; }
  #draft { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--accent2); opacity: 0; transition: opacity .2s; }
  #draft.on { opacity: 1; }
  #scorebox { top: calc(14px + var(--sat)); right: calc(14px + var(--sar)); text-align: right; min-width: 150px; }
  #score { font-size: 34px; font-weight: 900; font-style: italic; line-height: 1; }
  #mult { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 8px; font-size: 16px; font-weight: 900; font-style: italic; vertical-align: 6px;
    color: #2b1405; background: var(--accent2); }
  #mult.hot { background: var(--accent); animation: pulse .45s infinite alternate; }
  .srow { margin-top: 5px; display: flex; justify-content: flex-end; gap: 12px; font-size: 15px; font-weight: 700; color: var(--ink2); }
  .srow b { color: var(--gold); }
  #prog { position: absolute; top: calc(26px + var(--sat)); left: 50%; transform: translateX(-50%); width: min(380px, 34vw); height: 8px; border-radius: 5px; background: rgba(20,18,30,.45);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  #progfill { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--accent2), #fff); }
  #prog .dot { position: absolute; top: -5px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.9); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  #prog .you { position: absolute; top: -9px; width: 6px; height: 26px; margin-left: -3px; border-radius: 3px; background: #fff; box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,.35); }
  #prog .flag { position: absolute; right: -24px; top: -7px; width: 18px; height: 22px; }
  #hud:not(.racing) #posbox, #hud:not(.racing) #prog { display: none; }
  #gauge { position: absolute; right: calc(12px + var(--sar)); bottom: calc(10px + var(--sab)); width: 176px; height: 176px; }
  #gauge svg { width: 100%; height: 100%; overflow: visible; }
  #gauge .gbg { fill: rgba(16,18,28,.5); }
  #gauge .track { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 10; stroke-linecap: round; }
  #flowfill { fill: none; stroke: url(#fgrad); stroke-width: 10; stroke-linecap: round; transition: stroke .2s; }
  #gauge.full #flowfill { stroke: #fff; animation: flash .35s infinite alternate; }
  #spdtick { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 3; stroke-linecap: round; }
  .gtext { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 6px; }
  #speed { font-size: 58px; font-weight: 900; font-style: italic; line-height: .85; }
  .unit { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; color: var(--ink2); }
  .flowlbl { margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--accent2); }
  #boostcue { position: absolute; right: calc(200px + var(--sar)); bottom: calc(80px + var(--sab)); padding: 8px 14px; border-radius: 12px; font-size: 17px; font-weight: 900; font-style: italic;
    color: #2b1405; background: linear-gradient(180deg, #fff1c9, var(--accent2)); box-shadow: 0 6px 18px rgba(255,160,40,.35); opacity: 0; transform: translateX(10px); transition: opacity .2s, transform .2s; }
  #boostcue.on { opacity: 1; transform: none; }
  #pops { position: absolute; top: 28%; left: 50%; transform: translateX(-50%); text-align: center; }
  .pop { font-size: 32px; font-weight: 900; font-style: italic; letter-spacing: .5px; animation: pop 1.1s ease-out forwards; text-shadow: 0 3px 14px rgba(0,0,0,.45); white-space: nowrap; }
  .pop.big { font-size: 48px; color: var(--accent2); }
  .pop.near { color: var(--gold); }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0 } 15% { transform: scale(1.12); opacity: 1 } 70% { opacity: 1 } 100% { transform: translateY(-40px); opacity: 0 } }
  @keyframes pulse { to { transform: scale(1.12) } }
  @keyframes flash { to { opacity: .55 } }
  @media (max-width: 760px) {
    #pos b { font-size: 44px; } #pos .suf, #pos small { font-size: 17px; } #pos small { margin-top: 22px; }
    #rtime { font-size: 20px; } #posbox { gap: 10px; padding: 6px 12px 6px 8px; }
    #score { font-size: 26px; } #scorebox { min-width: 0; padding: 8px 12px; } .srow { font-size: 13px; }
    #prog { top: auto; bottom: calc(26px + var(--sab)); left: calc(20px + var(--sal)); transform: none; width: calc(100% - 190px); }
    #gauge { width: 136px; height: 136px; } #speed { font-size: 44px; } .flowlbl { display: none; }
    #boostcue { right: auto; left: 50%; transform: translateX(-50%); bottom: auto; top: 22%; }
    #boostcue.on { transform: translateX(-50%); }
  }

  /* ---------- countdown ---------- */
  #count { position: fixed; top: 40%; left: 50%; width: 180px; height: 180px; margin: -90px 0 0 -90px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--display); font-size: 120px; font-weight: 900; font-style: italic; color: #fff; background: rgba(16,18,28,.45); box-shadow: inset 0 0 0 6px rgba(255,255,255,.85);
    opacity: 0; transform: scale(.6); pointer-events: none; transition: transform .25s, opacity .25s; }
  #count.show { opacity: 1; transform: scale(1); }
  #count.go { width: 260px; margin-left: -130px; border-radius: 90px; color: #2b1405; background: linear-gradient(180deg, #ffc073, var(--accent)); box-shadow: 0 10px 30px rgba(255,110,40,.35); font-size: 100px; }

  /* ---------- results / game over ---------- */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: auto; padding: calc(12px + var(--sat)) 12px calc(12px + var(--sab));
    background: radial-gradient(ellipse at center, rgba(16,12,28,.15), rgba(16,12,28,.55)); }
  .card { width: min(460px, 100%); max-height: 100%; overflow-y: auto; border-radius: 26px; padding: 24px 22px 22px; text-align: center; background: var(--glass2); }
  .kicker { font-family: var(--display); font-weight: 800; letter-spacing: 3px; font-size: 15px; color: var(--ink2); }
  #resplace { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 104px; line-height: .9; margin-top: 2px; }
  #resplace.p1 { color: var(--gold); } #resplace.p2 { color: var(--silver); } #resplace.p3 { color: var(--bronze); }
  #restitle.p1 { color: var(--gold); }
  #restable { margin-top: 14px; display: flex; flex-direction: column; gap: 5px; }
  .rrow { display: grid; grid-template-columns: 26px 12px 1fr auto auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 11px; background: rgba(255,255,255,.06);
    font-size: 15px; font-weight: 600; text-align: left; }
  .rrow.you { background: #fff; color: #1d1a26; font-weight: 700; }
  .rp { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 19px; } .rc { width: 12px; height: 12px; border-radius: 50%; }
  .rt { font-weight: 700; } .rg { font-size: 12px; color: var(--ink3); min-width: 44px; text-align: right; } .rrow.you .rg { color: rgba(29,26,38,.55); }
  #resnote { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--ink2); }
  #resnote.unlock { color: var(--accent2); font-weight: 700; }
  .card .btnrow { margin-top: 18px; flex-wrap: nowrap; }
  .card .btnrow .btn { flex: 1; padding: 14px 10px; font-size: 20px; }
  #final { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 92px; line-height: .95; }
  #newbest { display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 10px; font-family: var(--display); font-weight: 900; letter-spacing: 2px; font-size: 16px;
    color: #2b1405; background: var(--gold); animation: pulse .5s infinite alternate; }
  .stats { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 12px; border-radius: 14px; background: rgba(255,255,255,.07); font-family: var(--display); font-weight: 800; letter-spacing: 2px; font-size: 12px; color: var(--ink3); }
  .stat b { display: block; margin-top: 2px; font-size: 30px; letter-spacing: 0; color: #fff; }
  #revive { width: 100%; margin-top: 10px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 44px; color: #fff;
    background: radial-gradient(ellipse at center, #3a2b48, #1a1624); }
  #loading small { display: block; margin-top: 6px; font-size: 13px; letter-spacing: 5px; font-style: normal; color: var(--ink3); text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="layer hidden">
  <div id="posbox" class="hbox glass"><div id="pos" class="num"></div><div class="ptime"><span class="k">TIME</span><span id="rtime" class="num">0:00.0</span><span id="draft">DRAFTING</span></div></div>
  <div id="prog"><div id="progfill"></div><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="you"></i>
    <svg class="flag" viewBox="0 0 18 22"><path d="M2 1v20" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M3 2h13v9H3z" fill="#fff"/><path d="M3 2h4v3H3zM11 2h4v3h-4zM7 5h4v3H7zM3 8h4v3H3zM11 8h4v3h-4z" fill="#1d1a26"/></svg></div>
  <div id="scorebox" class="hbox glass"><div><span id="score" class="num">0</span><span id="mult">x1</span></div>
    <div class="srow num"><span id="dist">0 m</span><span>◆ <b id="shards">0</b></span></div></div>
  <div id="pops"></div>
  <div id="boostcue">RELEASE TO BOOST!</div>
  <div id="gauge"><svg viewBox="0 0 176 176">
      <defs><linearGradient id="fgrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff7a2f"/><stop offset="1" stop-color="#ffd36b"/></linearGradient></defs>
      <circle class="gbg" cx="88" cy="88" r="80"/>
      <path class="track" d="M 34.3 141.7 A 76 76 0 1 1 141.7 141.7" transform="translate(0,0)" pathLength="100"/>
      <path id="flowfill" d="M 34.3 141.7 A 76 76 0 1 1 141.7 141.7" pathLength="100" stroke-dasharray="0 100"/>
      <path id="spdtick" d="M 46 130 A 60 60 0 1 1 130 130" pathLength="100" stroke-dasharray="0 100"/>
    </svg>
    <div class="gtext"><div id="speed" class="num">0</div><div class="unit">KM/H</div><div class="flowlbl" id="flowlbl">FLOW</div></div></div>
</div>

<div id="count"></div>

<div id="loading">HOVERLINE<small>LOADING</small></div>

<div id="results" class="modal hidden">
  <div class="card glass">
    <div class="kicker" id="restitle">FINISHED</div>
    <div id="resplace">1st</div>
    <div id="restable"></div>
    <div id="resnote"></div>
    <div class="btnrow"><button id="resnext" class="btn hidden">Next race</button><button id="resagain" class="btn ghost">Retry</button><button id="resmenu" class="btn ghost">Menu</button></div>
  </div>
</div>

<div id="menu" class="hidden">
  <div class="sheet glass">
    <div class="sheet-scroll">
      <div class="logo">HOVER<span>LINE</span></div>
      <div class="tagline">DOWNHILL HOVERBOARD RACING</div>
      <div class="label"><span>TRACK</span><span id="trackprog"></span></div>
      <div id="tracks"></div>
      <div class="label"><span>RACES</span><span id="trackblurb"></span></div>
      <div id="levels"></div>
    </div>
    <div class="sheet-foot">
      <div class="btnrow"><button id="play" class="btn">Race</button><button id="free" class="btn ghost">Free ride</button></div>
      <div class="help">
        <span class="desk"><kbd>A</kbd><kbd>D</kbd> or mouse: carve</span><span class="desk"><kbd>Space</kbd> hold: slide, release: boost</span>
        <span class="mob">Hold left / right: carve</span><span class="mob">Hold both: slide, let go: boost</span>
      </div>
    </div>
  </div>
  <div class="bestchip glass">FREE RIDE BEST<b id="best" class="num">0</b></div>
</div>

<div id="over" class="modal hidden">
  <div class="card glass">
    <div class="kicker">WIPEOUT</div>
    <div id="final" class="num">0</div>
    <div id="newbest" class="hidden">NEW BEST</div>
    <div class="stats"><div class="stat">BEST<b id="finalbest" class="num">0</b></div><div class="stat">SHARDS<b id="finalshards" class="num">0</b></div></div>
    <div class="btnrow"><button id="again" class="btn">Ride again</button><button id="overmenu" class="btn ghost">Menu</button></div>
    <button id="revive" class="btn ghost hidden">▶ Revive (ad)</button>
  </div>
</div>

<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" onerror="this.remove()"></script>
<script type="module" src="dist/game.js"></script>
</body>
</html>
