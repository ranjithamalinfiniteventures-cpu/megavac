<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>MEGAVAC · A little mess. A lot of satisfaction.</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#C2B18E; --panel:#16191C; --line:#262A2F; --ink:#E7E4DD; --mut:#7E838A;
  --acc:#FF6A3A; --steel:#6FAECC;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#stage{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
@media (pointer:fine){canvas{cursor:none}}
#panel{position:absolute;top:0;right:0;height:100%;width:min(290px,88vw);
  background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;
  padding:14px 14px 30px;transform:translateX(101%);transition:transform .22s ease;z-index:3}
#panel.open{transform:none}
#tune{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2;width:auto;margin:0;padding:7px 13px;
  background:rgba(22,25,28,.8);color:var(--mut);border:1px solid var(--line);border-radius:2px;
  font-size:10px;letter-spacing:.16em}
#tune:hover{color:var(--acc)}
#close{position:absolute;top:8px;right:10px;width:auto;margin:0;padding:4px 10px;
  font-size:15px;border:none;color:var(--mut);letter-spacing:0}
#adv[hidden]{display:none}
#pauseBtn{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2;
  width:38px;height:38px;margin:0;padding:0;border-radius:50%;
  background:rgba(26,20,12,.55);border:1px solid rgba(255,240,210,.28);
  display:flex;align-items:center;justify-content:center;gap:4px}
#pauseBtn:hover{background:rgba(52,38,18,.8);border-color:#F0B429}
#pauseBtn i{display:block;width:3.5px;height:13px;border-radius:1px;background:#F2E7CE}
#pauseBtn[hidden]{display:none}
#sndBtn{position:absolute;top:calc(14px + env(safe-area-inset-top));right:60px;z-index:2;
  width:38px;height:38px;margin:0;padding:0;border-radius:50%;
  background:rgba(26,20,12,.55);border:1px solid rgba(255,240,210,.28);
  display:flex;align-items:center;justify-content:center;color:#F2E7CE}
#sndBtn:hover{background:rgba(52,38,18,.8);border-color:#F0B429}
#sndBtn svg{width:19px;height:19px}
#sndBtn.off{color:#B4655A;border-color:rgba(180,101,90,.5)}
#sndBtn[hidden]{display:none}
#over{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(14,11,7,.62);backdrop-filter:blur(3px);
  padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
#over[hidden]{display:none}
#card{background:rgba(20,16,10,.95);border:1px solid rgba(255,236,200,.16);border-radius:5px;
  padding:30px 34px 26px;text-align:center;max-width:400px;width:100%;
  max-height:92vh;overflow-y:auto}
#card h1{margin:0;font-size:clamp(34px,8vw,52px);font-weight:700;letter-spacing:-.02em;color:#F4E9D0}
#card .sub{margin:8px 0 0;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#8B8474}
#card .btns{display:flex;flex-direction:column;gap:8px;margin:22px 0 0}
#card .btns button{padding:13px;font-size:12px;letter-spacing:.15em;border-radius:3px;
  border-color:rgba(255,236,200,.2);color:#CFC7B4}
#card .btns button.pri{border-color:#C9531F;color:#FFD4B6;background:rgba(84,34,10,.6);
  font-weight:700;padding:16px}
#card .btns button.pri:hover{background:rgba(126,50,14,.75);border-color:#FF8A4A;color:#FFE6D2}
#card .btns button.sec:hover{border-color:#7FB0C9;color:#BEE2F2}
#card .btns button.ter{border-color:transparent;color:#8B8474;padding:10px;font-size:11px}
#card .btns button.card{padding:15px 14px;text-align:left;line-height:1.35;letter-spacing:.02em;
  border-color:rgba(255,236,200,.22);text-transform:none;font-size:14px;color:#F0E8D4}
#card .btns button.card:hover{border-color:#F0B429;background:rgba(70,52,14,.5)}
#card .btns button.card em{display:block;font-size:11.5px;color:#A79E88;
  margin-top:4px;font-style:normal;letter-spacing:.03em}
#card .btns button.ter:hover{color:#F0B429;border-color:rgba(240,180,41,.35)}
#card .recs{margin:20px 0 0;padding-top:15px;border-top:1px solid rgba(255,236,200,.12);
  display:flex;justify-content:space-around;gap:10px}
#card .recs div{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6F6959;flex:1}
#card .recs b{display:block;font-size:15px;letter-spacing:0;color:#E8D9B0;margin-top:5px;
  font-variant-numeric:tabular-nums;text-transform:none}
#strip{display:flex;justify-content:center;gap:7px;margin:18px 0 0}
#strip div{text-align:center;font-size:8px;letter-spacing:.08em;color:#6F6959}
#strip i{display:block;width:20px;height:20px;border-radius:3px;margin-bottom:5px;
  background:rgba(255,236,200,.09);border:1px solid transparent;font-style:normal;
  font-size:8.5px;line-height:20px;color:#0E0B07}
#strip i.on{background:#F0B429;border-color:#F0B429;font-weight:700}
#strip i.today{border-color:#FF8A4A}
#strip[hidden]{display:none}
#card .coins{margin:14px 0 0;font-size:20px;font-weight:700;color:#F0B429;
  font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:9px}
#card .coins[hidden]{display:none}
#shopBtn{display:flex;align-items:center;gap:11px;width:100%;margin:20px 0 0;
  padding:14px 16px;border-radius:4px;text-transform:none;letter-spacing:.02em;
  background:linear-gradient(180deg,rgba(84,64,22,.8),rgba(52,39,13,.8));
  border:1px solid rgba(240,180,41,.5);color:#F8EAC2;font-size:15px;cursor:pointer}
#shopBtn:hover{border-color:#F0B429;
  background:linear-gradient(180deg,rgba(112,86,28,.9),rgba(72,54,18,.9))}
#shopBtn .cp{width:16px;height:16px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#FBD976,#E8B23A 60%,#B5811C);
  box-shadow:0 0 0 3px rgba(232,178,58,.18)}
#shopBtn .bal{font-weight:700;font-variant-numeric:tabular-nums}
#shopBtn .lbl{margin-left:auto;font-size:11px;letter-spacing:.17em;
  text-transform:uppercase;color:#EBCB84}
#shopBtn .chev{width:7px;height:7px;flex:none;transform:rotate(45deg);
  border-right:2px solid #EBCB84;border-top:2px solid #EBCB84}
#shopBtn[hidden]{display:none}
#rigBtn{display:flex;align-items:center;gap:11px;width:100%;margin:8px 0 0;
  padding:13px 16px;border-radius:4px;text-transform:none;letter-spacing:.02em;
  background:linear-gradient(180deg,rgba(40,52,64,.8),rgba(26,34,42,.8));
  border:1px solid rgba(140,180,205,.4);color:#D8E6F0;font-size:14px;cursor:pointer}
#rigBtn:hover{border-color:#8FC3E0;background:linear-gradient(180deg,rgba(54,70,86,.9),rgba(34,44,54,.9))}
#rigBtn .rn{font-weight:700}
#rigBtn .ri{display:flex;color:#8FC3E0}
#rigBtn .ri svg{width:21px;height:21px}
#rigBtn .lbl{margin-left:auto;font-size:11px;letter-spacing:.17em;
  text-transform:uppercase;color:#93B8CE}
#rigBtn .chev{width:7px;height:7px;flex:none;transform:rotate(45deg);
  border-right:2px solid #93B8CE;border-top:2px solid #93B8CE}
#rigBtn[hidden]{display:none}
#rigStage{position:relative;margin:14px 0 0;border-radius:6px;overflow:hidden;
  background:#F6E7C8;
  background-image:radial-gradient(rgba(160,135,95,.32) 1.3px,transparent 1.4px);
  background-size:17px 17px}
#rigArt{display:block;width:100%;height:auto}
#rigStage button{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;
  margin:0;padding:0;border-radius:50%;font-size:19px;line-height:1;
  background:rgba(28,22,12,.5);border:1px solid rgba(255,240,210,.3);color:#F6EAD0}
#rigStage button:hover{background:rgba(50,38,18,.8);border-color:#F0B429;color:#FFD98A}
#rigPrev{left:9px} #rigNext{right:9px}
#rigName{margin:15px 0 0;font-size:20px;font-weight:700;color:#F4EAD4}
#rigPerk{display:inline-block;margin:7px 0 0;padding:4px 10px;border-radius:99px;
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  background:rgba(240,180,41,.14);border:1px solid rgba(240,180,41,.4);color:#F0C86A}
#rigDesc{margin:10px 0 0;font-size:11.5px;line-height:1.5;color:#9A9280}
#rigStats{margin:15px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.sbar{text-align:left}
.sbar span{display:block;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#7E7768;margin-bottom:4px}
.sbar u{display:block;height:5px;border-radius:3px;background:rgba(255,236,200,.12);
  text-decoration:none;overflow:hidden}
.sbar u i{display:block;height:100%;border-radius:3px;background:#F0B429}
.sbar u i.dn{background:#B4603A}
#rigBuy{margin:17px 0 0;padding:14px;font-size:12px;letter-spacing:.14em;border-radius:4px}
#rigBuy.can{border-color:#FF8A4A;color:#FFE0C6;background:rgba(74,36,14,.5)}
#rigBuy.on{border-color:#63C356;color:#CFF0C6;background:rgba(28,58,24,.5)}
#rigBuy.no{opacity:.45;cursor:default}
#rigDots{display:flex;justify-content:center;gap:6px;margin:14px 0 0;flex-wrap:wrap}
#rigDots i{width:7px;height:7px;border-radius:50%;background:rgba(255,236,200,.18);cursor:pointer}
#rigDots i.sel{background:#F0B429}
#rigDots i.have{background:rgba(99,195,86,.75)}
#rigDots i.sel.have{background:#F0B429;box-shadow:0 0 0 2px rgba(99,195,86,.6)}
.rrow{display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;
  padding:12px 2px;border-bottom:1px solid rgba(255,236,200,.08);align-items:center}
.rrow .swatch{grid-row:1/3;grid-column:1;width:40px;height:40px;border-radius:4px;
  align-self:center;display:flex;align-items:center;justify-content:center}
.rrow .swatch i{display:block;width:0;height:0;border-top:11px solid transparent;
  border-bottom:11px solid transparent;border-left:19px solid #CFD5DC}
.rrow .rn{grid-column:2;grid-row:1;font-size:13.5px;color:#EFE7D3}
.rrow .rd{grid-column:2;grid-row:2;font-size:10px;color:#89826F;line-height:1.4}
.rrow button{grid-column:3;grid-row:1/3;align-self:center;width:auto;margin:0;
  padding:9px 12px;font-size:11px;min-width:84px;text-transform:none;border-radius:3px;
  border-color:rgba(255,236,200,.14);color:#7E7768}
.rrow button.can{border-color:#FF8A4A;color:#FFE0C6;background:rgba(74,36,14,.4)}
.rrow button.on{border-color:#63C356;color:#CFF0C6;background:rgba(28,58,24,.5)}
#oRigs[hidden]{display:none}
#card .coins i{width:11px;height:11px;border-radius:50%;background:#E8B23A;
  box-shadow:0 0 0 3px rgba(232,178,58,.22)}
#uList{margin:14px 0 0;max-height:48vh;overflow-y:auto;text-align:left;
  padding-right:4px;-webkit-overflow-scrolling:touch}
#uList::-webkit-scrollbar{width:5px}
#uList::-webkit-scrollbar-thumb{background:rgba(255,236,200,.16);border-radius:3px}
.urow{display:grid;grid-template-columns:30px 1fr auto;gap:3px 13px;
  padding:11px 2px;border-bottom:1px solid rgba(255,236,200,.08)}
.urow .ic{grid-column:1;grid-row:1/3;align-self:center;color:#E8B23A;
  display:flex;align-items:center;justify-content:center;opacity:.9}
.urow .ic svg{width:23px;height:23px}
.urow.max{opacity:.42}
.urow .un{grid-column:2;grid-row:1;font-size:13px;color:#EFE7D3;
  display:flex;align-items:center;gap:9px;min-width:0}
.urow .ud{grid-column:2;grid-row:2;font-size:10px;letter-spacing:.03em;
  color:#89826F;line-height:1.35}
.pips{display:flex;gap:2px;flex:none}
.pip{width:6px;height:6px;border-radius:1px;background:rgba(255,236,200,.14)}
.pip.on{background:#F0B429}
.urow button{grid-column:3;grid-row:1/3;align-self:center;
  width:auto;margin:0;padding:9px 12px;font-size:11px;min-width:82px;
  text-transform:none;letter-spacing:.02em;border-radius:3px;
  border-color:rgba(255,236,200,.14);color:#7E7768}
.urow button.can{border-color:#FF8A4A;color:#FFE0C6;background:rgba(74,36,14,.4)}
.urow button.can:hover{background:rgba(104,48,16,.8)}
.urow button:not(.can){cursor:default}
#oUpg[hidden],#oRecs[hidden],#oBtns[hidden]{display:none}
.ph{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.row{margin-bottom:13px}
.rl{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.rl b{color:var(--ink);font-weight:500;font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:18px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--acc);margin-top:-5px;border:none}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);border:none}
input[type=range]:focus-visible{outline:2px solid var(--steel);outline-offset:4px}
.grp{margin:20px 0 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);
  padding-top:14px;border-top:1px solid var(--line)}
button{width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);
  font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px;
  margin-bottom:7px;cursor:pointer;border-radius:2px}
button:hover{border-color:var(--acc);color:var(--acc)}
button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-bottom:9px;cursor:pointer}
.chk input{accent-color:var(--acc)}
.keys{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
  font-size:10px;line-height:1.9;color:var(--mut)}
.keys b{color:var(--ink);font-weight:500}
#toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);padding:8px 14px;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* Warm workshop menu, with a clear next job and secondary game modes. */
#over{background:rgba(19,32,33,.65);backdrop-filter:blur(10px)}
#card{max-width:540px;border-radius:24px;padding:24px;background:#f6f1e7;color:#213b3b;
 border:1px solid #fff9;box-shadow:0 28px 90px #10242455;text-align:left}
#card h1{color:#203c3a;font-family:system-ui,sans-serif;font-weight:900;letter-spacing:-.055em;font-size:48px}
#card .sub{color:#657873;letter-spacing:.07em;line-height:1.7}
#card .btns{gap:9px;margin-top:20px}
#card .btns button{border-radius:12px;letter-spacing:.025em;text-transform:none;font:600 14px system-ui,sans-serif;padding:15px;color:#294d48;border:1px solid #c8d5ca;background:#e8ece3}
#card .btns button.pri{background:#246859;color:#fff9e9;border-color:#246859;padding:18px;font-size:16px;box-shadow:0 4px 0 #174d42}
#card .btns button.pri:hover{background:#307e6c;color:white;border-color:#307e6c}
#card .btns button.sec:hover{background:#dce6d9;color:#1c4940;border-color:#97b2a2}
#card .btns button.ter{color:#66796d;background:transparent;border-color:transparent}
#card .btns button.card{color:#234b42;background:#e2ebdd;border-color:#acc5ae;font-size:17px}
#card .btns button.card em{color:#607668}
#card .recs{margin-top:12px;padding-top:10px;border-color:#d4dbce;text-align:center}#card .recs div{color:#6a7c71}#card .recs b{color:#2e5849}
#shopBtn,#rigBtn{border-radius:12px;background:#e8e9df;border-color:#ccd4c5;color:#36594d}
#shopBtn .bal,#rigBtn .rn{color:#2e5849}#shopBtn .lbl,#rigBtn .lbl{color:#697c69}
#journeyPanel{margin-top:14px;padding:15px;border:1px solid #cbd8c7;border-radius:16px;background:linear-gradient(120deg,#dfe9d7,#edf0df)}
#journeyPanel .eyebrow{font-size:10px;color:#638170;letter-spacing:.12em;text-transform:uppercase}
#journeyPanel h2{font:750 25px system-ui,sans-serif;margin:7px 0;color:#284f43}
#journeyPanel p{font:12px/1.45 system-ui,sans-serif;color:#637566;margin:6px 0}
.route{display:flex;gap:6px;margin:12px 0 7px}.route span{flex:1;height:7px;border-radius:8px;background:#c6d2bf}.route span.done{background:#3f8065}.route span.current{background:#e4aa49}
#card .coins{color:#55715b}#rigName{color:#294f44}#rigDesc{color:#6b7e6d}#rigPerk{color:#3d7560}
#rigStage{background:radial-gradient(ellipse,#e2e9db,transparent)}
.urow .un{color:#345845}.urow .ud{color:#6a7c68}.urow button{color:#55705a;border-color:#b8c9b3}.urow button.can{background:#246859;color:white}
button:focus-visible{outline:3px solid #e8a331;outline-offset:3px}button:disabled{opacity:.45;cursor:default}
#journeyPanel[hidden]{display:none}
#strip i{border-color:#becdb9;background:#e5eadf}#strip i.on{background:#38765f;color:white}#strip div{color:#657b68}
#shopBtn:hover,#rigBtn:hover{background:#dce6d9;border-color:#98b49b}
#rigBuy.on{color:#3d6249;background:#d3deca;border-color:#b5c9a9}
@media(max-width:540px){#card{padding:23px 20px;border-radius:20px;max-height:94dvh}#card h1{font-size:40px}#journeyPanel{padding:15px;margin-top:15px}#card .btns button{padding:12px}}
</style>

<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div>
    <button id="tune">Tune</button>
    <button id="sndBtn" aria-label="Sound"></button>
    <button id="pauseBtn" hidden aria-label="Pause"><i></i><i></i></button>
    <div id="over"><div id="card">
      <h1 id="oTitle">MEGAVAC</h1>
      <p class="sub" id="oSub">crumbs to orbit</p>
      <div id="journeyPanel" hidden></div>
      <div class="coins"><i></i><span id="oCoins">0</span></div>
      <button id="shopBtn"><span class="cp"></span><span class="bal">0</span>
        <span class="lbl">Upgrades</span><span class="chev"></span></button>
      <button id="rigBtn"><span class="ri"><svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path
        d="M3 10.5h8l6-4.5v12l-6-4.5H3z"/><circle cx="19.5" cy="12" r="1.6"/></svg></span>
        <span class="rn">Dust-buster</span>
        <span class="lbl">Rigs</span><span class="chev"></span></button>
      <div id="oUpg" hidden><div id="uList"></div></div>
      <div id="oRigs" hidden>
        <div id="rigStage">
          <canvas id="rigArt" width="620" height="300"></canvas>
          <button id="rigPrev" aria-label="Previous">&lsaquo;</button>
          <button id="rigNext" aria-label="Next">&rsaquo;</button>
        </div>
        <div id="rigName"></div><div><span id="rigPerk"></span></div>
        <div id="rigDesc"></div><div id="rigStats"></div>
        <button id="rigBuy"></button><div id="rigDots"></div>
      </div>
      <div class="btns" id="oBtns">
        <button id="bB"></button>
        <button id="bA"></button>
        <button id="bD"></button>
        <button id="bC"></button>
      </div>
      <div class="recs" id="oRecs"></div>
      <div id="strip" hidden></div>
    </div></div></div>
  <aside id="panel">
    <button id="close" aria-label="Close">×</button>
    <div class="ph">Tuning</div>
    <div id="sliders"></div>
    <button id="bRefill">New mess</button>
    <div class="grp">Advanced</div>
    <button id="bAdv">Show the rest</button>
    <div id="adv" hidden></div>
    <button id="bReset">Reset tuning</button>

let inField=0, shake=0;
const jam={i:-1,t:0,dur:0,r:0};
const puffs=[]; for(let k=0;k<220;k++) puffs.push({l:0,x:0,y:0,vx:0,vy:0,r:0});
let puffP=0;
function puff(x,y,r){const p=puffs[puffP=(puffP+1)%puffs.length];
  p.l=1;p.x=x;p.y=y;p.r=r;const a=Math.random()*6.283,s=20+Math.random()*70;
  p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;}


// the single place coins are minted. every source goes through here.
function award(mass,bonus){
  const gain=Math.round((1+Math.round(mass*4))*(bonus||1)
    *(1+(mult-1)*.45)*(1+.1*lv.luck+run.coin+(RIG().m.coin||0))*(1+.5*loops));
  if(phase==='menu') return 0;
  scrap+=gain; roomScrap+=gain; runScrap+=gain; return gain;
}
function consume(i){
  runEaten++;
  combo++; comboT=.9*(1+run.combo);
  const m2=Math.min(5,1+((combo/12)|0));
  if(m2>mult){ mult=m2; multPop=1; sMult(mult); }
  if(bk[i]===12){
    award(bm[i],22); sGold();
    for(let k=0;k<14;k++) puff(bx[i],by[i],br[i]*.9);
    shake=Math.max(shake,3);
  } else { award(bm[i],1); tick(br[i]); }
  puff(bx[i],by[i],br[i]); kill(i);
}

function suck(dt){
  inField=0;
  if(phase==='dead') return;
  if(phase==='out' && ph<3.5) return;
  const R=P.reach, R2=R*R, capR=Math.max(8,R*.16), sw=P.swirl, blow=!!RIG().push;
  const Vm=P.power;
  const c0=Math.max(0,((mx-R)/CELL)|0), c1=Math.min(cols-1,((mx+R)/CELL)|0);
  const r0=Math.max(0,((my-R)/CELL)|0), r1=Math.min(rows-1,((my+R)/CELL)|0);
  for(let cy=r0;cy<=r1;cy++) for(let cx=c0;cx<=c1;cx++){
    const c=cy*cols+cx;
    for(let a=starts[c];a<starts[c+1];a++){
      const i=items[a]; if(!alive[i]||i===jam.i) continue;
      const dx=mx-bx[i], dy=my-by[i], d2=dx*dx+dy*dy;
      if(d2>R2) continue;
      inField++;
      if(i===boss.i)continue;
      if(bi[i]===0){
        // Any rig can break down a heavy object by holding close to it.
        // Crush upgrades make the same object directly movable and faster to eat.
        if(jam.i<0 && d2<Math.pow(capR+br[i]*.65,2)){
          heavyHold[i]+=dt;
          if(heavyHold[i]>=1.1){jam.i=i;jam.r=br[i];jam.t=0;jam.dur=.35;bvx[i]=0;bvy[i]=0;}
        }else heavyHold[i]=Math.max(0,heavyHold[i]-dt*.6);
        continue;
      }
      const d=Math.sqrt(d2)||1e-4, nx=dx/d, ny=dy/d;
      const f=Math.pow(1-d/R,1.5);
      let dvx,dvy;
      if(blow && d>capR*3.2){ dvx=-nx*Vm*.62*f; dvy=-ny*Vm*.62*f; }
      else { dvx=(nx-ny*sw)*Vm*f; dvy=(ny+nx*sw)*Vm*f; }
      const k=1-Math.exp(-P.grip*dt/Math.sqrt(bm[i]));
      bvx[i]+=(dvx-bvx[i])*k; bvy[i]+=(dvy-bvy[i])*k;
      if(jam.i<0 && d<capR){
        if(br[i]*2<=P.throat) consume(i);
        else if(br[i]<=P.ceiling){
          jam.i=i; jam.r=br[i]; jam.t=0;
          jam.dur=Math.min(1.4,.25+.06*(br[i]*2-P.throat));
          bi[i]=0; bvx[i]=0; bvy[i]=0; brc[i]=Math.max(br[i],capR+3);
        }
      }
    }
  }
}

function bossBurst(){
  const i=boss.i, x=bx[i], y=by[i], R0=br[i];
  award(bm[i],7);
  if(mode==='challenge') battery=Math.min(batMax(),battery+28);
  const fr=Math.min(P.throat*.42,Math.max(2.5,P.throat*.42));
  for(let k=0;k<34;k++){
    const a=Math.random()*6.2832, q=Math.random()*R0*.8;
    const j=spawn(x+Math.cos(a)*q,y+Math.sin(a)*q,fr*(.7+Math.random()*.7),Math.random()<.6?0:2);
    if(j<0) break;
    bvx[j]=Math.cos(a)*(140+Math.random()*220); bvy[j]=Math.sin(a)*(140+Math.random()*220);
  }
  for(let k=0;k<22;k++) puff(x,y,R0*.32);
  kill(i); boss.i=-1; shake=10; sBoss(); CG.happy();
}
function crunch(){
  const i=jam.i, r=jam.r, x=bx[i], y=by[i];
  award(bm[i],2.5);   // a jam release is worth more than a plain swallow
  kill(i); jam.i=-1;
  const parts=3+(Math.random()*2|0), fr=Math.min(r/2.4,P.throat*.4);
  for(let k=0;k<parts;k++){
    const j=spawn(x+(Math.random()-.5)*r,y+(Math.random()-.5)*r,fr*(.8+Math.random()*.4),Math.random()<.5?0:2);
    if(j<0) break;
    const a=Math.random()*6.283, s=90+Math.random()*140;
    bvx[j]=Math.cos(a)*s; bvy[j]=Math.sin(a)*s;
  }
  for(let k=0;k<5;k++) puff(x,y,r*.6);
  shake=Math.min(7,1.6+r*.16); sCrunch(r);
}


/* ---------------- step ---------------- */
let phase='play', ph=0, snap=null, titleA=0, liveN=0, lastGen=-99;
let roomMass=1,liveMass=1;
function cleanFraction(){return roomOver?1:Math.min(.99,Math.max(0,.7*(1-liveMass/Math.max(1,roomMass))+.3*(1-dirtLeft/Math.max(1,dirt.length))));}
let roomT=0, roomScrap=0, roomOver=false, resT=0, stars=0, newBest=false, heavyN=0, roomTotal=1;
let combo=0, comboT=0, mult=1, multPop=0;
const best={};
const fmtT=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function finishRoom(){
  if(roomOver||alive.some(v=>v!==0)||dirtLeft>dirt.length*.003)return;
  roomOver=true; CG.stop(); stars = roomT<=T.par?3 : roomT<=T.par*1.5?2 : 1;
  if(mode==='journey'){
    roomBonus=600+Math.floor(journey.job/5)*300+stars*150;
    scrap+=roomBonus;runScrap+=roomBonus;roomScrap+=roomBonus;
    journey.stars[journey.job]=Math.max(journey.stars[journey.job]||0,stars);
    journey.cleared=Math.max(journey.cleared,journey.job+1);
    journey.resume=(journey.job+1)%25;
    deepest=Math.max(deepest,tier);
  }
  roomN++; if(roomN>bestRoom){ bestRoom=roomN; }
  if(mode==='challenge' && stars===3) battery=Math.min(batMax(),battery+10);
  if(mode==='daily'){ recordDaily(roomT); }
  const b=best[tier];
  newBest = !b || roomT<b.t;
  if(newBest) best[tier]={t:roomT,s:stars};
  // Polish the final 0.3% of floor pixels only after every object is removed.
  jam.i=-1;boss.i=-1;liveN=0;liveMass=0;dirt.fill(0);dirtLeft=0;
  if(gx2)gx2.clearRect(0,0,grime.width,grime.height);
  phase='result'; resT=0; saveGame(); sStars(stars);
}
function doBreak(){
  snap=document.createElement('canvas'); snap.width=cv.width; snap.height=cv.height;
  snap.getContext('2d').drawImage(cv,0,0);
  n=0; freeT=0; alive.fill(0); jam.i=-1;
  if(tier>=TIERS.length-1){ loops++; applyTier(0); } else applyTier(tier+1);
  shake=9; sBreak();
}
function outAdvance(dt){
  const p0=ph; ph+=dt;
  if(p0<1.35 && ph>=1.35) doBreak();
  if(p0<3.35 && ph>=3.35){ generate(); titleA=1.9; }
  if(ph<1.35) shake=Math.max(shake,(ph/1.35)*(ph/1.35)*4);
  if(ph>=4.9){ phase='play'; snap=null; ph=0;CG.start(); }
}
function endRun(){
  phase='dead'; deepest=Math.max(deepest,tier); deadPending=true; dblClaimed=false;
  CG.stop(); saveGame(); sDead(); showOver('dead');
}
function startRun(m){
  if(m==='daily'&&dailyTries()>=3)return;
  mode=m; paused=false; roomOver=false; hideOver(); resetRun();
  mx=px=W*.5;my=py=H*.55;lmx=mx;lmy=my;pointerSeen=false;
  tut = tutSeen?0:1;
  battery=batMax(); runScrap=0; runEaten=0; lowWarn=0;
  if(m==='daily'){
    const k=dayKey(0); daily.tries[k]=(daily.tries[k]||0)+1; saveGame();
    applyTier(0); rnd=mulberry32(seedOf(k)); phase='play'; roomOver=false;
    generate(); rnd=Math.random; initAudio(); CG.start(); return;
  }
  if(m==='journey'){roomN=journey.job+1;applyTier(Math.floor(journey.job/5));}
  else applyTier(m==='challenge'?0:tier); phase='play'; roomOver=false;
  generate(); saveGame();initAudio(); CG.start();
}
const keys={};
let paused=false, pauseVis=null, dblClaimed=false;
function step(dt){
  if(paused) return;
  now+=dt;
  if(phase==='play'){
    let kx=0,ky=0;
    if(keys.a||keys.arrowleft) kx--;
    if(keys.d||keys.arrowright) kx++;
    if(keys.w||keys.arrowup) ky--;
    if(keys.s||keys.arrowdown) ky++;
    if(kx||ky){ const m2=Math.hypot(kx,ky), sp=640*dt/m2;
      px=Math.max(0,Math.min(W,px+kx*sp)); py=Math.max(0,Math.min(H,py+ky*sp));
      pointerSeen=true; }
  }
  if(phase==='menu'){ const a=now*.42;
    px=W*(.5+.31*Math.cos(a*1.1)); py=H*(.5+.29*Math.sin(a*1.7)); pointerSeen=true; }
  if(mode==='challenge' && phase==='play'){
    const load=Math.min(1,inField/45);
    battery-=(1.05+0.75*load)*(T.drain||1)*(1+.16*(roomN-1))*(1-.04*lv.eff)*(1-run.drain)*dt;
    if(battery<=0){ battery=0; endRun(); }
    else if(battery<batMax()*.2 && lowWarn<1){ lowWarn=1; sLow(); }
    else if(battery<batMax()*.1 && lowWarn<2){ lowWarn=2; sLow(); }
    else if(battery>batMax()*.25) lowWarn=0;
  }
  if(phase==='out') outAdvance(dt);
  const lag=P.lag/1000;
  if(pointerSeen && phase!=='dead'){ const k=lag<=0?1:1-Math.exp(-dt/lag); mx+=(px-mx)*k; my+=(py-my)*k; }
  const mdx=mx-lmx, mdy=my-lmy; lmx=mx; lmy=my;
  if(mdx*mdx+mdy*mdy>.4){ let d=Math.atan2(mdy,mdx)-mang;
    while(d>Math.PI)d-=6.2832; while(d<-Math.PI)d+=6.2832; mang+=d*.22; }
  if(phase==='play'||phase==='menu')clean(mx,my,P.reach*.72);
  for(const m of motes){
    const pull=(1-m.d/P.reach); m.d-=pull*pull*260*dt+22*dt; m.a+=m.s*dt*(1+pull*4);
    if(m.d<7){ m.d=P.reach*(.86+Math.random()*.4); m.a=Math.random()*6.2832; }
  }
  buildHash(); if(phase==='play'||phase==='menu'){suck(dt); droneStep(dt); finale(dt);}
  if(boss.i>=0 && phase==='play'){
    const i=boss.i;
    if(!alive[i]) boss.i=-1;
    else {
      const dx=mx-bx[i], dy=my-by[i];
      const near=Math.sqrt(dx*dx+dy*dy) < br[i]+P.reach*.3;
      boss.hold = near ? boss.hold+dt : Math.max(0,boss.hold-dt*.7);
      if(boss.hold>=boss.need) bossBurst();
    }
  }
  if(jam.i>=0){
    const i=jam.i; jam.t+=dt;
    bx[i]+=(mx-bx[i])*.35; by[i]+=(my-by[i])*.35;
    if(jam.t>=jam.dur) crunch();
  }
  let live=0, heavy=0;liveMass=0;
  for(let i=0;i<n;i++){
    if(!alive[i]) continue;
    live++;liveMass+=bm[i];
    if(i===jam.i)continue;
    if(bi[i]===0){ heavy++; continue; }
    if(bi[i]===0){bvx[i]=0;bvy[i]=0;continue;}
    bx[i]+=bvx[i]*dt; by[i]+=bvy[i]*dt;
    const dx=mx-bx[i],dy=my-by[i];
    const damp=(dx*dx+dy*dy<P.reach*P.reach)?.988:.85;
    bvx[i]*=damp; bvy[i]*=damp;
    const r=br[i];
    if(bx[i]<r){bx[i]=r;bvx[i]*=-.2} else if(bx[i]>W-r){bx[i]=W-r;bvx[i]*=-.2}
    if(by[i]<r){by[i]=r;bvy[i]*=-.2} else if(by[i]>H-r){by[i]=H-r;bvy[i]*=-.2}
  }
  buildHash(); collide();
  for(const p of puffs){ if(p.l<=0) continue; p.l-=dt*3.4; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.9; p.vy*=.9; }
  liveN=live; heavyN=heavy;
  shake*=Math.pow(.0015,dt); if(hintT>0) hintT-=dt;
  if(titleA>0) titleA-=dt*.5;
  if(multPop>0) multPop-=dt*3;
  if(comboT>0){ comboT-=dt; if(comboT<=0){ combo=0; mult=1; } }
  if(phase==='play' && !roomOver) roomT+=dt;
  if(phase==='result'){
    resT+=dt;
    if(mode==='relax' && resT>3.1){
      phase='out'; ph=0; }
  }
  if(phase==='play' && !roomOver && liveN===0 && dirtLeft<=dirt.length*.003 && boss.i<0 && now-lastGen>3) finishRoom();
  if(tut===1 && (runEaten>28||roomT>7)) tut=2;
  if(tut===2 && roomT>17){ tut=3; tutSeen=true; saveGame(); }
  if(phase==='result' && !cardsShown && resT>1.9){
    if(mode==='journey'){cardsShown=true;showOver('jobdone');}
    else if(mode==='challenge'){ cardsShown=true; showOver('cards'); }
    else if(mode==='daily'){ cardsShown=true; showOver('daily'); } }
}

/* ---------------- art: sprites, ground, grime ---------------- */
const TS=80, TR=28, KS=TS/TR;               // tile size, object radius in tile
const SPR=[];
function tile(fn){
  const c=document.createElement('canvas'); c.width=TS; c.height=TS;
  const x=c.getContext('2d'); x.translate(TS/2,TS/2);
  x.save(); if('filter' in x) x.filter='blur(3px)';
  x.globalAlpha=.3; x.fillStyle='#4A3418';
  x.beginPath(); x.arc(TR*.17,TR*.24,TR*.95,0,6.2832); x.fill(); x.restore();
  x.save(); fn(x,TR); x.restore(); return c;
}
function buildSprites(){
  for(let i=0;i<8;i++) SPR[i+3]=tile(T.spr[i]);
  SPR[12]=tile((x,R)=>{
    x.fillStyle='#9C6B0C'; x.beginPath(); x.arc(0,0,R*.95,0,6.2832); x.fill();
    x.fillStyle='#F0BE2E'; x.beginPath(); x.arc(0,0,R*.78,0,6.2832); x.fill();
    x.fillStyle='#FFE58C'; x.beginPath(); x.arc(0,0,R*.52,0,6.2832); x.fill();
    x.fillStyle='#FFFCEC'; x.beginPath();
    for(let i=0;i<8;i++){ const a=i*.7854, rad=i%2?R*.14:R*.6;
      x[i?'lineTo':'moveTo'](Math.cos(a)*rad,Math.sin(a)*rad); }
    x.closePath(); x.fill(); });
}
let ground=null, grime=null, gx2=null; const GS=4;
let dirt=new Uint8Array(0),dirtLeft=0;
function buildGround(){
  ground=document.createElement('canvas'); ground.width=W; ground.height=H;
  const c=ground.getContext('2d');
  const G=T.ground;
  c.fillStyle=G.base; c.fillRect(0,0,W,H);
  const lg=c.createRadialGradient(W*G.px,H*G.py,0,W*G.px,H*G.py,Math.max(W,H)*.95);
  lg.addColorStop(0,'rgba('+G.pool+','+G.pa+')'); lg.addColorStop(1,'rgba('+G.pool+',0)');
  c.fillStyle=lg; c.fillRect(0,0,W,H);
  c.save();c.strokeStyle='rgba(45,57,48,.12)';c.lineWidth=2;
  const spacing=[130,90,180,110,160][tier];
  for(let x=0;x<W;x+=spacing){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
  if(tier!==3)for(let y=0;y<H;y+=spacing){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  if(tier===2){c.setLineDash([26,24]);c.strokeStyle='rgba(255,239,172,.45)';c.lineWidth=5;c.beginPath();c.moveTo(W*.5,0);c.lineTo(W*.5,H);c.stroke();}
  c.restore();
  c.globalAlpha=1;
  const vg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.34,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba('+G.vig+',0)'); vg.addColorStop(1,'rgba('+G.vig+','+G.va+')');
  c.fillStyle=vg; c.fillRect(0,0,W,H);
  grime=document.createElement('canvas');
  grime.width=Math.ceil(W/GS); grime.height=Math.ceil(H/GS); gx2=grime.getContext('2d');
  dirt=new Uint8Array(grime.width*grime.height);dirt.fill(1);dirtLeft=dirt.length;
  gx2.fillStyle='rgba('+G.grime+','+G.ga+')'; gx2.fillRect(0,0,grime.width,grime.height);
  for(let i=0;i<120;i++){
    const x=Math.random()*grime.width, y=Math.random()*grime.height, r=6+Math.random()*20;
    const g=gx2.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba('+G.grime+',.13)'); g.addColorStop(1,'rgba('+G.grime+',0)');
    gx2.fillStyle=g; gx2.beginPath(); gx2.arc(x,y,r,0,6.2832); gx2.fill();
  }
}
function clean(x,y,r){
  if(!gx2) return;
  const a=x/GS,b=y/GS,c=r/GS;
  gx2.globalCompositeOperation='destination-out';
  const g=gx2.createRadialGradient(a,b,0,a,b,c);
  g.addColorStop(0,'rgba(0,0,0,.4)'); g.addColorStop(.55,'rgba(0,0,0,.2)'); g.addColorStop(1,'rgba(0,0,0,0)');
  gx2.fillStyle=g; gx2.beginPath(); gx2.arc(a,b,c,0,6.2832); gx2.fill();
  gx2.globalCompositeOperation='source-over';
  // The same pixel mask measures coverage and erases the visible dirt.
  const radius=c*.85,rr2=radius*radius;
  for(let yy=Math.max(0,Math.ceil(b-radius));yy<Math.min(grime.height,b+radius);yy++){
    const span=Math.sqrt(Math.max(0,rr2-(yy-b)*(yy-b)));
    const x0=Math.max(0,Math.ceil(a-span)),x1=Math.min(grime.width,Math.floor(a+span)+1);
    for(let xx=x0;xx<x1;xx++){const k=yy*grime.width+xx;if(dirt[k]){dirt[k]=0;dirtLeft--;}}
    gx2.clearRect(x0,yy,x1-x0,1);
  }
}
const motes=[]; for(let i=0;i<150;i++) motes.push({a:Math.random()*6.2832,
  d:20+Math.random()*160, s:(Math.random()<.5?-1:1)*(.5+Math.random()*1.3), z:.5+Math.random()*1.5});

function drawBoss(x,y,r){
  ctx.save(); if('filter' in ctx) ctx.filter='blur(9px)';
  ctx.globalAlpha=.3; ctx.fillStyle='#3A2A16';
  ctx.beginPath(); ctx.ellipse(x+r*.12,y+r*.2,r*1.02,r*.86,0,0,6.2832); ctx.fill();
  ctx.restore(); ctx.globalAlpha=1;
  const cols=[T.tiny[0],T.tiny[2],'#6E5A3E','#82694A',T.tiny[1]];
  for(let k=0;k<20;k++){
    const a=k*2.3999, q=((k*3)%7)/7*r*.7;
    ctx.fillStyle=cols[k%5];
    ctx.beginPath();
    ctx.arc(x+Math.cos(a)*q, y+Math.sin(a)*q*.88, r*(.3+((k*7)%5)*.055), 0, 6.2832);
    ctx.fill();
  }
  ctx.strokeStyle='rgba(255,244,216,.28)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(x,y,r*.93,3.35,5.35); ctx.stroke();
  const p=Math.min(1,boss.hold/boss.need);
  ctx.strokeStyle='rgba(18,12,6,.3)'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.arc(x,y,r*1.14,0,6.2832); ctx.stroke();
  if(p>0){
    ctx.strokeStyle=p>.72?'#F5C63A':'#E8791F'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(x,y,r*1.14,-1.5708,-1.5708+p*6.2832); ctx.stroke();
    ctx.lineCap='butt';
  }
  ctx.font='700 11px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillStyle='rgba(34,24,10,.85)'; ctx.fillText('THE BIG MESS',x,y+r*1.34);
  if(p<1){ ctx.font='9px "JetBrains Mono",monospace';
    ctx.fillStyle='rgba(34,24,10,.6)';
    ctx.fillText(p>0?'keep the nozzle on it':'hold the nozzle here',x,y+r*1.34+14); }
  ctx.textAlign='left';
}

/* ---------------- render ---------------- */
let debug=false, fps=60, aliveN=0, hintT=4, tut=0, tutSeen=false;

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(phase==='out' && ph>=1.35 && ph<3.35 && snap){
    ctx.drawImage(ground,0,0);
    const t=(ph-1.35)/2, e=1-Math.pow(1-t,3), sc=1-.84*e;
    ctx.save(); ctx.globalAlpha=Math.max(0,1-e*.9);
    ctx.translate(W/2,H/2); ctx.rotate(e*.13); ctx.scale(sc,sc);
    ctx.drawImage(snap,-W/2,-H/2,W,H);
    ctx.strokeStyle='rgba(28,20,10,.55)'; ctx.lineWidth=5/sc; ctx.strokeRect(-W/2,-H/2,W,H);
    ctx.restore(); ctx.globalAlpha=1; hud(); return;
  }
  if(ground) ctx.drawImage(ground,0,0);
  if(grime) ctx.drawImage(grime,0,0,W,H);
  ctx.save();
  if(shake>.05) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  const capR=Math.max(8,P.reach*.16);
  // suction motes
  const mp=new Path2D();
  for(const m of motes){
    if(roomOver||inField===0)break;
    const f=1-m.d/P.reach; if(f<=0) continue;
    mp.moveTo(mx+Math.cos(m.a)*m.d+m.z,my+Math.sin(m.a)*m.d);
    mp.arc(mx+Math.cos(m.a)*m.d,my+Math.sin(m.a)*m.d,m.z,0,6.2832);
  }
  ctx.globalAlpha=.5; ctx.fillStyle=T.ground.mote; ctx.fill(mp); ctx.globalAlpha=1;

  // bodies
  const shad=new Path2D(), tp=[new Path2D(),new Path2D(),new Path2D()], trail=new Path2D();
  aliveN=0;
  for(let i=0;i<n;i++){
    if(!alive[i]||i===jam.i) continue; aliveN++;
    const ap=(now-bt[i])/.22; if(ap<=0) continue;
    const r=br[i]*(ap<1?.35+.65*ap:1), k=bk[i], x=bx[i], y=by[i];
    const sp=bvx[i]*bvx[i]+bvy[i]*bvy[i];
    if(sp>32000){ trail.moveTo(x-bvx[i]*.035,y-bvy[i]*.035); trail.lineTo(x,y); }
    if(k<3){
      shad.moveTo(x+1.4+r,y+1.9); shad.arc(x+1.4,y+1.9,r,0,6.2832);
      const p=tp[k];
      if(k===1){ p.rect(x-r*.68,y-r*.68,r*1.36,r*1.36); }
      else { p.moveTo(x+r,y); p.arc(x,y,r,0,6.2832); }
    } else {
      if(k===13){ drawBoss(x,y,r); continue; }
      if(k===12){ const pl=.5+.5*Math.sin(now*6+i);
        ctx.globalAlpha=.2+pl*.26; ctx.fillStyle='#FFD24A';
        ctx.beginPath(); ctx.arc(x,y,r*2.3,0,6.2832); ctx.fill(); ctx.globalAlpha=1; }
      const sh=br[i]>P.ceiling?Math.sin(performance.now()*.019+i)*.8:0;
      if(!SPR[k]){ ctx.fillStyle='#7E6A4A';
        ctx.beginPath(); ctx.arc(x+sh,y,r,0,6.2832); ctx.fill(); continue; }
      const s=r*KS; ctx.drawImage(SPR[k],x+sh-s/2,y-s/2,s,s);
    }
  }
  ctx.globalAlpha=.22; ctx.fillStyle='#4A3418'; ctx.fill(shad); ctx.globalAlpha=1;
  for(let k=0;k<3;k++){ ctx.fillStyle=T.tiny[k]; ctx.fill(tp[k]); }
  ctx.strokeStyle='rgba(255,250,232,.3)'; ctx.lineWidth=1.4; ctx.stroke(trail);

  for(const p of puffs){ if(p.l<=0) continue;
    ctx.globalAlpha=p.l*.4; ctx.fillStyle='#EFE3C8';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.2+(1-p.l)*2.4),0,6.2832); ctx.fill(); }
  ctx.globalAlpha=1;

  // an object you cannot lift should say so, not just twitch
  if(phase==='play'){
    let hi2=-1, hd=1e9;
    for(let i=0;i<n;i++){
      if(!alive[i]||i===jam.i||bi[i]!==0||bk[i]===13) continue;
      const dx=mx-bx[i], dy=my-by[i], d2=dx*dx+dy*dy;
      if(d2<P.reach*P.reach && d2<hd){ hd=d2; hi2=i; }
    }
    if(hi2>=0){
      const ox=bx[hi2], oy=by[hi2], pl=.5+.5*Math.sin(now*8);
      ctx.save();
      ctx.strokeStyle='rgba(196,58,26,'+(.3+pl*.35).toFixed(2)+')'; ctx.lineWidth=2.5;
      ctx.setLineDash([7,6]); ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(ox,oy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle='rgba(196,58,26,.75)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(ox,oy,br[hi2]+6+pl*2,0,6.2832); ctx.stroke();
      ctx.font='700 10px "JetBrains Mono",monospace'; ctx.textAlign='center';
      const msg=heavyHold[hi2]>0?'BREAKING DOWN '+Math.min(100,Math.floor(heavyHold[hi2]/1.1*100))+'%':'HEAVY · HOLD THE NOZZLE HERE', tw=ctx.measureText(msg).width+18;
      ctx.fillStyle='rgba(34,16,8,.82)';
      const labelX=clamp(ox,tw/2+8,W-tw/2-8),labelY=clamp(oy-br[hi2]-30,66,H-28);
      rr(ctx,labelX-tw/2,labelY,tw,19,3); ctx.fill();
      ctx.fillStyle='#FFD2C2'; ctx.fillText(msg,labelX,labelY+6);
      ctx.restore(); ctx.textAlign='left';
    }
  }
  if(phase==='play' && liveN>0 && liveN<=20){
    const pl=.5+.5*Math.sin(now*5);
    ctx.strokeStyle='rgba(201,89,31,'+(.35+pl*.45).toFixed(2)+')'; ctx.lineWidth=2;
    for(let i=0;i<n;i++){
      if(!alive[i]||i===jam.i) continue;
      ctx.beginPath(); ctx.arc(bx[i],by[i],br[i]+7+pl*5,0,6.2832); ctx.stroke();
    }
  }
  if(jam.i>=0){
    const i=jam.i, k=jam.t/jam.dur, sq=1-.14*Math.sin(k*Math.PI), j=Math.sin(jam.t*70)*k*2.2;
    ctx.save(); ctx.translate(bx[i]+j,by[i]); ctx.scale(sq,2-sq);
    if(SPR[bk[i]]){ const s=br[i]*KS; ctx.drawImage(SPR[bk[i]],-s/2,-s/2,s,s); }
    else { ctx.fillStyle=bk[i]<3?T.tiny[bk[i]]:'#7E6A4A';
      ctx.beginPath(); ctx.arc(0,0,br[i],0,6.2832); ctx.fill(); }
    ctx.globalAlpha=k*.55; ctx.fillStyle='#FFE9C9';
    ctx.beginPath(); ctx.arc(0,0,br[i]*.95,0,6.2832); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }

  for(const d of drones){
    ctx.strokeStyle='rgba(40,30,16,.18)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(d.x,d.y); ctx.stroke();
    const dr=Math.max(7,P.reach*.075);
    ctx.save(); if('filter' in ctx) ctx.filter='blur(3px)';
    ctx.globalAlpha=.25; ctx.fillStyle='#3A2A16';
    ctx.beginPath(); ctx.arc(d.x+dr*.3,d.y+dr*.45,dr,0,6.2832); ctx.fill(); ctx.restore();
    ctx.globalAlpha=1;
    ctx.fillStyle='#C6CCD3'; ctx.beginPath(); ctx.arc(d.x,d.y,dr,0,6.2832); ctx.fill();
    ctx.fillStyle='#2A2F35'; ctx.beginPath(); ctx.arc(d.x,d.y,dr*.52,0,6.2832); ctx.fill();
    ctx.fillStyle='rgba(255,248,228,.5)'; ctx.beginPath();
    ctx.ellipse(d.x-dr*.32,d.y-dr*.34,dr*.32,dr*.2,-.5,0,6.2832); ctx.fill();
  }
  // mouth glow
  const dens=Math.min(1,inField/45);
  const gg=ctx.createRadialGradient(mx,my,0,mx,my,capR*3.2);
  gg.addColorStop(0,'rgba(38,26,12,'+(.3+dens*.28)+')');
  gg.addColorStop(.55,'rgba(38,26,12,.1)'); gg.addColorStop(1,'rgba(38,26,12,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(mx,my,capR*3.2,0,6.2832); ctx.fill();

  if(debug){
    ctx.strokeStyle='rgba(60,44,26,.45)'; ctx.setLineDash([4,5]); ctx.beginPath();
    ctx.arc(mx,my,P.reach,0,6.2832); ctx.stroke(); ctx.setLineDash([]);
  }

  // The intake is anchored on the physical suction point.
  ctx.save();ctx.translate(mx,my);ctx.rotate(mang);
  const rigScale=Math.max(12,capR*1.05)*2;
  ctx.translate(-rigScale*1.05,0);
  ctx.save();ctx.globalAlpha=.20;ctx.fillStyle='#203630';
  ctx.beginPath();ctx.ellipse(-rigScale*.1,rigScale*.55,rigScale*1.35,rigScale*.38,0,0,Math.PI*2);ctx.fill();ctx.restore();
  paintVacuum(ctx,rigScale,RIG(),1+Math.min(10,lv.mouth+Math.round(run.throat/.45))*.055);
  ctx.restore();ctx.restore();

  hud();
}

function hud(){
  ctx.font='11px "JetBrains Mono",monospace'; ctx.textBaseline='top';
  const overUp = typeof over!=='undefined' && over && !over.hidden;
  const chrome = !overUp && phase!=='result' && phase!=='dead';
  if(overUp) return;
  if(chrome && muted){
    ctx.font='11px "JetBrains Mono",monospace';
    const m2='SOUND OFF \u00b7 tap the speaker', pw=ctx.measureText(m2).width+26;
    ctx.fillStyle='rgba(70,26,16,.85)'; rr(ctx,16,14,pw,26,3); ctx.fill();
    ctx.fillStyle='#FFC9B4'; ctx.fillText(m2,29,21);
  }
  if(chrome && !muted && (!AC||AC.state!=='running')){
    const msg=muted?'sound muted  \u2014  press M':'click anywhere for sound';
    const pw=ctx.measureText(msg).width+40;
    ctx.fillStyle='rgba(32,24,12,.82)'; rr(ctx,16,14,pw,26,3); ctx.fill();
    ctx.fillStyle='#F2EAD6'; ctx.fillText(msg,44,21);
    ctx.strokeStyle='#F2EAD6'; ctx.lineWidth=1.4; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(27,24); ctx.lineTo(31,24); ctx.lineTo(35,20);
    ctx.lineTo(35,34); ctx.lineTo(31,30); ctx.lineTo(27,30); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(35,27,5,-.8,.8); ctx.stroke();
  }
  if(debug){ ctx.fillStyle='rgba(58,42,24,.75)';
    ctx.fillText('FPS '+fps.toFixed(0)+'   BODIES '+aliveN+'   IN FIELD '+inField,18,18); }
  if(chrome && tut>0 && tut<3 && phase==='play'){
    const msg = tut===1 ? (COARSE?'drag to vacuum':'move to vacuum')
                        : 'clear the room to go deeper';
    ctx.save(); ctx.textAlign='center';
    ctx.font='12px "JetBrains Mono",monospace';
    const pw=ctx.measureText(msg).width+34;
    ctx.globalAlpha=.9; ctx.fillStyle='rgba(30,22,10,.62)';
    rr(ctx,(W-pw)/2,H-84,pw,28,4); ctx.fill();
    ctx.fillStyle='#F4EAD2'; ctx.fillText(msg,W/2,H-76);
    ctx.restore(); ctx.textAlign='left'; ctx.globalAlpha=1;
  }
  if(chrome && hintT>0 && tut===0){ ctx.globalAlpha=Math.min(1,hintT)*.55; ctx.fillStyle='#4A3520';
    ctx.textAlign='center'; ctx.fillText(COARSE?'drag to vacuum':'move to vacuum',W/2,H-72);
    ctx.textAlign='left'; ctx.globalAlpha=1; }
  if(false){
    ctx.globalAlpha=.85; ctx.fillStyle='#8A3418'; ctx.textAlign='center';
    ctx.fillText('spotless \u2014 tap for a new mess',W/2,H-72); ctx.textAlign='left'; ctx.globalAlpha=1; }
  if(phase==='out' && ph<1.35){ ctx.globalAlpha=.5*(ph/1.35); ctx.fillStyle='#3A2A16';
    ctx.textAlign='center'; ctx.fillText(T.outgrow,W/2,H-72); ctx.textAlign='left'; ctx.globalAlpha=1; }
  if(chrome && mode==='journey' && phase==='play'){
    ctx.save();ctx.textAlign='center';ctx.font='700 13px system-ui,sans-serif';
    ctx.fillStyle='#284e42';ctx.fillText(jobName(),W/2,20);
    ctx.font='10px system-ui,sans-serif';ctx.fillText('JOB '+(journey.job+1)+' / 25 · '+scrap.toLocaleString()+' coins',W/2,38);ctx.restore();
  }
  if(chrome && mode==='daily' && phase!=='menu'){
    ctx.font='700 15px "JetBrains Mono",monospace'; ctx.textAlign='center';
    ctx.fillStyle='rgba(28,20,10,.3)'; ctx.fillText(fmtT(roomT),W/2+1,19);
    ctx.fillStyle='#3E2E14'; ctx.fillText(fmtT(roomT),W/2,18);
    ctx.font='9px "JetBrains Mono",monospace'; ctx.fillStyle='rgba(62,46,20,.65)';
    ctx.fillText('MESS OF THE DAY',W/2,38); ctx.textAlign='left';
  }
  if(chrome && mode==='challenge' && phase!=='menu'){
    const f=Math.max(0,Math.min(1,battery/batMax()));
    const CW=Math.min(268,W*.42), CH=22, cx0=(W-CW)/2, cy0=18;
    const low=f<.2, crit=f<.1;
    const pulse=low?(.62+.38*Math.sin(now*(crit?16:9))):1;
    const col = low?'#E8412A' : f<.45?'#E9A02C' : '#63C356';
    ctx.save();
    ctx.fillStyle='rgba(20,15,9,.5)'; rr(ctx,cx0-8,cy0-8,CW+24,CH+16,6); ctx.fill();
    ctx.fillStyle='rgba(238,228,206,.9)'; rr(ctx,cx0+CW+3,cy0+CH*.3,6,CH*.4,2); ctx.fill();
    ctx.fillStyle='rgba(12,9,5,.66)'; rr(ctx,cx0,cy0,CW,CH,5); ctx.fill();
    ctx.strokeStyle='rgba(240,230,206,.32)'; ctx.lineWidth=1.4;
    rr(ctx,cx0+.5,cy0+.5,CW-1,CH-1,5); ctx.stroke();
    const N=12, pad=3.5, gap=2.5;
    const cw=(CW-pad*2-gap*(N-1))/N, ch=CH-pad*2;
    for(let i=0;i<N;i++){
      const fill=Math.max(0,Math.min(1,f*N-i)); if(fill<=0) break;
      const x=cx0+pad+i*(cw+gap);
      ctx.fillStyle=col; ctx.globalAlpha=pulse*(fill<1?.35+fill*.65:1);
      rr(ctx,x,cy0+pad,cw*(fill<1?Math.max(.35,fill):1),ch,1.5); ctx.fill();
    }
    ctx.globalAlpha=pulse*.45; ctx.fillStyle='rgba(255,255,255,.5)';
    rr(ctx,cx0+pad,cy0+pad,CW-pad*2,ch*.34,1.5); ctx.fill();
    ctx.globalAlpha=pulse;
    ctx.fillStyle=low?'#FFD9CE':'rgba(245,238,220,.9)';
    const bx0=cx0+9, by0=cy0+4.5, bh=CH-9;
    ctx.beginPath();
    ctx.moveTo(bx0+4.5,by0); ctx.lineTo(bx0,by0+bh*.58);
    ctx.lineTo(bx0+3.2,by0+bh*.58); ctx.lineTo(bx0+1.4,by0+bh);
    ctx.lineTo(bx0+6.6,by0+bh*.42); ctx.lineTo(bx0+3.4,by0+bh*.42);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    ctx.font='700 11px "JetBrains Mono",monospace'; ctx.textAlign='right';
    ctx.fillStyle='rgba(250,244,228,.92)';
    ctx.fillText(Math.round(f*100)+'%',cx0+CW-8,cy0+6);
    if(low){ ctx.font='9px "JetBrains Mono",monospace'; ctx.textAlign='center';
      ctx.globalAlpha=pulse; ctx.fillStyle='#B8351C';
      ctx.fillText(crit?'CRITICAL':'LOW POWER',W/2,cy0+CH+6); ctx.globalAlpha=1; }
    ctx.font='700 11px "JetBrains Mono",monospace'; ctx.textAlign='left';
    ctx.fillStyle='rgba(28,20,10,.3)'; ctx.fillText('ROOM '+roomN,19,cy0+2);
    ctx.fillStyle='#3E2E14'; ctx.fillText('ROOM '+roomN,18,cy0+1);
    const cp=cleanFraction();
    ctx.fillStyle='rgba(30,22,10,.2)'; rr(ctx,18,cy0+17,78,5,2.5); ctx.fill();
    ctx.fillStyle=cp>.92?'#4E9B44':'#8A5A24'; rr(ctx,18,cy0+17,78*cp,5,2.5); ctx.fill();
    ctx.font='9px "JetBrains Mono",monospace'; ctx.fillStyle='rgba(62,46,20,.75)';
    ctx.fillText(Math.floor(cp*100)+'% clean'+(bestRoom>1?'   best '+bestRoom:''),18,cy0+26);
    ctx.restore(); ctx.textAlign='left';
  }
  if(chrome && phase==='play' && mode!=='challenge'){
    const cp=cleanFraction();
    ctx.textAlign='left';
    ctx.fillStyle='rgba(30,22,10,.2)'; rr(ctx,18,44,78,5,2.5); ctx.fill();
    ctx.fillStyle=cp>.92?'#4E9B44':'#8A5A24'; rr(ctx,18,44,78*cp,5,2.5); ctx.fill();
    ctx.font='9px "JetBrains Mono",monospace'; ctx.fillStyle='rgba(62,46,20,.75)';
    ctx.fillText(Math.floor(cp*100)+'% clean',18,53);
  }
  if(chrome && phase==='play' && liveN===0 && dirtLeft>0){
    ctx.save();ctx.textAlign='center';ctx.font='12px system-ui,sans-serif';ctx.fillStyle='#284e42';
    ctx.fillText('Debris cleared · sweep the remaining floor marks',W/2,H-35);
    const k=dirt.indexOf(1);
    if(k>=0){const x=(k%grime.width)*GS,y=Math.floor(k/grime.width)*GS;
      ctx.strokeStyle='#448765';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,14+Math.sin(now*4)*3,0,Math.PI*2);ctx.stroke();}
    ctx.restore();
  }
  if(mult>1 && phase==='play'){
    const pop=1+Math.max(0,multPop)*.5;
    ctx.save(); ctx.translate(mx,my-Math.max(34,P.reach*.42)); ctx.scale(pop,pop);
    ctx.textAlign='center';
    ctx.font='700 '+(15+mult*2)+'px "JetBrains Mono",monospace';
    ctx.fillStyle='rgba(24,18,8,.28)'; ctx.fillText('\u00d7'+mult,1.5,2);
    ctx.fillStyle=['','#8A6A2E','#B8722A','#C9591F','#D83C14','#E01E0C'][mult];
    ctx.fillText('\u00d7'+mult,0,0);
    const bw=54, bf=Math.max(0,comboT/.9);
    ctx.fillStyle='rgba(24,18,8,.2)'; ctx.fillRect(-bw/2,7,bw,3);
    ctx.fillStyle=['','#8A6A2E','#B8722A','#C9591F','#D83C14','#E01E0C'][mult];
    ctx.fillRect(-bw/2,7,bw*bf,3);
    ctx.restore(); ctx.textAlign='left';
  }
  if(phase==='result'){
    const a=Math.max(0,Math.min(1,resT*4)*Math.min(1,(3.1-resT)*3));
    const bw=Math.min(360,W-56), bh=214, bx2=(W-bw)/2, by2=H*.5-bh*.62;
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(22,17,10,.9)'; rr(ctx,bx2,by2,bw,bh,4); ctx.fill();
    ctx.strokeStyle='rgba(255,236,200,.18)'; ctx.lineWidth=1; rr(ctx,bx2,by2,bw,bh,4); ctx.stroke();
    ctx.textAlign='center';
    ctx.font='10px "JetBrains Mono",monospace'; ctx.fillStyle='rgba(240,228,200,.5)';
    ctx.fillText(T.name.toUpperCase()+'  CLEARED',W/2,by2+20);
    // stars
    const sy=by2+50, sp=44;
    for(let i=0;i<3;i++){
      const on=i<stars, sx=W/2+(i-1)*sp;
      const grow=Math.min(1,Math.max(0,(resT-.25-i*.22)*5));
      ctx.save(); ctx.translate(sx,sy+15); ctx.scale(on?grow:1,on?grow:1);
      ctx.beginPath();
      for(let p=0;p<10;p++){ const ang=-1.5708+p*.6283, rad=p%2?6.5:15;
        ctx[p?'lineTo':'moveTo'](Math.cos(ang)*rad,Math.sin(ang)*rad); }
      ctx.closePath();
      ctx.fillStyle=on?'#F0B429':'rgba(240,228,200,.12)'; ctx.fill();
      ctx.restore();
    }
    ctx.font='700 40px "JetBrains Mono",monospace'; ctx.fillStyle='#F2E8D2';
    ctx.fillText(fmtT(roomT),W/2,by2+96);
    ctx.font='10px "JetBrains Mono",monospace';
    ctx.fillStyle=newBest?'#F0B429':'rgba(240,228,200,.45)';
    ctx.fillText(newBest?'NEW BEST':(best[tier]?'BEST  '+fmtT(best[tier].t):'')
      +'      PAR  '+fmtT(T.par),W/2,by2+146);
    ctx.font='700 15px "JetBrains Mono",monospace'; ctx.fillStyle='#E8B23A';
    ctx.fillText('+ '+roomScrap.toLocaleString()+' coins',W/2,by2+172);
    if(heavyN>0){ ctx.font='9.5px "JetBrains Mono",monospace';
      ctx.fillStyle='rgba(255,180,140,.75)';
      ctx.fillText(heavyN+' too heavy to lift \u2014 upgrade CRUSH',W/2,by2+194); }
    ctx.textAlign='left'; ctx.globalAlpha=1;
  }
  if(titleA>0){
    const a=Math.min(1,titleA*1.6)*Math.min(1,(1.9-titleA)*4);
    ctx.globalAlpha=a*.9; ctx.textAlign='center';
    ctx.font='700 clamp(28px,6vw,58px) "JetBrains Mono",monospace';
    ctx.fillStyle='rgba(28,20,10,.9)'; ctx.fillText(T.name.toUpperCase(),W/2,H*.42);
    ctx.font='11px "JetBrains Mono",monospace'; ctx.fillStyle='rgba(28,20,10,.7)';
    ctx.fillText(T.rig,W/2,H*.42+34);
    ctx.textAlign='left'; ctx.globalAlpha=1;
  }
}

/* ---------------- portal ---------------- */
const CG={ ready:false, sdk:null,
  init(){ try{ const k=window.CrazyGames&&window.CrazyGames.SDK; if(!k) return;
    this.sdk=k; Promise.resolve(k.init&&k.init()).then(()=>{this.ready=true;if(phase==='play'&&!paused)this.start();}).catch(()=>{});
  }catch(e){} },
  call(fn){ try{ if(this.ready&&this.sdk.game&&this.sdk.game[fn]) this.sdk.game[fn](); }catch(e){} },
  start(){ this.call('gameplayStart'); },
  stop(){ this.call('gameplayStop'); },
  happy(){ this.call('happytime'); },
  hasAds(){ return this.ready && this.sdk.ad && typeof this.sdk.ad.requestAd==='function'; },
  adBusy:false,
  rewarded(done){this.requestAd('rewarded',done);},
  midgame(){this.requestAd('midgame',()=>{});},
  requestAd(type,done){
    if(this.adBusy)return;
    if(!this.hasAds()){done(false);return;}
    const wasPaused=paused;this.adBusy=true;paused=true;
    document.getElementById('over').inert=true;
    document.getElementById('sndBtn').disabled=true;
    let settled=false;
    const end=ok=>{
      if(settled)return;settled=true;this.adBusy=false;paused=wasPaused;
      document.getElementById('over').inert=false;
      document.getElementById('sndBtn').disabled=false;
      if(master)master.gain.value=muted?0:1;
      done(ok);
      if(!ok)say('No ad available. Your progress is safe.');
      if(phase==='play'&&!paused)this.start();
    };
    try{this.stop();this.sdk.ad.requestAd(type,{
      adFinished:()=>end(true),adError:()=>end(false),
      adStarted:()=>{if(master)master.gain.value=0;}
    });}catch(e){end(false);}

const SCALE=[0,3,5,7,10,12,15,17,19,22,24];   // A minor pentatonic

function noise(sec){ const b=AC.createBuffer(1,(AC.sampleRate*sec)|0,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function makeIR(dur,decay){ const len=(AC.sampleRate*dur)|0, b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return b; }

  const conv=AC.createConvolver(); conv.buffer=makeIR(1.7,3.4);
  revIn=AC.createGain(); revIn.gain.value=1;

function tick(r){
  if(!AC||muted) return;

  noteI=(combo<=1)?0:Math.min(noteI+1,SCALE.length-1); lastNote=t;
  const oct=r>10?-12:r>6?-5:0;
  const f=ROOT*Math.pow(2,(SCALE[noteI]+oct)/12);

  g.gain.exponentialRampToValueAtTime(0.1575,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o.connect(bf); bf.connect(g); g.connect(master); g.connect(revIn);
  o.start(t); o.stop(t+.22);
  const o3=AC.createOscillator(),g3=AC.createGain();

function frame(now){
  const raw=Math.min(.1,(now-last)/1000); last=now;
  fAcc+=raw; fN++; if(fAcc>.4){fps=fN/fAcc;fAcc=0;fN=0}
  acc+=raw; let guard=0;
  while(acc>=1/60 && guard++<3){ step(1/60); acc-=1/60; }

  if(pv!==pauseVis){ pauseVis=pv;

  render(); requestAnimationFrame(frame);

    journey.job=journey.resume;
    oTitle.textContent='MEGAVAC'; oSub.textContent='A little mess. A lot of satisfaction.';
    document.getElementById('journeyPanel').innerHTML='<div class="eyebrow">Your cleaning journey · Job '+(journey.job+1)+' / 25</div><h2>'+jobName()+'</h2><p>'+TIERS[Math.floor(journey.job/5)].name+' · '+PATTERNS[journey.job%5]+' · no timer, no pressure</p><div class="route">'+TIERS.map((t,i)=>'<span title="'+t.name+'" class="'+(journey.cleared>=(i+1)*5?'done':i===Math.floor(journey.job/5)?'current':'')+'"></span>').join('')+'</div><p>Kitchen → Garage → Street → Skyline → Orbit · '+journey.cleared+' jobs · '+Object.values(journey.stars).reduce((a,b)=>a+b,0)+' stars collected</p>';
    const left=3-dailyTries(), doneToday=dailyBest()!==undefined;
    shopBtn.hidden=false; rigBtn.hidden=false;
    bB.innerHTML=(journey.cleared?'Continue cleaning':'Start cleaning')+' &nbsp; →'; bB.className='pri'; bB.hidden=false;
    bB.onclick=()=>startJourney(true);
    bA.className='sec'; bA.hidden=false;
    bA.innerHTML='Mess of the Day'
      +(daily.streak?'  &nbsp;\u00b7&nbsp; '+daily.streak+'\u2011day streak':'')
      +(doneToday?'  &nbsp;\u00b7&nbsp; '+fmtT(dailyBest()):'');
    bA.disabled=left<=0;
    bA.onclick=()=>{ if(left>0) startRun('daily'); };
    bD.hidden=false; bD.className='sec';
    bD.innerHTML='Battery challenge'; bD.onclick=()=>startRun('challenge');
    bC.hidden=true;
    drawStrip();
    oRecs.innerHTML=rec('Deepest',TIERS[deepest].name)
      +rec('Best clear',best[0]?fmtT(best[0].t)+'  '+'\u2605'.repeat(best[0].s||0):'\u2014')
      +rec('Streak',daily.streak?daily.streak+'d':'\u2014');
  } else if(k==='jobdone'){
    oTitle.textContent=journey.job===24?'BEAUTIFULLY DONE':'ALL FRESH.';
    oSub.textContent=jobName()+' · '+'★'.repeat(stars);
    oRecs.innerHTML=rec('Time',fmtT(roomT))+rec('Job bonus','+'+roomBonus.toLocaleString())+rec('Wallet',scrap.toLocaleString());
    bB.innerHTML=journey.job===24?'Clean the journey again →':'Next job →';bB.className='pri';bB.onclick=nextJob;
    bA.innerHTML='Upgrade your vacuum';bA.className='sec';bA.onclick=()=>showOver('upg');
    bC.innerHTML='Back to workshop';bC.className='ter';bC.onclick=()=>{journey.job=journey.resume;saveGame();phase='menu';showOver('menu');};
    rigBtn.hidden=false;
  } else if(k==='daily'){
    const k2=dayKey(0), b=dailyBest();
    oTitle.textContent='MESS OF THE DAY';
    oSub.textContent=k2+'  \u00b7  attempt '+dailyTries()+' of 3';
    oRecs.innerHTML=rec('Your time',fmtT(roomT))
      +rec('Best today',b!==undefined?fmtT(b):'\u2014')
      +rec('Streak',daily.streak+(daily.streak===1?' day':' days'));
    drawStrip();
    const left=3-dailyTries();
    bB.hidden=left<=0; bB.className='pri';
    bB.innerHTML='Try again &nbsp;\u00b7&nbsp; '+left+' left';
    bB.onclick=()=>startRun('daily');
    bA.innerHTML='Menu'; bA.className='sec'; bA.onclick=()=>{ phase='menu'; mode='relax';
      applyTier(0); generate(); showOver('menu'); };
    bC.hidden=true; bD.hidden=true;
  } else if(k==='cards'){
    oTitle.textContent='ROOM '+(roomN-1)+' CLEARED';
    oSub.textContent='pick one \u2014 lasts this run only';
    const [c1,c2]=twoCards();
    const pick=c=>()=>{ c.f(); applyStats(); hideOver();
      bB.className=''; bA.className='';
      CG.start();phase='out'; ph=0; };
    bB.innerHTML=c1.n+'<em>'+c1.d+'</em>'; bB.className='card'; bB.hidden=false;
    bA.innerHTML=c2.n+'<em>'+c2.d+'</em>'; bA.className='card';
    bB.onclick=pick(c1); bA.onclick=pick(c2);
    bD.hidden=true; bC.hidden=true;
    oRecs.innerHTML=rec('Room',roomN)+rec('Battery',Math.round(battery))
      +rec('This run','+'+runScrap.toLocaleString());
  } else if(k==='pause'){
    oTitle.textContent='PAUSED'; oSub.textContent=T.name+'  \u00b7  room '+roomN;
    bB.innerHTML='Resume'; bB.className='pri'; bB.hidden=false;
    bB.onclick=()=>togglePause();
    bA.innerHTML='Shop'; bA.className='sec'; bA.hidden=false;
    bA.onclick=()=>showOver('upg');
    bC.innerHTML='Quit to menu'; bC.className='ter'; bC.hidden=false;
    bC.onclick=()=>{ paused=false; phase='menu'; mode='relax';
      applyTier(0); generate(); showOver('menu'); };
    oRecs.innerHTML=rec('Room',roomN)+rec('Clean',Math.floor(cleanFraction()*100)+'%')
      +rec('This run','+'+runScrap.toLocaleString());
  } else if(k==='rigs'){
    oTitle.textContent='RIGS'; oSub.textContent='pick your machine';
    rigView=Math.max(0,RIGS.findIndex(r=>r.id===rig)); renderRigs();
    bA.innerHTML='Back'; bA.className='sec'; bA.hidden=false;
    bB.hidden=true; bC.hidden=true; bD.hidden=true;
    bA.onclick=()=>{ bB.hidden=false; showOver(prevView); };
  } else if(k==='upg'){
    oTitle.textContent='UPGRADES'; oSub.textContent='spend what you collected';
    renderUpgrades();
    bA.innerHTML='Back'; bA.className='sec';
    bB.hidden=true; bC.hidden=true;
    bA.onclick=()=>{ bB.hidden=false; showOver(prevView); };
  } else {
    oTitle.textContent='BATTERY DEAD'; oSub.textContent='you reached the '+T.name;
    const nx=TIERS[Math.min(tier+1,TIERS.length-1)];
    oRecs.innerHTML=rec('Room reached',(roomN-1)+(bestRoom>roomN-1?'  (best '+bestRoom+')':''))
      +rec('This run','+'+runScrap.toLocaleString())
      +rec('Objects',runEaten.toLocaleString());
    const windCost=500, adWind=CG.hasAds() && !usedWind && mode==='challenge';
    const canWind=adWind || (!usedWind && scrap>=windCost && mode==='challenge');
    const revive=()=>{ usedWind=true; deadPending=false;
      battery=batMax()*.4; phase='play'; roomOver=false; lowWarn=0;
      hideOver(); saveGame(); sCharge(); CG.start(); };
    if(canWind){
      bB.innerHTML=adWind?'Second Wind &nbsp;\u00b7&nbsp; watch an ad'
                        :'Second Wind &nbsp;\u00b7&nbsp; '+windCost+' coins';
      bB.className='pri';
      bB.onclick=()=>{
        if(adWind){ CG.rewarded(ok=>{ if(ok) revive(); }); }
        else { scrap-=windCost; revive(); } };
      bA.innerHTML='Run again'; bA.className='sec';
      bA.onclick=()=>{ deadPending=false; startRun('challenge'); };
    } else {
      bB.innerHTML='Run again'; bB.className='pri';
      bB.onclick=()=>{ deadPending=false; startRun('challenge'); };
      bA.hidden=true;
    }
    shopBtn.hidden=false; rigBtn.hidden=false;
    if(CG.hasAds() && !dblClaimed && runScrap>0){
      bD.hidden=false; bD.className='sec';
      bD.innerHTML='Double this run &nbsp;\u00b7&nbsp; watch an ad';
      bD.onclick=()=>CG.rewarded(ok=>{ if(ok){ dblClaimed=true; scrap+=runScrap;
        runScrap*=2; saveGame(); sBuy(); showOver('dead'); } });
    }
    bB.hidden=false; bC.innerHTML='Menu'; bC.className='ter';
    bC.onclick=()=>{ deadPending=false; phase='menu'; mode='relax';
      applyTier(0); generate(); showOver('menu'); };
    oSub.textContent = tier<TIERS.length-1
      ? 'you reached the '+T.name+' \u2014 next up: '+nx.name
      : 'you cleared everything';
  }
}
const stripEl=document.getElementById('strip');
function drawStrip(){
  let h='';
  for(let i=6;i>=0;i--){
    const k=dayKey(i), got=daily.hist[k]!==undefined, today=i===0;
    const lbl=['S','M','T','W','T','F','S'][new Date(Date.now()-i*864e5).getUTCDay()];
    h+='<div><i class="'+(got?'on ':'')+(today?'today':'')+'">'+(got?'\u2713':'')+'</i>'+lbl+'</div>';
  }
  stripEl.innerHTML=h; stripEl.hidden=false;
}
function hideOver(){ over.hidden=true; }
function togglePause(){
  if(CG.adBusy)return;
  if(paused){ paused=false; hideOver(); CG.start(); }
  else { paused=true; CG.stop(); showOver('pause'); }
}
document.getElementById('pauseBtn').onclick=()=>togglePause();
const sndBtn=document.getElementById('sndBtn');
function drawSnd(){
  sndBtn.classList.toggle('off',muted);
  sndBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    +' stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
    +'<path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/>'
    +(muted ? '<path d="M16 9.5l5 5M21 9.5l-5 5"/>'
            : '<path d="M15.6 9a4.2 4.2 0 0 1 0 6M18.2 6.6a7.8 7.8 0 0 1 0 10.8"/>')
    +'</svg>';
}
sndBtn.onclick=()=>{
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
  muted=!muted;
  if(master) master.gain.value=muted?0:1.0;
  drawSnd(); saveGame();
  if(!muted) sTest();
};
drawSnd();
let deadPending=false;
const savedTier=loadGame();drawSnd();resize(); applyTier(savedTier);
mx=W*.5; my=H*.5; lmx=mx; lmy=my; generate();
phase='menu'; showOver('menu');
requestAnimationFrame(frame);
</script>
