<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mega Factory Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--panel:linear-gradient(180deg,rgba(40,44,56,.92),rgba(24,27,35,.92));--edge:rgba(255,255,255,.1);--green:#5ff07f;--red:#ff6464;--gold:#ffd447}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd6ff;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.28),0 10px 24px rgba(0,0,0,.18)}
#money{position:fixed;top:14px;left:14px;padding:10px 18px 10px 12px;display:flex;gap:12px;align-items:center;transition:transform .12s}
#money.pop{transform:scale(1.07)}
.coin{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffcc2e 45%,#d99a00);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 3px #b07800;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:#8a5a00}
#cash{font-size:34px;font-weight:700;color:var(--green);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#rate{font-size:15px;color:#cfe;opacity:.9;margin-top:3px}
#rebirths{display:none;margin-top:4px;font-size:13px;font-weight:700;color:#3a2600;background:var(--gold);border-radius:8px;padding:1px 8px;width:max-content}
#next{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:9px 16px 11px;min-width:280px;max-width:calc(100vw - 28px);text-align:center}
#nextText{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nextText b{color:var(--gold)}
#bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}
#barFill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#41d96a,#9bff7a);transition:width .2s}
#controls{position:fixed;top:14px;right:14px;display:flex;gap:8px}
.btn{font:inherit;font-size:15px;font-weight:600;color:#fff;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.label{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;will-change:transform}
.pill{display:inline-block;padding:4px 12px 5px;border-radius:12px;background:rgba(14,16,22,.72);border:2px solid rgba(255,255,255,.14)}
.label .name{font-size:18px;font-weight:600;line-height:1.15}
.label .cost{font-size:24px;font-weight:700;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.label.floater{font-size:26px;font-weight:700;color:var(--green);text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 10px rgba(0,0,0,.4)}
#toasts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;width:min(460px,calc(100vw - 32px))}
.toast{padding:9px 18px;font-size:19px;font-weight:700;text-align:center;animation:in .25s cubic-bezier(.2,1.6,.4,1);transition:opacity .4s}
.toast.success{color:var(--green)}.toast.error{color:var(--red)}.toast.gold{color:var(--gold)}
@keyframes in{from{transform:translateY(14px) scale(.85);opacity:0}}
#help{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:8px 16px;font-size:14px;text-align:center;max-width:calc(100vw - 32px);transition:opacity 1s}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.4);display:none;pointer-events:none}
#knob{position:absolute;left:32px;top:32px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.65)}
#jump{position:fixed;right:24px;bottom:30px;width:80px;height:80px;border-radius:50%;font-size:18px;display:none;touch-action:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-size:30px;font-weight:700;background:linear-gradient(#5aa9f0,#bfe6ff);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
@media (max-width:640px){#cash{font-size:26px}.coin{width:36px;height:36px;font-size:20px}#money{padding:8px 14px 8px 10px}#next{top:auto;bottom:122px;min-width:0;width:calc(100vw - 28px)}#nextText{font-size:14px}.btn{padding:6px 10px;font-size:13px}.label .name{font-size:15px}.label .cost{font-size:19px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>
<div id="money" class="panel"><div class="coin">$</div><div><div id="cash">$0</div><div id="rate">+$0/s</div><div id="rebirths"></div></div></div>
<div id="next" class="panel"><div id="nextText"></div><div id="bar"><div id="barFill"></div></div></div>
<div id="controls"><button id="gfx" class="btn" title="Graphics quality">HD</button><button id="sound" class="btn" title="Sound (M)">🔊</button><button id="reset" class="btn" title="Delete save">Reset</button></div>
<div id="toasts"></div>
<div id="help" class="panel">WASD / arrows to walk · Space to jump · drag to look · scroll to zoom · step on buttons to buy</div>
<div id="stick"><div id="knob"></div></div>
<button id="jump" class="btn">JUMP</button>
<div id="loading"><div>🏭 Mega Factory Tycoon</div><div style="font-size:18px;opacity:.85">Loading…</div></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- config --
const SAVE_KEY = 'megatycoon.v1';
const START_CASH = 0;
const REBIRTH_BONUS = 0.5;       // +50% income per rebirth
const BELT_SPEED = 10;           // studs per second
const DEFAULT_INTERVAL = 1.5;    // seconds between drops
const MAX_DROPS = 200;
const OFFLINE_CAP = 2 * 3600;    // seconds of away earnings
const WALK_SPEED = 16, JUMP_SPEED = 40, GRAVITY = 120, PLAYER_RADIUS = 1;

// Purchase tree in button order. A button appears once everything in
// `requires` is owned; 'all' means every item except the rebirth.
const ITEMS = [
  {id:'dropper1', name:'Basic Dropper', kind:'dropper', cost:0, value:2, lane:1, color:0xb8bcc4},
  {id:'dropper2', name:'Copper Dropper', kind:'dropper', cost:40, requires:['dropper1'], value:4, lane:2, color:0xd9773a},
  {id:'walls', name:'Factory Walls', kind:'walls', cost:100, requires:['dropper1']},
  {id:'upgrader1', name:'Washer ×1.5', kind:'upgrader', cost:200, requires:['dropper2'], mult:1.5, lane:1, color:0x3cc8ff},
  {id:'dropper3', name:'Iron Dropper', kind:'dropper', cost:400, requires:['upgrader1'], value:10, lane:3, color:0x6f7f95},
  {id:'overclock', name:'Overclock +33%', kind:'overclock', cost:750, requires:['dropper3'], mult:0.75},
  {id:'dropper4', name:'Silver Dropper', kind:'dropper', cost:1500, requires:['dropper3'], value:25, lane:4, color:0xe8edf5},
  {id:'upgrader2', name:'Polisher ×2', kind:'upgrader', cost:3000, requires:['dropper4'], mult:2, lane:2, color:0xb45aff},
  {id:'dropper5', name:'Gold Dropper', kind:'dropper', cost:6000, requires:['upgrader2'], value:60, lane:5, color:0xffc21a},
  {id:'furnace', name:'Furnace Mk II ×1.5', kind:'furnace', cost:12000, requires:['dropper5'], mult:1.5},
  {id:'dropper6', name:'Diamond Dropper', kind:'dropper', cost:25000, requires:['dropper5'], value:150, lane:6, color:0x5ff0ff},
  {id:'upgrader3', name:'Gold Plater ×3', kind:'upgrader', cost:60000, requires:['dropper6','furnace'], mult:3, lane:3, color:0xffaa00},
  {id:'dropper7', name:'Mega Dropper', kind:'dropper', cost:150000, requires:['upgrader3'], value:400, interval:1, lane:7, color:0xff3c8c},
  {id:'rebirth', name:'REBIRTH +50% income', kind:'rebirth', cost:500000, requires:'all'},
];
const BY_ID = Object.fromEntries(ITEMS.map((it, i) => [it.id, Object.assign(it, {slot:i})]));

// Plot layout, in studs. +X runs along the belt toward the furnace and +Z
// points out of the entrance.
const PLOT = 100, BELT_Z = -25, BELT_W = 6, BELT_TOP = 3, BELT_X0 = -40, BELT_X1 = 24;
const DROPPER_X0 = -36, UPGRADER_X0 = 6, LANE = 6;
const FURNACE_X = BELT_X1 + 6;
const PAD = {x:30, z:-8, r:4};
const SPAWN = {x:0, z:24.5}; // between button rows
const WALL_H = 9;
const dropperX = lane => DROPPER_X0 + (lane - 1) * LANE;
const upgraderX = lane => UPGRADER_X0 + (lane - 1) * LANE;
const buttonPos = slot => ({x:-32 + (slot % 5) * 16, z:8 + Math.floor(slot / 5) * 11});

// ------------------------------------------------------------- economy --
const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function short(n) {
  if (!Number.isFinite(n)) return '0';
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  if (n < 1000) return sign + Math.floor(n);
  let tier = Math.min(Math.floor(Math.log10(n) / 3), SUFFIXES.length - 1);
  const fmt = t => { const s = n / 10 ** (t * 3); return s.toFixed(s < 10 ? 2 : s < 100 ? 1 : 0); };
  let s = fmt(tier);
  if (+s >= 1000 && tier < SUFFIXES.length - 1) s = fmt(++tier); // 999,999 -> 1M, not 1000K
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return sign + s + SUFFIXES[tier];
}
const money = n => '$' + short(n);

let resetting = false;
const state = {cash:START_CASH, bank:0, rebirths:0, owned:new Set(), savedAt:Date.now()};
const rebirthMult = () => 1 + state.rebirths * REBIRTH_BONUS;
const costOf = it => it.kind === 'rebirth' ? it.cost * (state.rebirths + 1) : it.cost;
const intervalMult = () => state.owned.has('overclock') ? BY_ID.overclock.mult : 1;
const furnaceMult = () => state.owned.has('furnace') ? BY_ID.furnace.mult : 1;
function requirementsMet(it) {
  if (it.requires === 'all') return ITEMS.every(o => o.kind === 'rebirth' || state.owned.has(o.id));
  return (it.requires || []).every(id => state.owned.has(id));
}

// Steady-state earnings, used for the HUD and for time spent away.
function incomePerSecond() {
  let perSec = 0, mult = furnaceMult() * rebirthMult();
  for (const it of ITEMS) {
    if (!state.owned.has(it.id)) continue;
    if (it.kind === 'dropper') perSec += it.value / ((it.interval || DEFAULT_INTERVAL) * intervalMult());
    if (it.kind === 'upgrader') mult *= it.mult;
  }
  return perSec * mult;
}

function save() {
  if (resetting) return; // a reset is reloading the page; don't write the save back
  state.savedAt = Date.now();
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({cash:state.cash, bank:state.bank, rebirths:state.rebirths, owned:[...state.owned], savedAt:state.savedAt}));
  } catch {}
}
function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch {}
  if (!raw || typeof raw !== 'object') return 0;
  const num = v => Number.isFinite(+v) && +v >= 0 ? +v : 0;
  state.cash = num(raw.cash); state.bank = num(raw.bank); state.rebirths = Math.floor(num(raw.rebirths));
  state.owned = new Set((Array.isArray(raw.owned) ? raw.owned : []).filter(id => BY_ID[id] && id !== 'rebirth'));
  return Math.max(0, (Date.now() - num(raw.savedAt)) / 1000);
}

// ---------------------------------------------------------------- sound --
let actx = null, muted = false;
try { muted = localStorage.getItem(SAVE_KEY + '.muted') === '1'; } catch {}
function tone(freq, dur, type = 'square', vol = 0.05, delay = 0) {
  if (muted || !actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  buy: () => [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'square', 0.05, i * 0.07)),
  coin: () => { tone(988, 0.08); tone(1319, 0.18, 'square', 0.05, 0.08); },
  error: () => tone(130, 0.22, 'sawtooth', 0.05),
  rebirth: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.07, i * 0.09)),
};
function unlockAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
}

// ------------------------------------------------------------- renderer --
const TEST = new URLSearchParams(location.search).has('test');
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:TEST, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const HORIZON = 0xcde9ff;
scene.fog = new THREE.Fog(HORIZON, 200, 560);
const camera = new THREE.PerspectiveCamera(58, 1, 0.5, 1400);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6b8a4a, 0.55));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-70, right:70, top:70, bottom:-70, near:10, far:320});
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), 0.45, 0.3, 1.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let hd = !isTouch;
try { const g = localStorage.getItem(SAVE_KEY + '.gfx'); if (g) hd = g === 'hd'; } catch {}

// ------------------------------------------------------------- textures --
function canvasTex(w, h, draw, {repeat = [1, 1], color = true} = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  t.anisotropy = MAX_ANISO;
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function tiled(tex, rx, ry) { const t = tex.clone(); t.repeat.set(rx, ry); t.needsUpdate = true; return t; }
const noise = (ctx, w, h, amount, alpha = 0.06) => {
  for (let i = 0; i < amount; i++) {
    ctx.fillStyle = Math.random() < 0.5 ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
};
const tileTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#9da3ad'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const shade = 168 + ((i + j) % 2) * 14;
    x.fillStyle = `rgb(${shade},${shade + 3},${shade + 8})`;
    x.fillRect(i * 128 + 3, j * 128 + 3, 122, 122);
  }
  noise(x, w, h, 2500, 0.04);
}, {repeat:[PLOT / 8, PLOT / 8]});
const grassTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#5fae47'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) {
    const g = 150 + Math.random() * 60;
    x.fillStyle = `rgba(${60 + Math.random() * 40},${g},${50 + Math.random() * 30},.5)`;
    x.fillRect(Math.random() * w, Math.random() * h, 2, 3 + Math.random() * 3);
  }
}, {repeat:[120, 120]});
const chevronTex = canvasTex(128, 128, (x, w, h) => {
  x.fillStyle = '#22252b'; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#3b4049'; x.lineWidth = 18; x.lineCap = 'round';
  x.beginPath(); x.moveTo(30, 18); x.lineTo(90, 64); x.lineTo(30, 110); x.stroke();
  x.fillStyle = '#16181c'; x.fillRect(0, 0, w, 6); x.fillRect(0, h - 6, w, 6);
  noise(x, w, h, 600, 0.05);
});
const hazardTex = canvasTex(128, 32, (x, w, h) => {
  x.fillStyle = '#ffc61a'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#1d1d22';
  for (let i = -2; i < 6; i++) { x.beginPath(); x.moveTo(i * 32, h); x.lineTo(i * 32 + 16, h); x.lineTo(i * 32 + 32, 0); x.lineTo(i * 32 + 16, 0); x.fill(); }
});
const wallTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#ece6d8'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#d7cfbe'; x.fillRect(0, 0, 6, h); x.fillRect(128, 0, 4, h);
  x.fillStyle = '#9b4a35'; x.fillRect(0, h - 46, w, 46);
  x.fillStyle = '#7f3a29'; x.fillRect(0, h - 46, w, 5);
  noise(x, w, h, 1500, 0.03);
});
const brickTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#2b2d33'; x.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = -1; c < 4; c++) {
    const v = 60 + Math.random() * 25;
    x.fillStyle = `rgb(${v + 30},${v * 0.55},${v * 0.45})`;
    x.fillRect(c * 64 + (r % 2) * 32 + 3, r * 32 + 3, 58, 26);
  }
});
const scanTex = canvasTex(32, 128, (x, w, h) => {
  x.clearRect(0, 0, w, h);
  for (let i = 0; i < h; i += 16) {
    const g = x.createLinearGradient(0, i, 0, i + 16);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, i, w, 16);
  }
}, {repeat:[1, 1]});
const signTex = canvasTex(1024, 192, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#ff5a3c'); g.addColorStop(1, '#d4281a');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = '#ffd447'; x.fillRect(0, 0, w, 12); x.fillRect(0, h - 12, w, 12);
  x.font = '700 108px Fredoka, "Trebuchet MS", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 14; x.strokeStyle = '#7a1408'; x.strokeText('MEGA FACTORY', w / 2, h / 2 + 6);
  x.fillStyle = '#fff'; x.fillText('MEGA FACTORY', w / 2, h / 2 + 6);
});
const padTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#1f9a3f'; x.beginPath(); x.arc(128, 128, 128, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#3ee26a'; x.beginPath(); x.arc(128, 128, 108, 0, Math.PI * 2); x.fill();
  x.font = '700 150px Fredoka, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#e9ffe9'; x.fillText('$', 128, 136);
});
const faceTex = canvasTex(128, 128, (x) => {
  x.clearRect(0, 0, 128, 128);
  x.fillStyle = '#1b1b1b';
  x.beginPath(); x.ellipse(44, 52, 9, 13, 0, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.ellipse(84, 52, 9, 13, 0, 0, Math.PI * 2); x.fill();
  x.lineWidth = 8; x.lineCap = 'round'; x.strokeStyle = '#1b1b1b';
  x.beginPath(); x.arc(64, 70, 26, 0.2 * Math.PI, 0.8 * Math.PI); x.stroke();
});
const glowTex = canvasTex(64, 64, (x) => {
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
});

// ------------------------------------------------------------- builders --
const UNIT = new THREE.BoxGeometry(1, 1, 1);
const materials = new Map();
function mat(color, {neon = 0, metal = 0.1, rough = 0.6, opacity = 1, map = null, flat = false} = {}) {
  const key = [color, neon, metal, rough, opacity, map?.uuid, flat].join();
  if (!materials.has(key)) {
    materials.set(key, new THREE.MeshStandardMaterial({
      color, metalness:metal, roughness:rough, map, flatShading:flat,
      emissive:neon ? color : 0x000000, emissiveIntensity:neon,
      transparent:opacity < 1, opacity, depthWrite:opacity === 1, envMapIntensity:0.45,
    }));

// Sprites for fire, smoke and sparkles; small instanced meshes for confetti

const sprites = [];
function sprite(pos, vel, life, size, color, {additive = true, grow = 1, opacity = 1} = {}) {
  let s = sprites.find(p => !p.alive);
  if (!s) {
    if (sprites.length > 260) return;
    const m = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, depthWrite:false, transparent:true}));
    s = {m}; sprites.push(s); scene.add(m);
  }
  Object.assign(s, {alive:true, t:0, life, size, grow, vel:vel.clone(), opacity});
  s.m.visible = true;
  s.m.position.copy(pos);
  s.m.material.color.setHex(color);
  s.m.material.blending = additive ? THREE.AdditiveBlending : THREE.NormalBlending;
  s.m.material.needsUpdate = true;
}
function stepSprites(dt) {
  for (const s of sprites) {
    if (!s.alive) continue;
    s.t += dt;
    if (s.t >= s.life) { s.alive = false; s.m.visible = false; continue; }
    const k = s.t / s.life;
    s.m.position.addScaledVector(s.vel, dt);
    s.m.scale.setScalar(s.size * (1 + (s.grow - 1) * k));
    s.m.material.opacity = s.opacity * (1 - k) * Math.min(1, k * 6);
  }
}

class Burst {
  constructor(geo, material, count) {
    this.mesh = new THREE.InstancedMesh(geo, material, count);
    this.mesh.frustumCulled = false; this.mesh.count = 0; this.mesh.castShadow = true;
    this.mesh.setColorAt(0, new THREE.Color(1, 1, 1));
    this.parts = []; this.max = count;
    scene.add(this.mesh);
  }
  emit(origin, n, {speed = 14, up = 18, colors = [0xffffff], life = 1.6, spread = 1} = {}) {
    for (let i = 0; i < n && this.parts.length < this.max; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.4 + Math.random() * 0.6);
      this.parts.push({p:new THREE.Vector3(origin.x + (Math.random() - 0.5) * spread, origin.y, origin.z + (Math.random() - 0.5) * spread),
        v:new THREE.Vector3(Math.cos(a) * s, up * (0.6 + Math.random() * 0.6), Math.sin(a) * s),
        r:new THREE.Euler(Math.random() * 6, Math.random() * 6, 0), spin:(Math.random() - 0.5) * 16,
        c:new THREE.Color(colors[Math.floor(Math.random() * colors.length)]), t:0, life:life * (0.7 + Math.random() * 0.5)});
    }
  }
  step(dt) {
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.t += dt;
      if (p.t > p.life) { this.parts.splice(i, 1); continue; }
      p.v.y -= 45 * dt; p.v.multiplyScalar(1 - dt * 0.9);
      p.p.addScaledVector(p.v, dt);
      if (p.p.y < 0.15) { p.p.y = 0.15; p.v.y *= -0.35; p.v.x *= 0.6; p.v.z *= 0.6; }
      p.r.x += p.spin * dt; p.r.y += p.spin * 0.7 * dt;
    }
    this.mesh.count = this.parts.length;
    this.parts.forEach((p, i) => {
      const s = Math.min(1, (p.life - p.t) * 3);
      this.mesh.setMatrixAt(i, m.compose(p.p, q.setFromEuler(p.r), sc.set(s, s, s)));
      this.mesh.setColorAt(i, p.c);
    });
    this.mesh.instanceMatrix.needsUpdate = true;
    if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
  }
}

function spawnDrop(it) {
  if (drops.length >= MAX_DROPS) return;
  drops.push({x:dropperX(it.lane), y:BELT_TOP + 3.6, z:BELT_Z + (Math.random() - 0.5) * 2.4, vy:0,
    value:it.value, color:new THREE.Color(it.color), ups:new Set(), spin:Math.random() * 6});

function stepSim(dt) {
  const im = intervalMult();
  for (const d of droppers) {
    const iv = (d.item.interval || DEFAULT_INTERVAL) * im;
    d.t += dt;
    while (d.t >= iv) { d.t -= iv; spawnDrop(d.item); d.squish = 1; }
  }
  const rest = BELT_TOP + 0.9, sell = furnaceMult() * rebirthMult();
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (d.y > rest) { d.vy -= GRAVITY * 0.5 * dt; d.y = Math.max(rest, d.y + d.vy * dt); continue; }
    d.x += BELT_SPEED * dt;
    for (const u of upgraders) {
      if (d.x >= u.x && !d.ups.has(u.item.id)) {
        d.ups.add(u.item.id); d.value *= u.item.mult;
        d.color.lerp(new THREE.Color(u.item.color), 0.6);
        d.flash = 1;
      }
    }
    if (d.x >= BELT_X1 - 0.2) {
      const earned = d.value * sell;
      state.bank += earned; soldPending += earned;
      drops.splice(i, 1);
      intakeGlow = 1;
    }
  }
}

const avatar = makeAvatar();

const player = {x:SPAWN.x, y:0, z:SPAWN.z, vy:0, yaw:Math.PI, grounded:true, walk:0, onBelt:false, ground:0};
const cam = {yaw:0.3, pitch:0.55, dist:28, actual:28};
const keys = new Set();
const stick = {id:null, x:0, y:0, ox:0, oy:0};
let jumpQueued = false;

function resolveWalls(p) {
  for (const b of colliders) {
    if (p.y >= b.top - 0.05) continue;
    const cx = Math.max(b.x0, Math.min(p.x, b.x1)), cz = Math.max(b.z0, Math.min(p.z, b.z1));
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= PLAYER_RADIUS * PLAYER_RADIUS) continue;
    if (d2 > 1e-9) {
      const d = Math.sqrt(d2);
      p.x = cx + dx / d * PLAYER_RADIUS; p.z = cz + dz / d * PLAYER_RADIUS;
    } else { // centre is inside the box: leave by the nearest face
      const pushes = [[b.x0 - PLAYER_RADIUS - p.x, 0], [b.x1 + PLAYER_RADIUS - p.x, 0], [0, b.z0 - PLAYER_RADIUS - p.z], [0, b.z1 + PLAYER_RADIUS - p.z]];
      pushes.sort((a, c) => Math.abs(a[0] + a[1]) - Math.abs(c[0] + c[1]));
      p.x += pushes[0][0]; p.z += pushes[0][1];
    }
  }
}
function groundUnder(p) {
  let h = 0, belt = false;
  const r = PLAYER_RADIUS * 0.5;
  for (const b of colliders) {
    if (p.x + r < b.x0 || p.x - r > b.x1 || p.z + r < b.z0 || p.z - r > b.z1) continue;
    if (p.y >= b.top - 0.6 && b.top > h) { h = b.top; belt = b.belt; }
  }
  return {h, belt};
}
const insideSolid = (x, y, z) => colliders.some(b => y < b.top + 0.3 && x > b.x0 - 0.3 && x < b.x1 + 0.3 && z > b.z0 - 0.3 && z < b.z1 + 0.3);

function stepPlayer(dt) {
  let ix = stick.x, iy = -stick.y;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iy += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iy -= 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  const len = Math.hypot(ix, iy);
  if (len > 1) { ix /= len; iy /= len; }
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  const mx = fx * iy + rx * ix, mz = fz * iy + rz * ix, moving = Math.hypot(mx, mz) > 0.05;
  player.x += mx * WALK_SPEED * dt; player.z += mz * WALK_SPEED * dt;
  if (player.onBelt) player.x += BELT_SPEED * dt;
  if (moving) {
    const target = Math.atan2(mx, mz);
    let diff = target - player.yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.yaw += diff * Math.min(1, dt * 14);
  }
  player.x = Math.max(-250, Math.min(250, player.x)); player.z = Math.max(-250, Math.min(250, player.z));
  resolveWalls(player);

  if ((jumpQueued || keys.has('Space')) && player.grounded) { player.vy = JUMP_SPEED; player.grounded = false; }
  jumpQueued = false;
  player.vy -= GRAVITY * dt;
  player.y += player.vy * dt;
  const g = groundUnder(player);
  player.ground = g.h;
  if (player.y <= g.h) { player.y = g.h; player.vy = 0; player.grounded = true; player.onBelt = g.belt; }
  else { player.grounded = false; player.onBelt = false; }

  player.walk = moving && player.grounded ? player.walk + dt * 11 : player.walk * 0.8;
  const swing = Math.sin(player.walk) * (moving ? 0.85 : 0);
  avatar.arms[0].rotation.x = swing; avatar.arms[1].rotation.x = -swing;
  avatar.legs[0].rotation.x = -swing; avatar.legs[1].rotation.x = swing;
  if (!player.grounded) { avatar.arms[0].rotation.x = avatar.arms[1].rotation.x = -2.6; avatar.legs[0].rotation.x = 0.4; avatar.legs[1].rotation.x = -0.4; }
  avatar.g.position.set(player.x, player.y + (moving && player.grounded ? Math.abs(Math.sin(player.walk)) * 0.18 : 0), player.z);
  avatar.g.rotation.y = player.yaw;
  avatar.shadowBlob.position.set(player.x, g.h + 0.06, player.z);
  avatar.shadowBlob.scale.setScalar(Math.max(0.4, 1 - (player.y - g.h) / 14));
}

// Pads under the player's feet: buttons buy, the green pad collects.
let standingOn = null, onPad = false, lastErrorAt = 0;
function stepPads() {
  const feet = player.y < 0.8;
  let here = null;
  if (feet) for (const [id, b] of buttons) if (Math.hypot(player.x - b.x, player.z - b.z) < 3) here = id;
  if (here) {
    const b = buttons.get(here);
    if (state.cash >= b.cost) purchase(here);
    else if (here !== standingOn && performance.now() - lastErrorAt > 800) { lastErrorAt = performance.now(); purchase(here); }
  }
  standingOn = here;

  const nowOnPad = feet && Math.hypot(player.x - PAD.x, player.z - PAD.z) < PAD.r;
  if (nowOnPad && state.bank >= 1) {
    const amount = Math.floor(state.bank);
    state.bank -= amount; state.cash += amount;
    if (!onPad) {
      toast('+' + money(amount), 'success'); sfx.coin();
      coins.emit(new THREE.Vector3(PAD.x, 1, PAD.z), Math.min(40, 8 + Math.floor(Math.log10(amount + 1) * 6)), {colors:[0xffcf33], speed:9, up:26, spread:3});
      floatText('+' + money(amount), {x:PAD.x, y:5, z:PAD.z});

  }

}

const v3 = new THREE.Vector3();
function placeLabels() {
  const w = innerWidth, h = innerHeight;
  for (const l of labels) {
    const dist = camera.position.distanceTo(l.pos);
    v3.copy(l.pos).project(camera);
    if (v3.z > 1 || dist > l.maxDist || Math.abs(v3.x) > 1.2 || Math.abs(v3.y) > 1.2) { l.el.style.display = 'none'; continue; }
    const s = Math.max(0.55, Math.min(1.2, 40 / dist));
    l.el.style.display = '';
    l.el.style.transform = `translate(${(v3.x + 1) / 2 * w}px,${(1 - v3.y) / 2 * h}px) translate(-50%,-100%) scale(${s})`;
    l.el.style.zIndex = String(1000 - Math.round(dist));
    l.el.style.opacity = l.fade ?? (dist > l.maxDist * 0.8 ? (l.maxDist - dist) / (l.maxDist * 0.2) : 1);

const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), tmpP = new THREE.Vector3(), tmpS = new THREE.Vector3(), tmpC = new THREE.Color();
const WHITE = new THREE.Color(1, 1, 1);
let clock = 0, fxTimer = 0, sellTimer = 0;
function updateVisuals(dt) {
  clock += dt;
  beltTex.offset.x -= BELT_SPEED * dt / 4; // one chevron tile is 4 studs long
  scanTex.offset.y -= dt * 0.8;
  for (const d of droppers) {
    d.squish = Math.max(0, d.squish - dt * 5);
    d.body.scale.set(1 + d.squish * 0.12, 1 - d.squish * 0.18, 1 + d.squish * 0.12);
    d.light.material.emissiveIntensity = 1 + d.squish * 4;
  }
  for (const u of upgraders) u.field.material.opacity = 0.45 + Math.sin(clock * 6 + u.x) * 0.12;
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt;
    const k = Math.min(1, Math.max(0, p.t / 0.4)), c = 1.8, e = 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2;
    p.obj.scale.copy(p.obj.userData.full).multiplyScalar(Math.max(0.001, e));
    if (k >= 1) { p.obj.scale.copy(p.obj.userData.full); pops.splice(i, 1); }
  }
  for (const g of itemGroups.values()) for (const m of g.children) if (m.userData.spin) {
    m.rotation.y += m.userData.spin * dt;
    if (m.userData.tilt) m.rotation.x = Math.PI / 2 + Math.sin(clock * 1.3) * 0.5;
  }
  intakeGlow = Math.max(0, intakeGlow - dt * 4);
  intakeMat.emissiveIntensity = 1.4 + intakeGlow * 1.6 + Math.sin(clock * 9) * 0.15;
  fireLight.intensity = 34 + intakeGlow * 30 + Math.sin(clock * 13) * 6;
  padMat.emissiveIntensity = state.bank >= 1 ? 0.55 + Math.sin(clock * 5) * 0.3 : 0.25;
  beacon.material.opacity = 0.3 + Math.sin(clock * 3) * 0.08;
  beacon.rotation.y += dt;
  for (const b of buttons.values()) {
    b.top.material.emissiveIntensity = 0.6 + Math.sin(clock * 4) * 0.25;
    b.top.position.y = 0.4 + (standingOn === b.item.id ? -0.15 : 0);
  }
  for (const c of clouds) { c.position.x += dt * 3; if (c.position.x > 520) c.position.x = -520; }

  // Fire at the furnace mouth, smoke from the vent or chimney.
  fxTimer += dt;
  while (fxTimer > 0.05) {
    fxTimer -= 0.05;
    sprite(tmpP.set(BELT_X1 - 0.5 + Math.random(), BELT_TOP + 1 + Math.random() * 4, BELT_Z + (Math.random() - 0.5) * 5),
      tmpS.set(-1 + Math.random(), 3 + Math.random() * 3, 0), 0.6, 1.6 + Math.random(), Math.random() < 0.5 ? 0xff6a14 : 0xffb42a, {grow:0.4});
    if (Math.random() < 0.35) {
      const sx = chimneyOn ? FURNACE_X - 2 : FURNACE_X + 1, sy = chimneyOn ? 21.8 : 12.2, sz = chimneyOn ? BELT_Z + 2 : BELT_Z;
      sprite(tmpP.set(sx + (Math.random() - 0.5), sy, sz + (Math.random() - 0.5)), tmpS.set(1.5 + Math.random(), 4 + Math.random() * 2, (Math.random() - 0.5) * 1.5),
        3.2, 2.5, 0x8a8f99, {additive:false, grow:3.2, opacity:0.45});
    }

  // Sales add up into one "+$" every so often instead of one per drop.

  if (dropMesh.instanceColor) dropMesh.instanceColor.needsUpdate = true;

  // Third-person camera that pulls in instead of clipping through walls.
  const cp = Math.cos(cam.pitch), tx = player.x, ty = player.y + 4.5, tz = player.z;
  const dir = tmpS.set(Math.sin(cam.yaw) * cp, Math.sin(cam.pitch), Math.cos(cam.yaw) * cp);
  let allowed = cam.dist;
  for (let t = 2; t <= cam.dist; t += 1) {
    if (insideSolid(tx + dir.x * t, ty + dir.y * t, tz + dir.z * t)) { allowed = Math.max(4, t - 1.5); break; }
  }
  cam.actual += (allowed - cam.actual) * Math.min(1, dt * (allowed < cam.actual ? 20 : 4));
  if (dt === 0) cam.actual = allowed;
  camera.position.set(tx + dir.x * cam.actual, Math.max(1.5, ty + dir.y * cam.actual), tz + dir.z * cam.actual);
  camera.lookAt(tx, ty, tz);
  sky.position.copy(camera.position);
  sun.position.set(player.x + 70, 120, player.z + 45); sun.target.position.set(player.x, 0, player.z);
}

function render() {
  if (hd) composer.render(); else renderer.render(scene, camera);
  placeLabels();
}

let hudTimer = 0, saveTimer = 0;
function update(dt) {
  stepSim(dt);
  stepPlayer(dt);
  stepPads();
  updateVisuals(dt);
  hudTimer += dt; saveTimer += dt;
  if (hudTimer > 0.1) { hudTimer = 0; updateHud(); }
  if (saveTimer > 5) { saveTimer = 0; save(); }
}

function applyGraphics() {
  renderer.shadowMap.enabled = true;
  sun.shadow.mapSize.set(hd ? 2048 : 1024, hd ? 2048 : 1024);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, hd ? 2 : 1.25));
  $('gfx').textContent = hd ? 'HD' : 'Fast';
  resize();
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 70 : 58;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
applyGraphics();

// ---------------------------------------------------------------- input --
if (isTouch) {
  $('jump').style.display = 'block';
  $('help').textContent = 'Left side: move · right side: look · step on buttons to buy';
}
addEventListener('keydown', e => {
  unlockAudio();
  if (e.code === 'KeyM') { toggleSound(); return; }
  keys.add(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  hideHelpSoon();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

const looks = new Map();
canvas.addEventListener('pointerdown', e => {
  unlockAudio(); canvas.focus();
  if (e.pointerType === 'touch' && e.clientX < innerWidth / 2 && stick.id === null) {
    stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY;
    const s = $('stick'); s.style.display = 'block'; s.style.left = (e.clientX - 60) + 'px'; s.style.top = (e.clientY - 60) + 'px';
  } else {
    looks.set(e.pointerId, {x:e.clientX, y:e.clientY});
  }
  canvas.setPointerCapture(e.pointerId);
  hideHelpSoon();
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) {
    let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
    const d = Math.hypot(dx, dy), max = 50;
    if (d > max) { dx *= max / d; dy *= max / d; }
    stick.x = dx / max; stick.y = dy / max;
    $('knob').style.transform = `translate(${dx}px,${dy}px)`;
    return;
  }
  const l = looks.get(e.pointerId);
  if (!l) return;
  cam.yaw -= (e.clientX - l.x) * 0.006;
  cam.pitch = Math.max(0.08, Math.min(1.35, cam.pitch + (e.clientY - l.y) * 0.004));
  l.x = e.clientX; l.y = e.clientY;
});
function endPointer(e) {
  if (e.pointerId === stick.id) {
    stick.id = null; stick.x = stick.y = 0;
    $('stick').style.display = 'none'; $('knob').style.transform = '';
  }
  looks.delete(e.pointerId);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(10, Math.min(70, cam.dist + e.deltaY * 0.03)); }, {passive:false});
canvas.addEventListener('contextmenu', e => e.preventDefault());
$('jump').addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); jumpQueued = true; });

function toggleSound() {
  muted = !muted;
  $('sound').textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem(SAVE_KEY + '.muted', muted ? '1' : '0'); } catch {}
}
$('sound').textContent = muted ? '🔇' : '🔊';
$('sound').addEventListener('click', () => { unlockAudio(); toggleSound(); });
$('gfx').addEventListener('click', () => {
  hd = !hd; applyGraphics();
  try { localStorage.setItem(SAVE_KEY + '.gfx', hd ? 'hd' : 'fast'); } catch {}
});
$('reset').addEventListener('click', () => {
  if (!confirm('Delete your factory and start over? This cannot be undone.')) return;
  resetting = true;
  try { localStorage.removeItem(SAVE_KEY); } catch {}
  location.reload();
});
let helpHidden = false;
function hideHelpSoon() {
  if (helpHidden) return;
  helpHidden = true;
  setTimeout(() => { $('help').style.opacity = 0; }, 6000);
}

// Earnings while the tab was closed or hidden land in the bank, to be
// collected from the pad like any other cash.
function creditAway(seconds) {
  if (seconds < 20) return;
  const earned = incomePerSecond() * Math.min(seconds, OFFLINE_CAP);
  if (earned < 1) return;
  state.bank += earned;
  toast(`While you were away: +${money(earned)} — collect it on the green pad`, 'gold');
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); }
  else if (hiddenAt) { creditAway((Date.now() - hiddenAt) / 1000); hiddenAt = 0; last = performance.now(); }
});
addEventListener('beforeunload', save);

// ----------------------------------------------------------------- boot --
const away = load();
for (const it of ITEMS) if (state.owned.has(it.id)) buildItem(it, false);
refreshButtons();
creditAway(away);
updateHud();
updateVisuals(0);
$('loading').remove();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
if (TEST) render(); else requestAnimationFrame(frame);

// Hooks for tests/tycoon.test.cjs.
window.tycoon = {state, player, cam, drops, buttons, ITEMS, short, incomePerSecond, update, render, save, load, purchase,
  teleport(x, z) { player.x = x; player.z = z; player.y = 0; player.vy = 0; },
  buttonPos, PAD, skipSaveOnUnload() { resetting = true; }};
</script>
</body>
